<!DOCTYPE html>
<html>
<head>
<title>yubaraj Passport Photo Maker</title>

<script type="module">
import { removeBackground } from 
"https://cdn.jsdelivr.net/npm/@imgly/background-removal/+esm";

window.removeBG = removeBackground;
window.aiReady = true;
</script>

<style>
body{
    font-family:Arial;
    text-align:center;
}

#preview{
    width:350px;
    height:450px;
    object-fit:cover;
    background:white;
    border:1px solid #999;
}

button{
    padding:10px 20px;
    margin:10px;
}

canvas{
    display:none;
}
</style>

</head>

<body>

<h2>AI Passport Photo Maker</h2>

<input type="file" id="file" accept="image/*">

<br>

<button onclick="processPhoto()">
Remove Background
</button>

<br>

<img id="preview">

<br>

<button onclick="downloadPhoto()">
Download Passport Photo
</button>


<canvas id="canvas" width="413" height="531"></canvas>


<script>

let finalImage="";

async function processPhoto(){

    if(!window.removeBG){
        alert("AI model loading... Please wait");
        return;
    }

    let file = document.getElementById("file").files[0];

    if(!file){
        alert("Select Photo");
        return;
    }

    try {

        // Remove background using AI
        let result = await window.removeBG(file);

        let img = new Image();

        img.onload = function(){

            let canvas = document.getElementById("canvas");
            let ctx = canvas.getContext("2d");

            // Clear canvas
            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            // White passport background
            ctx.fillStyle = "white";
            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            // Passport photo fit
            let scale = Math.min(
                canvas.width / img.width,
                canvas.height / img.height
            );


            let w = img.width * scale;
            let h = img.height * scale;


            // Center position
            let x = (canvas.width - w) / 2;
            let y = (canvas.height - h) / 2;


            ctx.drawImage(
                img,
                x,
                y,
                w,
                h
            );


            // Save final image
            finalImage = canvas.toDataURL(
                "image/jpeg",
                0.95
            );


            document.getElementById("preview").src =
            finalImage;

        };


        img.src = URL.createObjectURL(result);


    } catch(error){

        console.error(error);
        alert("Background remove failed. Try another photo.");

    }

}
function downloadPhoto(){

let a=document.createElement("a");

a.href=finalImage;

a.download="passport_photo.jpg";

a.click();

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CV & Resume Maker</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#eef2f3;
    font-family:Arial,Helvetica,sans-serif;
    color:#222;
}

.search-area{
    max-width:1000px;
    margin:0 auto 20px;
    background:white;
    padding:18px;
    border-radius:10px;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.search-area h2{
    margin:0 0 12px;
    color:#12665f;
    text-align:center;
}

.search-box{
    display:flex;
    gap:10px;
}

.search-box input{
    flex:1;
    padding:13px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
}

.search-box button{
    border:0;
    background:#176b65;
    color:white;
    padding:0 25px;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}

.search-box button:hover{
    background:#0e514c;
}

.message{
    text-align:center;
    margin-top:12px;
    font-weight:bold;
}

.cv-wrapper{
    display:none;
    max-width:1000px;
    margin:auto;
}

.cv{
    width:100%;
    min-height:1120px;
    background:white;
    display:grid;
    grid-template-columns:31% 69%;
    box-shadow:0 3px 15px rgba(0,0,0,.2);
}

/* LEFT SIDE */

.sidebar{
    background:#075d57;
    color:white;
    padding:28px 22px;
}

.photo-box{
    text-align:center;
    margin-bottom:28px;
}

.profile-photo{
    width:125px;
    height:125px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid white;
    background:#ddd;
}

.sidebar-title{
    font-size:18px;
    font-weight:bold;
    text-decoration:underline;
    margin:20px 0 14px;
}

.contact-item{
    margin-bottom:17px;
}

.contact-label{
    font-weight:bold;
    font-size:12px;
    margin-bottom:7px;
}

.contact-value{
    font-size:12px;
    line-height:1.5;
    word-break:break-word;
}

.skills-list{
    list-style:none;
    padding:0;
    margin:0;
}

.skills-list li{
    font-size:12px;
    margin-bottom:8px;
    line-height:1.35;
}

.skills-list li::before{
    content:"-";
    margin-right:5px;
}

/* RIGHT SIDE */

.content{
    padding:35px 32px;
}

.name{
    font-size:32px;
    font-weight:bold;
    color:#16243b;
    margin-bottom:25px;
}

.section-title{
    background:#128078;
    color:white;
    padding:9px 14px;
    border-radius:6px;
    font-size:15px;
    font-weight:bold;
    letter-spacing:1px;
    margin:18px 0 13px;
    text-transform:uppercase;
}

.summary{
    font-size:12px;
    line-height:1.65;
    text-align:left;
}

.work-item{
    margin-bottom:15px;
}

.work-job{
    color:#13766f;
    font-size:14px;
    font-weight:bold;
    margin-bottom:5px;
}

.work-company{
    font-size:13px;
    font-weight:bold;
    color:#444;
    margin-bottom:5px;
}

.work-date{
    color:#777;
    font-size:11px;
    margin-bottom:3px;
}

.work-location{
    color:#555;
    font-size:11px;
    margin-bottom:5px;
}

.work-description{
    font-size:11px;
    line-height:1.5;
}

.education{
    font-size:12px;
    line-height:1.5;
}

.languages{
    font-size:12px;
    line-height:1.5;
}

.responsibilities{
    font-size:12px;
    line-height:1.6;
}

.responsibilities div{
    margin-bottom:5px;
}

.print-btn{
    display:block;
    width:100%;
    max-width:1000px;
    margin:20px auto;
    padding:14px;
    border:0;
    border-radius:6px;
    background:#176b65;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.print-btn:hover{
    background:#0e514c;
}

.no-data{
    display:none;
    max-width:1000px;
    margin:20px auto;
    padding:20px;
    background:#ffe0e0;
    color:#b00000;
    border-radius:8px;
    text-align:center;
    font-weight:bold;
}

/* PRINT */

@media print{

    @page{
        size:A4;
        margin:0;
    }

    body{
        padding:0;
        margin:0;
        background:white;
    }

    .search-area,
    .print-btn,
    .message,
    .no-data{
        display:none !important;
    }

    .cv-wrapper{
        display:block !important;
        max-width:none;
        margin:0;
    }

    .cv{
        width:210mm;
        min-height:297mm;
        box-shadow:none;
        margin:0;
    }

    .sidebar{
        padding:20px 17px;
    }

    .content{
        padding:25px 25px;
    }

    .name{
        font-size:27px;
    }

    .section-title{
        font-size:13px;
        padding:8px 11px;
        margin-top:14px;
        margin-bottom:10px;
    }

    .summary{
        font-size:10.5px;
        line-height:1.5;
    }

    .work-item{
        margin-bottom:10px;
    }

    .work-job{
        font-size:12px;
    }

    .work-company{
        font-size:11px;
    }

    .work-date,
    .work-location,
    .work-description{
        font-size:9.5px;
    }

    .education,
    .languages,
    .responsibilities{
        font-size:10px;
    }

    .profile-photo{
        width:100px;
        height:100px;
    }

    .sidebar-title{
        font-size:15px;
    }

    .contact-value,
    .skills-list li{
        font-size:9.5px;
    }

    .contact-label{
        font-size:9.5px;
    }
}

@media(max-width:700px){

    body{
        padding:10px;
    }

    .search-box{
        flex-direction:column;
    }

    .search-box button{
        padding:13px;
    }

    .cv{
        grid-template-columns:1fr;
    }

    .sidebar{
        text-align:left;
    }

    .photo-box{
        text-align:center;
    }

    .content{
        padding:25px 20px;
    }

    .name{
        font-size:25px;
    }
}
</style>
</head>

<body>

<!-- SEARCH -->

<div class="search-area">

    <h2>CV & Resume Search</h2>

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Enter CV ID, Name, Phone or Email"
        >

        <button onclick="searchCV()">
            SEARCH
        </button>

    </div>

    <div class="message" id="message"></div>

</div>

<div class="no-data" id="noData">
    CV not found. Please check ID, Name, Phone or Email.
</div>


<!-- CV -->

<div class="cv-wrapper" id="cvWrapper">

    <div class="cv" id="cv">

        <!-- LEFT -->

        <aside class="sidebar">

            <div class="photo-box">

                <img
                    id="photo"
                    class="profile-photo"
                    src=""
                    alt="Profile Photo"
                    onerror="this.src='https://via.placeholder.com/200?text=Photo'"
                >

            </div>


            <div class="sidebar-title">
                Contact
            </div>


            <div class="contact-item">

                <div class="contact-label">
                    Location:
                </div>

                <div
                    class="contact-value"
                    id="location"
                ></div>

            </div>


            <div class="contact-item">

                <div class="contact-label">
                    Phone:
                </div>

                <div
                    class="contact-value"
                    id="phone"
                ></div>

            </div>


            <div class="contact-item">

                <div class="contact-label">
                    Email:
                </div>

                <div
                    class="contact-value"
                    id="email"
                ></div>

            </div>


            <div class="contact-item">

                <div class="contact-label">
                    DOB:
                </div>

                <div
                    class="contact-value"
                    id="dob"
                ></div>

            </div>


            <div class="contact-item">

                <div class="contact-label">
                    Gender:
                </div>

                <div
                    class="contact-value"
                    id="gender"
                ></div>

            </div>


            <div class="contact-item">

                <div class="contact-label">
                    Nationality:
                </div>

                <div
                    class="contact-value"
                    id="nationality"
                ></div>

            </div>


            <!-- SKILLS -->

            <div class="sidebar-title">
                Skills
            </div>

            <ul
                class="skills-list"
                id="skills"
            ></ul>


            <!-- LANGUAGES -->

            <div class="sidebar-title">
                Languages
            </div>

            <div
                class="contact-value"
                id="languages"
            ></div>

        </aside>


        <!-- RIGHT -->

        <main class="content">

            <div
                class="name"
                id="fullName"
            ></div>


            <!-- SUMMARY -->

            <div class="section-title">
                Professional Summary
            </div>

            <div
                class="summary"
                id="summary"
            ></div>


            <!-- WORK HISTORY -->

            <div class="section-title">
                Work History
            </div>


            <div
                id="workHistory"
            ></div>


            <!-- EDUCATION -->

            <div class="section-title">
                Education
            </div>

            <div
                class="education"
                id="education"
            ></div>


            <!-- RESPONSIBILITIES -->

            <div class="section-title">
                Responsibilities
            </div>

            <div
                class="responsibilities"
                id="responsibilities"
            ></div>

        </main>

    </div>

</div>


<button
    class="print-btn"
    id="printBtn"
    onclick="printCV()"
    style="display:none;"
>
    🖨️ Print / Save CV as PDF
</button>


<script>

/* =========================================
   GOOGLE SHEET CSV
========================================= */

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSuLfJpHVdcwhskx36i4OE0BdWWHTNs4dpKMv-bJ5DvrvD9MhZD1DMlwypSR5Z4aT0ieJygDLVCMO2s/pub?gid=0&single=true&output=csv";


let cvData = [];


/* =========================================
   CSV PARSER
========================================= */

function parseCSV(text){

    const rows = [];

    let row = [];
    let value = "";
    let insideQuotes = false;

    for(let i=0;i<text.length;i++){

        const char = text[i];
        const next = text[i+1];

        if(char === '"' && insideQuotes && next === '"'){

            value += '"';
            i++;

        }else if(char === '"'){

            insideQuotes = !insideQuotes;

        }else if(char === ',' && !insideQuotes){

            row.push(value);
            value = "";

        }else if((char === '\n' || char === '\r') && !insideQuotes){

            if(char === '\r' && next === '\n'){
                i++;
            }

            row.push(value);
            rows.push(row);

            row = [];
            value = "";

        }else{

            value += char;

        }
    }

    if(value.length || row.length){

        row.push(value);
        rows.push(row);

    }

    return rows;
}


/* =========================================
   LOAD DATA
========================================= */

async function loadData(){

    try{

        document.getElementById("message").innerText =
            "Loading CV data...";

        const response = await fetch(
            CSV_URL + "&t=" + Date.now()
        );

        if(!response.ok){
            throw new Error("Google Sheet could not be loaded");
        }

        const text = await response.text();

        const rows = parseCSV(text);

        if(rows.length < 2){
            throw new Error("No CV data found");
        }

        const headers = rows[0].map(h =>
            h.trim().replace(/^"|"$/g,"")
        );

        cvData = rows.slice(1)
            .filter(row =>
                row.some(value => value.trim() !== "")
            )
            .map(row => {

                const obj = {};

                headers.forEach((header,index)=>{
                    obj[header] =
                        (row[index] || "").trim();
                });

                return obj;

            });

        document.getElementById("message").innerText =
            cvData.length + " CV record(s) loaded";

        console.log("CV DATA:",cvData);

    }catch(error){

        console.error(error);

        document.getElementById("message").innerText =
            "Unable to load CV data.";

    }

}


/* =========================================
   SEARCH
========================================= */

function searchCV(){

    const input =
        document.getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    const noData =
        document.getElementById("noData");

    const wrapper =
        document.getElementById("cvWrapper");

    const printBtn =
        document.getElementById("printBtn");


    if(!input){

        noData.style.display = "block";
        noData.innerText =
            "Please enter CV ID, Name, Phone or Email.";

        wrapper.style.display = "none";
        printBtn.style.display = "none";

        return;
    }


    const result = cvData.find(item => {

        return (

            String(item.ID || "")
                .toLowerCase()
                .includes(input)

            ||

            String(item.Full_Name || "")
                .toLowerCase()
                .includes(input)

            ||

            String(item.Phone || "")
                .toLowerCase()
                .includes(input)

            ||

            String(item.Email || "")
                .toLowerCase()
                .includes(input)

        );

    });


    if(!result){

        noData.style.display = "block";

        wrapper.style.display = "none";

        printBtn.style.display = "none";

        return;

    }


    noData.style.display = "none";

    displayCV(result);

}


/* =========================================
   DISPLAY CV
========================================= */

function displayCV(data){

    const wrapper =
        document.getElementById("cvWrapper");

    const printBtn =
        document.getElementById("printBtn");


    /* NAME */

    document.getElementById("fullName").innerText =
        data.Full_Name || "";


    /* CONTACT */

    document.getElementById("location").innerText =
        data.Location || "";

    document.getElementById("phone").innerText =
        data.Phone || "";

    document.getElementById("email").innerText =
        data.Email || "";

    document.getElementById("dob").innerText =
        formatDate(data.DOB);

    document.getElementById("gender").innerText =
        data.Gender || "";

    document.getElementById("nationality").innerText =
        data.Nationality || "";


    /* PHOTO */

    const photo =
        document.getElementById("photo");

    let imageURL =
        data.CV_Image_Link || "";

    imageURL = cleanImageURL(imageURL);

    if(imageURL){

        photo.src = imageURL;

    }else{

        photo.src =
            "https://via.placeholder.com/200?text=Photo";

    }


    /* SUMMARY */

    document.getElementById("summary").innerText =
        data.Professional_Summary || "";


    /* SKILLS */

    const skillsBox =
        document.getElementById("skills");

    skillsBox.innerHTML = "";

    if(data.Skills){

        const skills =
            data.Skills
            .split(/[,|;]/)
            .map(x=>x.trim())
            .filter(Boolean);

        skills.forEach(skill=>{

            const li =
                document.createElement("li");

            li.innerText = skill;

            skillsBox.appendChild(li);

        });

    }


    /* LANGUAGES */

    document.getElementById("languages").innerText =
        data.Languages || "";


    /* WORK HISTORY */

    const workBox =
        document.getElementById("workHistory");

    workBox.innerHTML = "";


    for(let i=1;i<=3;i++){

        const job =
            data["Job_Title_"+i] || "";

        const company =
            data["Company_"+i] || "";

        const start =
            data["Start_Date_"+i] || "";

        const end =
            data["End_Date_"+i] || "";

        const location =
            data["Work_Location_"+i] || "";

        const description =
            data["Work_Description_"+i] || "";


        /* Skip completely empty work history */

        if(
            !job &&
            !company &&
            !start &&
            !end &&
            !location &&
            !description
        ){

            continue;

        }


        const item =
            document.createElement("div");

        item.className = "work-item";


        item.innerHTML = `

            <div class="work-job">
                ${escapeHTML(job)}
            </div>

            <div class="work-company">
                ${escapeHTML(company)}
            </div>

            <div class="work-date">
                ${escapeHTML(start)}
                ${start || end ? " - " : ""}
                ${escapeHTML(end)}
            </div>

            <div class="work-location">
                ${escapeHTML(location)}
            </div>

            <div class="work-description">
                ${escapeHTML(description)}
            </div>

        `;


        workBox.appendChild(item);

    }


    /* EDUCATION */

    document.getElementById("education").innerText =
        data.Education || "";


    /* RESPONSIBILITIES */

    const responsibilityBox =
        document.getElementById("responsibilities");

    responsibilityBox.innerHTML = "";


    for(let i=1;i<=3;i++){

        const value =
            data["Responsibility_"+i] || "";

        if(!value) continue;


        const div =
            document.createElement("div");

        div.innerHTML =
            "• " + escapeHTML(value);

        responsibilityBox.appendChild(div);

    }


    wrapper.style.display = "block";

    printBtn.style.display = "block";


    /* Scroll to CV */

    setTimeout(()=>{

        wrapper.scrollIntoView({
            behavior:"smooth",
            block:"start"
        });

    },100);

}


/* =========================================
   IMAGE URL CLEANER
========================================= */

function cleanImageURL(url){

    if(!url) return "";

    url = url.trim();

    /*
       Google Sheet cell may contain:
       https://i.ibb.co/xxxxx/photo.jpg
       or HTML/image link.
    */

    if(url.includes("<")){

        const match =
            url.match(/https?:\/\/[^"'<> ]+/);

        if(match){
            url = match[0];
        }

    }


    /*
       If ImgBB viewer link is stored,
       try to extract direct image URL.
    */

    if(
        url.includes("ibb.co/") &&
        !url.includes("i.ibb.co/")
    ){

        /*
          Direct image URL should preferably
          be stored in CV_Image_Link.
          This keeps the image loading reliable.
        */

    }


    return url;

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================
   DATE FORMAT
========================================= */

function formatDate(value){

    if(!value) return "";

    return String(value);

}


/* =========================================
   PRINT
========================================= */

function printCV(){

    window.print();

}


/* =========================================
   ENTER KEY SEARCH
========================================= */

document
.getElementById("searchInput")
.addEventListener("keydown",function(event){

    if(event.key === "Enter"){

        searchCV();

    }

});


/* =========================================
   START
========================================= */

loadData();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>CV Search & Print</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f3f5f7;
  padding:20px;
  color:#222;
}

.search-box{
  max-width:1000px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:12px;
  box-shadow:0 3px 15px #0002;
}

.search-box h2{
  text-align:center;
  color:#176b65;
  margin-bottom:20px;
}

.search-row{
  display:flex;
  gap:10px;
}

.search-row input{
  flex:1;
  padding:14px;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:16px;
}

button{
  border:0;
  background:#176b65;
  color:white;
  padding:13px 20px;
  border-radius:7px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#10534e;
}

#message{
  margin-top:15px;
  padding:12px;
  border-radius:7px;
  display:none;
}

.error{
  display:block!important;
  background:#ffe1e1;
  color:#b00000;
}

.success{
  display:block!important;
  background:#dff6e9;
  color:#116b40;
}


/* CV */

#cvArea{
  max-width:1000px;
  margin:25px auto;
  display:none;
}

.cv{
  background:white;
  min-height:1120px;
  display:grid;
  grid-template-columns:260px 1fr;
  box-shadow:0 3px 15px #0002;
}

.left{
  background:#12645e;
  color:white;
  padding:30px 22px;
}

.right{
  padding:35px 30px;
}

.photo{
  width:120px;
  height:120px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  margin:0 auto 25px;
  border:4px solid white;
}

.name{
  font-size:28px;
  font-weight:bold;
  margin-bottom:25px;
}

.left-title{
  font-size:18px;
  font-weight:bold;
  text-decoration:underline;
  margin:22px 0 12px;
}

.contact-item{
  margin-bottom:15px;
  line-height:1.5;
  font-size:14px;
}

.skill{
  margin:7px 0;
  font-size:14px;
}

.language{
  font-size:14px;
  line-height:1.5;
}

.section{
  margin-bottom:25px;
}

.section-title{
  background:#176b65;
  color:white;
  padding:9px 13px;
  border-radius:6px;
  font-size:17px;
  font-weight:bold;
  text-transform:uppercase;
  margin-bottom:14px;
}

.summary{
  font-size:14px;
  line-height:1.7;
}

.work{
  margin-bottom:20px;
}

.work-job{
  color:#176b65;
  font-size:16px;
  font-weight:bold;
}

.work-company{
  font-weight:bold;
  margin-top:5px;
}

.work-date,
.work-location{
  font-size:12px;
  color:#666;
  margin-top:5px;
}

.work-description{
  font-size:13px;
  line-height:1.6;
  margin-top:7px;
}

.responsibility{
  font-size:14px;
  line-height:1.6;
  margin-bottom:8px;
}

.print-btn{
  margin-top:20px;
  width:100%;
}


/* MOBILE */

@media(max-width:700px){

  body{
    padding:10px;
  }

  .search-row{
    flex-direction:column;
  }

  .cv{
    grid-template-columns:1fr;
  }

  .left{
    padding:25px;
  }

  .right{
    padding:25px 20px;
  }

  .name{
    text-align:center;
  }
}


/* PRINT */

@media print{

  body{
    background:white;
    padding:0;
  }

  .search-box,
  .print-btn{
    display:none!important;
  }

  #cvArea{
    display:block!important;
    margin:0;
  }

  .cv{
    box-shadow:none;
    min-height:auto;
  }

  @page{
    size:A4;
    margin:0;
  }
}
</style>
</head>

<body>


<!-- SEARCH -->

<div class="search-box">

<h2>Search CV Application</h2>

<div class="search-row">

<input
  type="text"
  id="searchInput"
  placeholder="Enter Application ID, Name, Email or Phone"
>

<button onclick="searchCV()">
Search
</button>

</div>

<div id="message"></div>

</div>


<!-- CV -->

<div id="cvArea">

<div class="cv">

<!-- LEFT -->

<div class="left">

<img
  id="cvPhoto"
  class="photo"
  src=""
  alt="Profile Photo"
  onerror="this.style.display='none'"
>

<div class="name" id="cvName"></div>


<div class="left-title">
CONTACT
</div>

<div class="contact-item">
<strong>Location:</strong><br>
<span id="cvLocation"></span>
</div>

<div class="contact-item">
<strong>Phone:</strong><br>
<span id="cvPhone"></span>
</div>

<div class="contact-item">
<strong>Email:</strong><br>
<span id="cvEmail"></span>
</div>

<div class="contact-item">
<strong>DOB:</strong><br>
<span id="cvDob"></span>
</div>

<div class="contact-item">
<strong>Gender:</strong><br>
<span id="cvGender"></span>
</div>

<div class="contact-item">
<strong>Nationality:</strong><br>
<span id="cvNationality"></span>
</div>


<div class="left-title">
SKILLS
</div>

<div id="cvSkills"></div>


<div class="left-title">
LANGUAGES
</div>

<div class="language" id="cvLanguages"></div>

</div>


<!-- RIGHT -->

<div class="right">


<!-- SUMMARY -->

<div class="section">

<div class="section-title">
Professional Summary
</div>

<div
  class="summary"
  id="cvSummary">
</div>

</div>


<!-- WORK HISTORY -->

<div class="section">

<div class="section-title">
Work History
</div>

<div id="workHistory"></div>

</div>


<!-- EDUCATION -->

<div class="section">

<div class="section-title">
Education
</div>

<div id="cvEducation"></div>

</div>


<!-- RESPONSIBILITIES -->

<div class="section">

<div class="section-title">
Responsibilities
</div>

<div id="responsibilities"></div>

</div>


</div>

</div>


<button
  class="print-btn"
  onclick="window.print()">
Print / Save as PDF
</button>

</div>


<script>

/* =====================================================
   GOOGLE SHEET CSV
===================================================== */

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSuLfJpHVdcwhskx36i4OE0BdWWHTNs4dpKMv-bJ5DvrvD9MhZD1DMlwypSR5Z4aT0ieJygDLVCMO2s/pub?gid=0&single=true&output=csv";


let applications = [];


/* =====================================================
   CSV PARSER
===================================================== */

function parseCSV(text){

  const rows=[];
  let row=[];
  let cell="";
  let insideQuotes=false;

  for(let i=0;i<text.length;i++){

    const char=text[i];
    const next=text[i+1];

    if(char === '"' && insideQuotes && next === '"'){
      cell+='"';
      i++;
      continue;
    }

    if(char === '"'){
      insideQuotes=!insideQuotes;
      continue;
    }

    if(char === ',' && !insideQuotes){
      row.push(cell);
      cell="";
      continue;
    }

    if((char === '\n' || char === '\r') && !insideQuotes){

      if(char === '\r' && next === '\n') i++;

      row.push(cell);
      cell="";

      if(row.some(x=>x.trim()!=="")){
        rows.push(row);
      }

      row=[];
      continue;
    }

    cell+=char;
  }

  if(cell!=="" || row.length){
    row.push(cell);
    rows.push(row);
  }

  if(!rows.length) return [];

  const headers=rows[0].map(h=>
    cleanKey(h)
  );

  return rows.slice(1).map(r=>{

    const obj={};

    headers.forEach((h,i)=>{
      obj[h]=(r[i] || "").trim();
    });

    return obj;

  });
}


/* =====================================================
   HEADER CLEANER
===================================================== */

function cleanKey(key){

  return String(key || "")
    .trim()
    .toLowerCase()
    .replace(/[\s_\-\/]+/g,"")
    .replace(/[()]/g,"");

}


/* =====================================================
   FIND FIELD
===================================================== */

function getField(obj,names){

  for(const name of names){

    const key=cleanKey(name);

    if(
      Object.prototype.hasOwnProperty.call(obj,key) &&
      obj[key] !== undefined &&
      String(obj[key]).trim() !== ""
    ){

      return String(obj[key]).trim();

    }

  }

  return "";
}


/* =====================================================
   LOAD GOOGLE SHEET
===================================================== */

async function loadApplications(){

  showMessage(
    "Loading CV applications...",
    "success"
  );

  try{

    const response=await fetch(
      CSV_URL + "&t=" + Date.now()
    );

    if(!response.ok){
      throw new Error(
        "Google Sheet could not be loaded"
      );
    }

    const csv=await response.text();

    applications=parseCSV(csv);

    console.log("Applications:",applications);

    if(!applications.length){

      throw new Error(
        "No data found in Google Sheet"
      );

    }

    hideMessage();

  }catch(error){

    console.error(error);

    showMessage(
      "Google Sheet load failed: " + error.message,
      "error"
    );

  }

}


/* =====================================================
   SEARCH
===================================================== */

async function searchCV(){

  const search=
    document.getElementById("searchInput")
    .value
    .trim()
    .toLowerCase();

  if(!search){

    showMessage(
      "Please enter Application ID, Name, Email or Phone.",
      "error"
    );

    return;
  }


  if(!applications.length){
    await loadApplications();
  }


  const result=applications.find(item=>{

    const id=getField(item,[
      "id",
      "applicationId",
      "application_id",
      "cvId",
      "cv_id"
    ]).toLowerCase();

    const name=getField(item,[
      "fullName",
      "name",
      "fullname"
    ]).toLowerCase();

    const email=getField(item,[
      "email",
      "customerEmail"
    ]).toLowerCase();

    const phone=getField(item,[
      "phone",
      "mobile",
      "phoneNumber"
    ]).toLowerCase();


    return (
      id===search ||
      name===search ||
      email===search ||
      phone===search
    );

  });


  if(!result){

    document.getElementById("cvArea").style.display="none";

    showMessage(
      "CV Application not found.",
      "error"
    );

    return;
  }


  showCV(result);

}


/* =====================================================
   SHOW CV
===================================================== */

function showCV(data){

  document.getElementById("cvArea")
    .style.display="block";


  /* NAME */

  document.getElementById("cvName").textContent=
    getField(data,[
      "fullName",
      "name"
    ]);


  /* PHOTO */

  const photo=getField(data,[
    "profilePhoto",
    "photo",
    "photoUrl",
    "image",
    "imageUrl",
    "imgbb",
    "imgbbUrl",
    "profileImage"
  ]);

  const photoElement=
    document.getElementById("cvPhoto");


  if(photo){

    photoElement.src=photo;
    photoElement.style.display="block";

  }else{

    photoElement.style.display="none";

  }


  /* CONTACT */

  document.getElementById("cvLocation").textContent=
    getField(data,[
      "location"
    ]);

  document.getElementById("cvPhone").textContent=
    getField(data,[
      "phone",
      "mobile"
    ]);

  document.getElementById("cvEmail").textContent=
    getField(data,[
      "email"
    ]);

  document.getElementById("cvDob").textContent=
    getField(data,[
      "dob",
      "dateOfBirth",
      "dateofbirth"
    ]);

  document.getElementById("cvGender").textContent=
    getField(data,[
      "gender"
    ]);

  document.getElementById("cvNationality").textContent=
    getField(data,[
      "nationality"
    ]);


  /* SUMMARY */

  document.getElementById("cvSummary").textContent=
    getField(data,[
      "professionalSummary",
      "summary",
      "professional_summary"
    ]);


  /* SKILLS */

  const skills=
    getField(data,[
      "skills",
      "skill"
    ]);

  const skillBox=
    document.getElementById("cvSkills");

  skillBox.innerHTML="";

  if(skills){

    skills
      .split(/[,|]/)
      .map(s=>s.trim())
      .filter(Boolean)
      .forEach(skill=>{

        const div=
          document.createElement("div");

        div.className="skill";

        div.textContent="- " + skill;

        skillBox.appendChild(div);

      });

  }


  /* LANGUAGES */

  document.getElementById("cvLanguages").textContent=
    getField(data,[
      "languages",
      "language"
    ]);


  /* EDUCATION */

  document.getElementById("cvEducation").textContent=
    getField(data,[
      "education",
      "qualification"
    ]);


  /* WORK HISTORY */

  renderWorkHistory(data);


  /* RESPONSIBILITIES */

  renderResponsibilities(data);


  hideMessage();

  window.scrollTo({
    top:document.getElementById("cvArea").offsetTop-10,
    behavior:"smooth"
  });

}


/* =====================================================
   WORK HISTORY 1,2,3
===================================================== */

function renderWorkHistory(data){

  const box=
    document.getElementById("workHistory");

  box.innerHTML="";


  for(let i=1;i<=3;i++){

    const job=getField(data,[
      "jobTitle"+i,
      "jobtitle"+i
    ]);

    const company=getField(data,[
      "companyName"+i,
      "companyname"+i,
      "company"+i
    ]);

    const start=getField(data,[
      "startDate"+i,
      "startdate"+i
    ]);

    const end=getField(data,[
      "endDate"+i,
      "enddate"+i
    ]);

    const location=getField(data,[
      "workLocation"+i,
      "worklocation"+i,
      "location"+i
    ]);

    const description=getField(data,[
      "workDescription"+i,
      "workdescription"+i,
      "description"+i
    ]);


    /* Don't display empty work history */

    if(
      !job &&
      !company &&
      !start &&
      !end &&
      !location &&
      !description
    ){
      continue;
    }


    const work=
      document.createElement("div");

    work.className="work";


    const jobElement=
      document.createElement("div");

    jobElement.className="work-job";

    jobElement.textContent=job;


    const companyElement=
      document.createElement("div");

    companyElement.className="work-company";

    companyElement.textContent=company;


    const dateElement=
      document.createElement("div");

    dateElement.className="work-date";

    if(start || end){

      dateElement.textContent=
        start + (start && end ? " - " : "") + end;

    }


    const locationElement=
      document.createElement("div");

    locationElement.className="work-location";

    locationElement.textContent=location;


    const descriptionElement=
      document.createElement("div");

    descriptionElement.className="work-description";

    descriptionElement.textContent=description;


    work.appendChild(jobElement);
    work.appendChild(companyElement);
    work.appendChild(dateElement);
    work.appendChild(locationElement);
    work.appendChild(descriptionElement);

    box.appendChild(work);

  }

}


/* =====================================================
   RESPONSIBILITIES
===================================================== */

function renderResponsibilities(data){

  const box=
    document.getElementById("responsibilities");

  box.innerHTML="";


  for(let i=1;i<=3;i++){

    const value=getField(data,[
      "responsibility"+i,
      "responsibilities"+i,
      "responsibility_"+i
    ]);


    if(!value) continue;


    const div=
      document.createElement("div");

    div.className="responsibility";

    div.textContent=
      "• " + value;

    box.appendChild(div);

  }

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type){

  const box=
    document.getElementById("message");

  box.textContent=text;

  box.className=type;

  box.style.display="block";

}


function hideMessage(){

  const box=
    document.getElementById("message");

  box.style.display="none";

}


/* =====================================================
   START
===================================================== */

loadApplications();

</script>

</body>
</html>

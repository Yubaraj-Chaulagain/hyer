<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV Search & Print</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#f3f5f7;
  padding:20px;
  color:#222;
}

.container{
  max-width:1100px;
  margin:auto;
}

/* SEARCH */
.search-box{
  background:#fff;
  padding:25px;
  border-radius:12px;
  box-shadow:0 3px 15px rgba(0,0,0,.10);
  margin-bottom:20px;
}

.search-box h1{
  text-align:center;
  color:#176b65;
  margin-bottom:20px;
}

.search-row{
  display:flex;
  gap:10px;
}

.search-row input{
  flex:1;
  padding:14px;
  border:1px solid #ccc;
  border-radius:7px;
  font-size:16px;
}

.search-row button{
  padding:14px 25px;
  border:0;
  border-radius:7px;
  background:#176b65;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.search-row button:hover{
  background:#104e4a;
}

/* MESSAGE */
.message{
  background:#fff;
  padding:15px;
  border-radius:8px;
  margin-top:15px;
  text-align:center;
}

/* RESULTS */
#results{
  margin-bottom:20px;
}

.result-card{
  background:#fff;
  padding:20px;
  border-radius:10px;
  margin-bottom:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.result-card h3{
  color:#176b65;
  margin-bottom:8px;
}

.result-card p{
  margin:5px 0;
}

.view-btn{
  margin-top:12px;
  padding:10px 20px;
  background:#176b65;
  color:#fff;
  border:0;
  border-radius:6px;
  cursor:pointer;
}

/* CV */
#cvArea{
  display:none;
}

.cv{
  max-width:950px;
  margin:20px auto;
  background:#fff;
  box-shadow:0 3px 15px rgba(0,0,0,.15);
  display:grid;
  grid-template-columns:270px 1fr;
  overflow:hidden;
}

.left{
  background:#105f59;
  color:#fff;
  padding:28px 22px;
}

.right{
  padding:30px;
}

/* PHOTO */
.profile{
  text-align:center;
  margin-bottom:25px;
}

#cvPhoto{
  width:125px;
  height:125px;
  object-fit:cover;
  border-radius:50%;
  border:4px solid #fff;
  display:none;
  margin:0 auto 15px;
}

.profile h1{
  font-size:25px;
  line-height:1.3;
}

/* LEFT */
.left-title{
  font-size:17px;
  font-weight:bold;
  border-bottom:2px solid #fff;
  padding-bottom:7px;
  margin:25px 0 14px;
}

.contact-item{
  margin-bottom:13px;
  word-break:break-word;
}

.contact-item strong{
  display:block;
  font-size:12px;
  margin-bottom:4px;
}

.contact-item span{
  font-size:13px;
  line-height:1.5;
}

.skill{
  font-size:13px;
  margin:8px 0;
  line-height:1.4;
}

.language{
  font-size:13px;
  line-height:1.6;
}

/* RIGHT */
.section{
  margin-bottom:27px;
}

.right h2{
  background:#176b65;
  color:#fff;
  padding:10px 14px;
  border-radius:6px;
  font-size:17px;
  margin-bottom:15px;
}

.summary{
  font-size:13px;
  line-height:1.7;
  text-align:justify;
  white-space:pre-line;
}

/* WORK */
.work{
  margin-bottom:22px;
  padding-bottom:15px;
  border-bottom:1px solid #ddd;
}

.work:last-child{
  border-bottom:0;
}

.job-title{
  color:#176b65;
  font-size:16px;
  font-weight:bold;
}

.company{
  font-size:14px;
  font-weight:bold;
  margin-top:5px;
}

.date,
.work-location{
  font-size:12px;
  color:#666;
  margin-top:4px;
}

.description{
  font-size:13px;
  line-height:1.65;
  margin-top:8px;
  white-space:pre-line;
}

/* RESPONSIBILITIES */
.responsibility{
  font-size:13px;
  line-height:1.6;
  margin-bottom:9px;
}

/* ACTIONS */
.cv-actions{
  max-width:950px;
  margin:15px auto;
  display:flex;
  gap:10px;
}

.cv-actions button{
  flex:1;
  padding:14px;
  border:0;
  border-radius:7px;
  background:#176b65;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.cv-actions .close{
  background:#555;
}

/* MOBILE */
@media(max-width:700px){

  body{
    padding:10px;
  }

  .search-row{
    flex-direction:column;
  }

  .cv{
    grid-template-columns:1fr;
  }

  .left,
  .right{
    padding:22px;
  }

  .cv-actions{
    flex-direction:column;
  }
}

/* PRINT */
@media print{

  body{
    background:#fff;
    padding:0;
  }

  .search-box,
  #results,
  .cv-actions,
  #loading{
    display:none !important;
  }

  #cvArea{
    display:block !important;
  }

  .cv{
    display:grid;
    width:100%;
    max-width:none;
    margin:0;
    box-shadow:none;
  }

  @page{
    size:A4;
    margin:0;
  }
}
</style>
</head>

<body>

<div class="container">

<!-- SEARCH -->
<div class="search-box">

  <h1>Search CV</h1>

  <div class="search-row">

    <input
      type="text"
      id="searchInput"
      placeholder="Search CV ID, Name, Phone or Email"
    >

    <button onclick="searchCV()">
      🔎 Search
    </button>

  </div>

  <div id="loading" class="message">
    Loading CV database...
  </div>

</div>


<!-- RESULTS -->
<div id="results"></div>


<!-- CV -->
<div id="cvArea">

<div class="cv">

<!-- LEFT -->
<div class="left">

  <div class="profile">

    <img id="cvPhoto" alt="Profile Photo">

    <h1 id="cvName"></h1>

  </div>


  <div class="left-title">CONTACT</div>

  <div class="contact-item">
    <strong>Location</strong>
    <span id="cvLocation"></span>
  </div>

  <div class="contact-item">
    <strong>Phone</strong>
    <span id="cvPhone"></span>
  </div>

  <div class="contact-item">
    <strong>Email</strong>
    <span id="cvEmail"></span>
  </div>

  <div class="contact-item">
    <strong>Date of Birth</strong>
    <span id="cvDob"></span>
  </div>

  <div class="contact-item">
    <strong>Gender</strong>
    <span id="cvGender"></span>
  </div>

  <div class="contact-item">
    <strong>Nationality</strong>
    <span id="cvNationality"></span>
  </div>


  <div class="left-title">SKILLS</div>

  <div id="cvSkills"></div>


  <div class="left-title">LANGUAGES</div>

  <div
    class="language"
    id="cvLanguages">
  </div>

</div>


<!-- RIGHT -->
<div class="right">

  <!-- SUMMARY -->
  <div class="section">

    <h2>PROFESSIONAL SUMMARY</h2>

    <div
      class="summary"
      id="cvSummary">
    </div>

  </div>


  <!-- WORK HISTORY -->
  <div class="section">

    <h2>WORKING HISTORY</h2>


    <div class="work" id="work1">

      <div
        class="job-title"
        id="jobTitle1">
      </div>

      <div
        class="company"
        id="company1">
      </div>

      <div
        class="date"
        id="date1">
      </div>

      <div
        class="work-location"
        id="location1">
      </div>

      <div
        class="description"
        id="description1">
      </div>

    </div>


    <div class="work" id="work2">

      <div
        class="job-title"
        id="jobTitle2">
      </div>

      <div
        class="company"
        id="company2">
      </div>

      <div
        class="date"
        id="date2">
      </div>

      <div
        class="work-location"
        id="location2">
      </div>

      <div
        class="description"
        id="description2">
      </div>

    </div>


    <div class="work" id="work3">

      <div
        class="job-title"
        id="jobTitle3">
      </div>

      <div
        class="company"
        id="company3">
      </div>

      <div
        class="date"
        id="date3">
      </div>

      <div
        class="work-location"
        id="location3">
      </div>

      <div
        class="description"
        id="description3">
      </div>

    </div>

  </div>


  <!-- EDUCATION -->
  <div class="section">

    <h2>EDUCATION</h2>

    <div
      class="education"
      id="cvEducation">
    </div>

  </div>


  <!-- RESPONSIBILITIES -->
  <div class="section">

    <h2>RESPONSIBILITIES</h2>

    <div
      class="responsibility"
      id="responsibility1">
    </div>

    <div
      class="responsibility"
      id="responsibility2">
    </div>

    <div
      class="responsibility"
      id="responsibility3">
    </div>

  </div>

</div>

</div>


<div class="cv-actions">

  <button onclick="window.print()">
    🖨️ Print / Save PDF
  </button>

  <button
    class="close"
    onclick="closeCV()">
    ✕ Close
  </button>

</div>

</div>

</div>


<script>

/* =====================================================
GOOGLE SHEET CSV
===================================================== */

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vSuLfJpHVdcwhskx36i4OE0BdWWHTNs4dpKMv-bJ5DvrvD9MhZD1DMlwypSR5Z4aT0ieJygDLVCMO2s/pub?gid=0&single=true&output=csv";


let cvData=[];


/* =====================================================
CSV PARSER
===================================================== */

function parseCSV(text){

  const rows=[];
  let row=[];
  let value="";
  let quotes=false;

  for(let i=0;i<text.length;i++){

    const c=text[i];
    const n=text[i+1];

    if(c==='"' && quotes && n==='"'){
      value+='"';
      i++;
      continue;
    }

    if(c==='"'){
      quotes=!quotes;
      continue;
    }

    if(c===',' && !quotes){

      row.push(value);
      value="";
      continue;
    }

    if((c==='\n'||c==='\r')&&!quotes){

      if(c==='\r'&&n==='\n'){
        i++;
      }

      row.push(value);
      value="";

      if(row.some(x=>x.trim()!=="")){
        rows.push(row);
      }

      row=[];
      continue;
    }

    value+=c;
  }

  if(value!==""||row.length){

    row.push(value);

    if(row.some(x=>x.trim()!=="")){
      rows.push(row);
    }

  }

  return rows;
}


/* =====================================================
NORMALIZE HEADER
===================================================== */

function normalizeHeader(str){

  return String(str||"")
    .trim()
    .toLowerCase()
    .replace(/[\s_\-\/]+/g,"")
    .replace(/[()]/g,"");
}


/* =====================================================
LOAD SHEET
===================================================== */

async function loadData(){

  try{

    const response=
      await fetch(
        CSV_URL+"&t="+Date.now()
      );

    if(!response.ok){
      throw new Error("Sheet loading failed");
    }

    const text=
      await response.text();

    const rows=
      parseCSV(text);

    if(rows.length<2){
      throw new Error("No data found");
    }

    const headers=
      rows[0].map(h=>h.trim());

    cvData=
      rows.slice(1)
      .filter(row=>
        row.some(cell=>cell.trim()!=="")
      )
      .map(row=>{

        const obj={};

        headers.forEach((header,index)=>{

          obj[header]=
            row[index]||"";

        });

        return obj;

      });


    document.getElementById("loading")
      .innerHTML=
      "✓ CV database loaded";


    setTimeout(()=>{
      document.getElementById("loading")
        .style.display="none";
    },1200);

    console.log("Headers:",headers);
    console.log("CV Data:",cvData);

  }
  catch(error){

    console.error(error);

    document.getElementById("loading")
      .innerHTML=
      "❌ Unable to load CV database";

  }

}


/* =====================================================
GET FIELD - FLEXIBLE
===================================================== */

function getField(obj,possibleNames){

  const keys=
    Object.keys(obj);

  for(const wanted of possibleNames){

    const wantedNorm=
      normalizeHeader(wanted);

    for(const key of keys){

      if(
        normalizeHeader(key)===
        wantedNorm
      ){

        const value=
          String(obj[key]||"").trim();

        if(value){
          return value;
        }

      }

    }

  }

  return "";
}


/* =====================================================
SEARCH
===================================================== */

function searchCV(){

  const q=
    document.getElementById(
      "searchInput"
    ).value
    .trim()
    .toLowerCase();

  const results=
    document.getElementById("results");

  results.innerHTML="";


  if(!q){

    results.innerHTML=
      `<div class="message">
       Please enter CV ID, Name, Phone or Email.
       </div>`;

    return;
  }


  const found=
    cvData.filter(cv=>{

      const id=
        getField(cv,[
          "CV ID",
          "cv_id",
          "id",
          "application id"
        ]).toLowerCase();

      const name=
        getField(cv,[
          "Full Name",
          "fullName",
          "Name"
        ]).toLowerCase();

      const phone=
        getField(cv,[
          "Phone",
          "phone",
          "Mobile"
        ]).toLowerCase();

      const email=
        getField(cv,[
          "Email",
          "email"
        ]).toLowerCase();

      return(
        id.includes(q)||
        name.includes(q)||
        phone.includes(q)||
        email.includes(q)
      );

    });


  if(!found.length){

    results.innerHTML=
      `<div class="message">
       ❌ No CV found.
       </div>`;

    return;
  }


  found.forEach(cv=>{

    const name=
      getField(cv,[
        "Full Name",
        "fullName",
        "Name"
      ]);

    const id=
      getField(cv,[
        "CV ID",
        "cv_id",
        "ID"
      ]);

    const phone=
      getField(cv,[
        "Phone",
        "phone",
        "Mobile"
      ]);

    const email=
      getField(cv,[
        "Email",
        "email"
      ]);


    const card=
      document.createElement("div");

    card.className=
      "result-card";

    card.innerHTML=`

      <h3>${escapeHTML(name)}</h3>

      <p><strong>CV ID:</strong>
      ${escapeHTML(id)}</p>

      <p><strong>Phone:</strong>
      ${escapeHTML(phone)}</p>

      <p><strong>Email:</strong>
      ${escapeHTML(email)}</p>

      <button class="view-btn">
      View CV
      </button>
    `;


    card.querySelector(".view-btn")
      .onclick=()=>{
        showCV(cv);
      };


    results.appendChild(card);

  });

}


/* =====================================================
SHOW CV
===================================================== */

function showCV(cv){

  document.getElementById("results")
    .style.display="none";

  document.getElementById("cvArea")
    .style.display="block";


  /* PERSONAL */

  setText(
    "cvName",
    getField(cv,[
      "Full Name",
      "fullName",
      "Name"
    ])
  );

  setText(
    "cvLocation",
    getField(cv,[
      "Location",
      "location"
    ])
  );

  setText(
    "cvPhone",
    getField(cv,[
      "Phone",
      "phone",
      "Mobile"
    ])
  );

  setText(
    "cvEmail",
    getField(cv,[
      "Email",
      "email"
    ])
  );

  setText(
    "cvDob",
    getField(cv,[
      "Date of Birth",
      "DOB",
      "dob"
    ])
  );

  setText(
    "cvGender",
    getField(cv,[
      "Gender",
      "gender"
    ])
  );

  setText(
    "cvNationality",
    getField(cv,[
      "Nationality",
      "nationality"
    ])
  );


  /* ===================================================
     PHOTO
  =================================================== */

  let photo=
    getField(cv,[
      "Profile Photo",
      "profilePhoto",
      "ProfilePhoto",
      "Photo",
      "photo",
      "Photo URL",
      "PhotoURL",
      "Image",
      "image",
      "Image URL",
      "ImageURL"
    ]);


  const photoElement=
    document.getElementById("cvPhoto");


  if(photo){

    /*
      ImgBB कहिलेकाहीँ page URL दिन सक्छ।
      त्यसलाई image URL मा बदल्ने प्रयास।
    */

    if(
      photo.includes("ibb.co/") &&
      !photo.includes("i.ibb.co/")
    ){

      /*
       Page URL भए पनि browser ले direct image
       देखाउन नसक्ने हुन सक्छ।
      */

      photoElement.src=photo;

    }
    else{

      photoElement.src=photo;

    }

    photoElement.style.display="block";

    photoElement.onerror=function(){

      console.log(
        "Photo could not be loaded:",
        photo
      );

      photoElement.style.display="none";

    };

  }
  else{

    photoElement.style.display="none";

  }


  /* ===================================================
     SUMMARY
  =================================================== */

  setText(
    "cvSummary",
    getField(cv,[
      "Professional Summary",
      "professionalSummary",
      "ProfessionalSummary",
      "Summary",
      "summary"
    ])
  );


  /* ===================================================
     WORK HISTORY
  =================================================== */

  loadWork(cv,1);
  loadWork(cv,2);
  loadWork(cv,3);


  /* EDUCATION */

  setText(
    "cvEducation",
    getField(cv,[
      "Education",
      "education",
      "Education / Qualification",
      "Qualification"
    ])
  );


  /* ===================================================
     SKILLS
  =================================================== */

  const skills=
    getField(cv,[
      "Skills",
      "skills"
    ]);

  const skillBox=
    document.getElementById("cvSkills");

  skillBox.innerHTML="";


  if(skills){

    skills
      .split(/[,;\n|]+/)
      .map(x=>x.trim())
      .filter(Boolean)
      .forEach(skill=>{

        const div=
          document.createElement("div");

        div.className="skill";

        div.textContent=
          "• "+skill;

        skillBox.appendChild(div);

      });

  }


  /* LANGUAGES */

  setText(
    "cvLanguages",
    getField(cv,[
      "Languages",
      "languages"
    ])
  );


  /* ===================================================
     RESPONSIBILITIES
  =================================================== */

  for(let i=1;i<=3;i++){

    setText(
      "responsibility"+i,
      getField(cv,[
        `Responsibility ${i}`,
        `responsibility${i}`,
        `Responsibility${i}`
      ])
    );

  }


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =====================================================
WORK HISTORY
===================================================== */

function loadWork(cv,n){

  const job=
    getField(cv,[
      `Job Title ${n}`,
      `jobTitle${n}`,
      `JobTitle${n}`,
      `Job Title${n}`
    ]);

  const company=
    getField(cv,[
      `Company Name ${n}`,
      `companyName${n}`,
      `CompanyName${n}`,
      `Company ${n}`,
      `Company${n}`
    ]);

  const start=
    getField(cv,[
      `Start Date ${n}`,
      `startDate${n}`,
      `StartDate${n}`
    ]);

  const end=
    getField(cv,[
      `End Date ${n}`,
      `endDate${n}`,
      `EndDate${n}`
    ]);

  const location=
    getField(cv,[
      `Work Location ${n}`,
      `workLocation${n}`,
      `WorkLocation${n}`,
      `Location ${n}`
    ]);

  const description=
    getField(cv,[
      `Work Description ${n}`,
      `workDescription${n}`,
      `WorkDescription${n}`,
      `Description ${n}`
    ]);


  setText(
    "jobTitle"+n,
    job
  );

  setText(
    "company"+n,
    company
  );

  setText(
    "date"+n,
    start||end
      ? start+
        (start&&end?" - ":"")+
        end
      : ""
  );

  setText(
    "location"+n,
    location
  );

  setText(
    "description"+n,
    description
  );


  const work=
    document.getElementById(
      "work"+n
    );


  if(
    !job &&
    !company &&
    !start &&
    !end &&
    !location &&
    !description
  ){

    work.style.display="none";

  }
  else{

    work.style.display="block";

  }

}


/* =====================================================
CLOSE
===================================================== */

function closeCV(){

  document.getElementById("cvArea")
    .style.display="none";

  document.getElementById("results")
    .style.display="block";

}


/* =====================================================
SET TEXT
===================================================== */

function setText(id,value){

  const el=
    document.getElementById(id);

  if(el){

    el.textContent=
      value||"";

  }

}


/* =====================================================
ESCAPE
===================================================== */

function escapeHTML(value){

  return String(value||"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ENTER SEARCH */

document
.getElementById("searchInput")
.addEventListener("keydown",function(e){

  if(e.key==="Enter"){
    searchCV();
  }

});


/* START */

loadData();

</script>

</body>
</html>

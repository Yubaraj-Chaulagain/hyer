<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nepali Congress – Marin Gaupalika Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-width: 0;
      overflow-x: hidden;
    }

    body {
      font-family:
        Arial,
        "Noto Sans Devanagari",
        "Nirmala UI",
        sans-serif;
      background: #f3f5f9;
      color: #172033;
    }

    .header {
      background: linear-gradient(135deg, #071b5c, #b5121b);
      color: #fff;
      padding: 24px 18px;
    }

    .container {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 18px;
    }

    .header h1 {
      margin: 0;
      font-size: clamp(20px, 3vw, 30px);
      line-height: 1.3;
    }

    .header p {
      margin: 7px 0 0;
      opacity: 0.92;
      font-size: clamp(12px, 1.6vw, 16px);
    }

    /* Toolbar */
    .toolbar {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) 180px auto auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
    }

    input,
    select,
    button {
      min-height: 44px;
      border-radius: 8px;
      padding: 10px 13px;
      font-size: 14px;
      font-family: inherit;
    }

    .search,
    .select {
      border: 1px solid #d8dce5;
      background: #fff;
      color: #172033;
      width: 100%;
    }

    button {
      cursor: pointer;
      border: 1px solid #071b5c;
      background: #071b5c;
      color: #fff;
      white-space: nowrap;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      font-size: 13px;
      color: #667085;
      white-space: nowrap;
    }

    /* Error */
    .error {
      display: none;
      color: #b42318;
      background: #fef3f2;
      border: 1px solid #fecdca;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    /* Cards */
    .cards {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
      border-top: 4px solid #b5121b;
      min-width: 0;
    }

    .card .label {
      font-size: 13px;
      color: #697386;
      line-height: 1.4;
    }

    .card .value {
      font-size: clamp(21px, 3vw, 30px);
      font-weight: 700;
      margin-top: 8px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Main grid */
    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(280px, 1fr);
      gap: 18px;
      margin-bottom: 20px;
    }

    .panel {
      background: #fff;
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.07);
      min-width: 0;
    }

    .panel h2 {
      font-size: 18px;
      margin: 0 0 15px;
    }

    .chartbox {
      position: relative;
      width: 100%;
      height: 330px;
    }

    canvas {
      max-width: 100%;
    }

    /* Table */
    .table-wrap {
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 760px;
    }

    th,
    td {
      padding: 11px 10px;
      border-bottom: 1px solid #e7e9ee;
      text-align: right;
      white-space: nowrap;
    }

    th:first-child,
    td:first-child {
      text-align: left;
      position: sticky;
      left: 0;
    }

    th:first-child {
      z-index: 4;
    }

    td:first-child {
      z-index: 2;
      background: #fff;
      font-weight: 500;
    }

    thead th {
      background: #071b5c;
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 3;
    }

    thead th:first-child {
      background: #071b5c;
    }

    tbody tr:hover td {
      background: #f7f9fc;
    }

    tbody tr:hover td:first-child {
      background: #f7f9fc;
    }

    .total {
      font-weight: 700;
      background: #fff7f7 !important;
    }

    .empty {
      text-align: center !important;
      color: #667085;
      padding: 25px;
    }

    /* Loading */
    .loading {
      opacity: 0.65;
      pointer-events: none;
    }

    /* Responsive */
    @media (max-width: 1100px) {
      .toolbar {
        grid-template-columns: 1fr 1fr;
      }

      .toolbar .search {
        grid-column: 1 / -1;
      }

      .cards {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .status {

    }

      }

        padding: 17px 10px;
      }

      .toolbar {
        grid-template-columns: 1fr 1fr;
      }

      .toolbar .search {
        grid-column: 1 / -1;
      }

      .toolbar button,

      }

      .toolbar .status {
        grid-column: 1 / -1;
      }

      .cards {

        gap: 9px;
      }

      .card {
        padding: 13px;
        border-radius: 10px;
      }

      .card .label {

      }

      .panel {
        padding: 12px;
        border-radius: 10px;
      }

      }

      .chartbox {

      }

      th,

    }

      .toolbar {

      }

      .toolbar .search,

      }

      }

      }

        height: 240px;
      }

      }
    }
  </style>
</head>

/* =========================================================
   GLOBAL STATE
   ========================================================= */

let data = [];

/* =========================================================
   HELPERS
   ========================================================= */

function normalizeText(value) {
  return String(value ?? "")
    .trim()
    .toLowerCase();
}


function num(value) {
  if (value === null || value === undefined) {
    return 0;
  }

  const cleaned = String(value)
    .replace(/,/g, "")
    .replace(/[^\d.-]/g, "");

  const number = parseFloat(cleaned);

  return Number.isFinite(number) ? number : 0;
}


function formatNumber(value) {
  return Number(value || 0).toLocaleString("en-US");
}


function escapeHtml(value) {
  return String(value ?? "")
    .replace(/[&<>"']/g, function (match) {
      const map = {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      };

      return map[match];
    });
}


/* =========================================================
   CSV PARSER
   ========================================================= */

function parseCSV(text) {
  const rows = [];

  let row = [];
  let cell = "";
  let inQuotes = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];
    const next = text[i + 1];

    if (char === '"' && inQuotes && next === '"') {
      cell += '"';
      i++;
      continue;
    }

    if (char === '"') {
      inQuotes = !inQuotes;
      continue;
    }

    if (char === "," && !inQuotes) {
      row.push(cell.trim());
      cell = "";
      continue;
    }

    if ((char === "\n" || char === "\r") && !inQuotes) {

      if (char === "\r" && next === "\n") {
        i++;
      }

      row.push(cell.trim());

      if (row.some(value => value !== "")) {
        rows.push(row);
      }

      row = [];
      cell = "";

      continue;
    }

    cell += char;
  }

  if (cell !== "" || row.length) {
    row.push(cell.trim());

    if (row.some(value => value !== "")) {
      rows.push(row);
    }
  }

  return rows;
}


/* =========================================================
   NORMALIZE ROWS
   ========================================================= */

function normalize(rows) {

  if (!Array.isArray(rows) || rows.length < 2) {
    return [];
  }

  const headers = rows[0]
    .map(header => String(header || "").trim());

  return rows
    .slice(1)
    .map(row => {

      const object = {};

      headers.forEach((header, index) => {
        object[header] =
          row[index] !== undefined
            ? String(row[index]).trim()
            : "";
      });

      return object;
    })
    .filter(row => {
      const firstKey = headers[0];
      return row[firstKey] !== "";
    });
}


/* =========================================================
   GET STRUCTURE
   ========================================================= */

function getStructure(rows) {

  if (!rows.length) {
    return {
      headers: [],
      first: "",
      wards: []
    };
  }

  const headers = Object.keys(rows[0]);

  const first = headers[0];

  const wards = headers.filter(header => {
    const normalized = normalizeText(header);

    return (
      header !== first &&
      normalized !== "grand total" &&
      normalized !== "total"
    );
  });

  return {
    headers,
    first,
    wards
  };
}


/* =========================================================
   FIND ROW
   ========================================================= */

function findRow(rows, firstColumn, label) {

  const target = normalizeText(label);

  return rows.find(row =>
    normalizeText(row[firstColumn]) === target
  );
}


/* =========================================================
   RENDER EVERYTHING
   ========================================================= */

function render(rows) {

  if (!Array.isArray(rows) || rows.length === 0) {
    return;
  }

  data = rows;

  const structure = getStructure(rows);

  populateWardSelect(structure.wards);

  renderCards(
    rows,
    structure.headers,
    structure.first
  );

  renderTable(
    rows,
    structure.headers,
    structure.first
  );

  renderCharts(
    rows,
    structure.headers,
    structure.first,
    structure.wards
  );
}


/* =========================================================
   WARD SELECT
   ========================================================= */

function populateWardSelect(wards) {

  const select = document.getElementById("ward");

  const oldValue = select.value;

  select.innerHTML = "";

  const allOption = document.createElement("option");

  allOption.value = "all";
  allOption.textContent = "All Wards";

  select.appendChild(allOption);

  wards.forEach(ward => {

    const option = document.createElement("option");

    option.value = ward;
    option.textContent = ward;

    select.appendChild(option);
  });

  if (
    wards.includes(oldValue) ||
    oldValue === "all"
  ) {
    select.value = oldValue;
  } else {
    select.value = "all";
  }
}


/* =========================================================
   CARDS
   ========================================================= */

function renderCards(rows, headers, first) {

  const cards = document.getElementById("cards");

  cards.innerHTML = "";

  const wanted = [
    "Number of Households",
    "Total Family Members",
    "Total Male",
    "Total Female",
    "Total Voters"
  ];

  wanted.forEach(label => {

    const row = findRow(
      rows,
      first,
      label
    );

    if (!row) {
      return;
    }

    let total = 0;

    if (headers.includes("Grand Total")) {

      total = num(row["Grand Total"]);

    } else {

      total = headers
        .slice(1)
        .reduce(
          (sum, header) =>
            sum + num(row[header]),
          0
        );
    }

    const card = document.createElement("div");

    card.className = "card";

    const labelElement =
      document.createElement("div");

    labelElement.className = "label";
    labelElement.textContent = label;

    const valueElement =
      document.createElement("div");

    valueElement.className = "value";
    valueElement.textContent =
      formatNumber(total);

    card.appendChild(labelElement);
    card.appendChild(valueElement);

    cards.appendChild(card);
  });
}


/* =========================================================
   TABLE
   ========================================================= */

function renderTable(rows, headers, first) {

  const table =
    document.getElementById("dataTable");

  const searchValue =
    normalizeText(
      document.getElementById("search").value
    );

  const selectedWard =
    document.getElementById("ward").value;

  const visibleHeaders =
    selectedWard === "all"
      ? headers
      : headers.filter(header =>
          header === first ||
          header === selectedWard
        );

  const filteredRows = rows.filter(row => {

    if (!searchValue) {
      return true;
    }

    return normalizeText(row[first])
      .includes(searchValue);
  });

  table.innerHTML = "";

  /* Header */

  const thead =
    document.createElement("thead");

  const headerRow =
    document.createElement("tr");

  visibleHeaders.forEach(header => {

    const th =
      document.createElement("th");

    th.textContent = header;

    headerRow.appendChild(th);
  });

  thead.appendChild(headerRow);
  table.appendChild(thead);

  /* Body */

  const tbody =
    document.createElement("tbody");

  if (!filteredRows.length) {

    const tr =
      document.createElement("tr");

    const td =
      document.createElement("td");

    td.colSpan = visibleHeaders.length;
    td.className = "empty";
    td.textContent = "No matching data found.";

    tr.appendChild(td);
    tbody.appendChild(tr);

  } else {

    filteredRows.forEach(row => {

      const tr =
        document.createElement("tr");

      visibleHeaders.forEach(header => {

        const td =
          document.createElement("td");

        const value = row[header] ?? "";

        td.textContent = value;

        if (header === first) {
          td.style.textAlign = "left";
        }

        if (
          normalizeText(header) ===
          "grand total"
        ) {
          td.className = "total";
        }

        tr.appendChild(td);
      });

      tbody.appendChild(tr);
    });
  }

  table.appendChild(tbody);
}

function renderCharts(
  rows,
  headers,
  first,
  wards
) {

  const male =
    findRow(rows, first, "Total Male");

  const female =
    findRow(rows, first, "Total Female");

  const voters =
    findRow(rows, first, "Total Voters");


  /* ---------------------------------------------
     WARD BAR CHART
     --------------------------------------------- */

  if (wardChart) {
    wardChart.destroy();
  }

  const wardCanvas =
    document.getElementById("wardChart");

  wardChart =
    new Chart(wardCanvas, {

      type: "bar",

      data: {

        labels: wards,

        datasets: [

          {
            label: "Male",
            data: wards.map(ward =>
              num(male?.[ward])
            ),
            backgroundColor: "#071b5c",
            borderRadius: 5
          },

          {
            label: "Female",
            data: wards.map(ward =>
              num(female?.[ward])
            ),
            backgroundColor: "#b5121b",
            borderRadius: 5
          },

          {
            label: "Voters",
            data: wards.map(ward =>
              num(voters?.[ward])
            ),
            backgroundColor: "#f59e0b",
            borderRadius: 5
          }

        ]
      },

      options: {

        responsive: true,

        maintainAspectRatio: false,

        interaction: {
          mode: "index",
          intersect: false
        },

        plugins: {

          legend: {
            position: "bottom"
          },

          tooltip: {
            callbacks: {
              label: function (context) {
                return (
                  " " +
                  context.dataset.label +
                  ": " +
                  formatNumber(context.raw)
                );
              }
            }
          }
        },

        scales: {

          y: {
            beginAtZero: true,

            ticks: {
              precision: 0
            }
          }

        }
      }
    });


  /* ---------------------------------------------
     GENDER DOUGHNUT
     --------------------------------------------- */

  if (genderChart) {
    genderChart.destroy();
  }

  const maleTotal =
    getGrandTotal(
      male,
      headers,
      wards
    );

  const femaleTotal =
    getGrandTotal(
      female,
      headers,
      wards
    );

  const genderCanvas =
    document.getElementById("genderChart");

  genderChart =
    new Chart(genderCanvas, {

      type: "doughnut",

      data: {

        labels: [
          "Male",
          "Female"
        ],

        datasets: [

          {
            data: [
              maleTotal,
              femaleTotal
            ],

            backgroundColor: [
              "#071b5c",
              "#b5121b"
            ],

            borderWidth: 2,
            borderColor: "#ffffff"
          }

        ]
      },

      options: {

        responsive: true,

        maintainAspectRatio: false,

        cutout: "62%",

        plugins: {

          legend: {
            position: "bottom"
          },

          tooltip: {

            callbacks: {

              label: function (context) {

                const value =
                  num(context.raw);

                const total =
                  maleTotal +
                  femaleTotal;

                const percentage =
                  total > 0
                    ? ((value / total) * 100)
                        .toFixed(1)
                    : 0;

                return (
                  " " +
                  context.label +
                  ": " +
                  formatNumber(value) +
                  " (" +
                  percentage +
                  "%)"
                );
              }
            }
          }
        }
      }
    });
}


/* =========================================================
   GRAND TOTAL
   ========================================================= */

function getGrandTotal(
  row,
  headers,
  wards
) {

  if (!row) {
    return 0;
  }

  if (headers.includes("Grand Total")) {
    return num(row["Grand Total"]);
  }

  return wards.reduce(
    (sum, ward) =>
      sum + num(row[ward]),
    0
  );
}


/* =========================================================
   GOOGLE SHEET LOADER
   ========================================================= */

async function loadData() {

  const status =
    document.getElementById("status");

  const error =
    document.getElementById("error");

  const refreshBtn =
    document.getElementById("refreshBtn");

  const toolbar =
    document.querySelector(".toolbar");

  error.style.display = "none";

  status.textContent =
    "Loading live Google Sheet...";

  refreshBtn.disabled = true;

  toolbar.classList.add("loading");


  try {

    /*
      Using GVIZ CSV output is much more reliable
      than parsing Google's generated HTML page.
    */

    const url =
      GVIZ_URL +
      "?output=csv&_=" +
      Date.now();

    const response =
      await fetch(
        url,
        {
          method: "GET",
          cache: "no-store"
        }
      );

    if (!response.ok) {
      throw new Error(
        "HTTP " + response.status
      );
    }

    const csv =
      await response.text();

    if (!csv.trim()) {
      throw new Error(
        "Google Sheet returned empty data"
      );
    }

    const rows =
      parseCSV(csv);

    if (rows.length < 2) {
      throw new Error(
        "No valid Sheet data"
      );
    }

    const liveData =
      normalize(rows);

    if (!liveData.length) {
      throw new Error(
        "Empty Sheet"
      );
    }

    render(liveData);

    status.textContent =
      "🟢 Live data updated: " +
      new Date().toLocaleTimeString();

  } catch (errorObject) {

    console.error(
      "Google Sheet loading error:",
      errorObject
    );

    error.style.display = "block";

    error.textContent =
      "Google Sheet बाट live data load भएन। " +
      "Sheet Public/Published गरिएको छ कि छैन " +
      "जाँच गर्नुहोस्। तलको data fallback रूपमा देखाइएको छ।";

    render(INITIAL_DATA);

    status.textContent =
      "🟡 Local fallback data";

  } finally {

    refreshBtn.disabled = false;

    toolbar.classList.remove("loading");
  }
}

render(INITIAL_DATA);

loadData();

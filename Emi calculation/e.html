<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Employee Attendance System</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
padding:20px;
}

.hours{
    margin-top:5px;
    font-size:11px;
    font-weight:bold;
    text-align:center;
}

.status{
margin-top:8px;
font-size:12px;
font-weight:bold;
text-align:center;
}

.container{
max-width:1200px;
margin:auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.15);
}

h1{
text-align:center;
color:#0077cc;
margin-bottom:20px;
}

.form-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

label{
font-weight:bold;
display:block;
margin-bottom:5px;
}

input,select{
width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:6px;
font-size:15px;
}

button{
padding:10px 15px;
border:none;
border-radius:6px;
background:#0077cc;
color:white;
cursor:pointer;
font-size:15px;
}

button:hover{
background:#005fa3;
}

.top-buttons{
margin-top:20px;
display:flex;
gap:10px;
flex-wrap:wrap;
}

.calendar{
margin-top:20px;
display:grid;
grid-template-columns:repeat(7,1fr);
gap:5px;
}

.day-name{
background:#0077cc;
color:#fff;
text-align:center;
padding:10px;
font-weight:bold;
border-radius:5px;
}

.day{
min-height:90px;
background:#fafafa;
border:1px solid #ddd;
border-radius:6px;
padding:5px;
position:relative;
cursor:pointer;
transition:.2s;
}

.day:hover{
transform:scale(1.02);
}

.day-number{
font-weight:bold;
margin-bottom:8px;
}

.present{
background:#4CAF50 !important;
color:#fff;
}

.absent{
background:#F44336 !important;
color:#fff;
}

.holiday{
background:#FFC107 !important;
color:#000;
}

.summary{
margin-top:25px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:10px;
}

.card{
background:#0077cc;
color:#fff;
padding:15px;
border-radius:8px;
text-align:center;
}

@media(max-width:700px){

.calendar{
grid-template-columns:repeat(7,1fr);
font-size:12px;
}

.day{
min-height:65px;
padding:3px;
}

button{
width:100%;
}

}

</style>

</head>
<body>

<div class="container">

<h1>Employee Attendance Calculate System</h1>

<div class="form-grid">



<div>
<label>Employee Name</label>
<input type="text" id="employeeName" placeholder="Enter employee name">
</div>

<div>
<label>Employee ID</label>
<input type="text" id="employeeId" placeholder="Employee ID">
</div>

<div>
<label>Department</label>
<input type="text" id="department" placeholder="Department">
</div>
<div>
<label>Trade</label>
<select id="trade">
<option value="">Select Trade</option>
<option value="helper">Helper</option>
<option value="mason">Mason</option>
<option value="steelfixer">Steel Fixer</option>
<option value="carpenter">Carpenter</option>
<option value="electrician">Electrician</option>
<option value="plumber">Plumber</option>
<option value="painter">Painter</option>
<option value="scaffolder">Scaffolder</option>
</select>
</div>
<div>
<label>Pay Type</label>
<select id="payType">
    <option value="monthly">Monthly Salary</option>
    <option value="hourly">Hourly Rate</option>
</select>

<div id="monthlyFields">

<label>Basic Salary (AED)</label>
<input type="number" id="basicSalary" value="1100">

<label>Food Allowance (AED)</label>
<input type="number" id="foodAllowance" value="200">

</div>


<div id="hourlyFields">

<label>Hourly Rate (AED)</label>
<input type="number" id="hourlyRate" value="8">

<label>Working Hours / Day</label>
<input type="number" id="workHours" value="8">

</div>

<label>Advance / Deduction (AED)</label>
<input type="number" id="advance" value="0">

<label>Bonus (AED)</label>
<input type="number" id="bonus" value="0">
</div>


<div>
<label>Year</label>
<select id="year"></select>
</div>

<div>
<label>Month</label>
<select id="month">
<option value="0">January</option>
<option value="1">February</option>
<option value="2">March</option>
<option value="3">April</option>
<option value="4">May</option>
<option value="5">June</option>
<option value="6">July</option>
<option value="7">August</option>
<option value="8">September</option>
<option value="9">October</option>
<option value="10">November</option>
<option value="11">December</option>
</select>
</div>

</div>

<div class="top-buttons">
<button id="generateBtn">Generate Calendar</button>
<button id="saveBtn">Save</button>
<button id="printBtn">Print</button>
</div>

<hr style="margin:20px 0;">

<div id="calendar">

<div class="calendar">

<div class="day-name">Sun</div>
<div class="day-name">Mon</div>
<div class="day-name">Tue</div>
<div class="day-name">Wed</div>
<div class="day-name">Thu</div>
<div class="day-name">Fri</div>
<div class="day-name">Sat</div>

<!-- JavaScript ले सबै दिनहरू यहाँ बनाउनेछ -->

</div>

</div>


<div class="summary">

<div class="card">
<h3 id="workingDays">0</h3>
<p>Working Days</p>
</div>

<div class="card">
<h3 id="presentDays">0</h3>
<p>Present</p>
</div>

<div class="card">
<h3 id="absentDays">0</h3>
<p>Absent</p>
</div>

<div class="card">
<h3 id="holidayDays">0</h3>
<p>Holiday</p>
</div>

<div class="card">
<h3 id="totalHours">0</h3>
<p>Total Hours</p>
</div>
<div class="card">
    <h3 id="totalSalary">0 AED</h3>
    <p>Total Salary</p>
</div>

</div>


</div>

<h2>Attendance Table</h2>

<table id="attendanceTable" border="1" width="100%">
<thead>
<tr>
<th>Date</th>
<th>Status</th>
<th>OT</th>
<th>Hours</th>
<th>Action</th>
</tr>
</thead>

<tbody>

</tbody>
</table>

</body>


<script>
const tradeData = {
    helper: {
        payType: "monthly",
        basic: 1100,
        food: 200,
        hourly: 8
    },
    mason: {
        payType: "monthly",
        basic: 1500,
        food: 250,
        hourly: 11
    },
    steelfixer: {
        payType: "monthly",
        basic: 1400,
        food: 250,
        hourly: 10
    },
    carpenter: {
        payType: "monthly",
        basic: 1600,
        food: 300,
        hourly: 12
    },
    electrician: {
        payType: "monthly",
        basic: 1800,
        food: 300,
        hourly: 14
    },
    plumber: {
        payType: "monthly",
        basic: 1700,
        food: 300,
        hourly: 13
    },
    painter: {
        payType: "monthly",
        basic: 1400,
        food: 250,
        hourly: 10
    },
    scaffolder: {
        payType: "hourly",
        basic: 0,
        food: 0,
        hourly: 9
    }
};
const yearSelect = document.getElementById("year");
const monthSelect = document.getElementById("month");
const calendar = document.querySelector(".calendar");

const weekDays = [
"Sun",
"Mon",
"Tue",
"Wed",
"Thu",
"Fri",
"Sat"
];

// Load Years
function loadYears(){

yearSelect.innerHTML="";

for(let y=2025;y<=2035;y++){

const option=document.createElement("option");

option.value=y;
option.textContent=y;

yearSelect.appendChild(option);

}

yearSelect.value=new Date().getFullYear();

}

// Load Current Month
function loadCurrentMonth(){

monthSelect.value=new Date().getMonth();

}

// Initialize
loadYears();

loadCurrentMonth();

document.getElementById("trade").addEventListener("change", function () {

    const t = tradeData[this.value];

    if (!t) return;

    document.getElementById("payType").value = t.payType;
    document.getElementById("basicSalary").value = t.basic;
    document.getElementById("foodAllowance").value = t.food;
    document.getElementById("hourlyRate").value = t.hourly;

    updateSummary();
});

// ===============================
// Generate Calendar
// ===============================

function generateCalendar() {

    calendar.innerHTML = "";

    // Week Header
    weekDays.forEach(day => {
        calendar.innerHTML += `<div class="day-name">${day}</div>`;
    });

    const year = parseInt(yearSelect.value);
    const month = parseInt(monthSelect.value);

    const firstDay = new Date(year, month, 1).getDay();
    const totalDays = new Date(year, month + 1, 0).getDate();

    // Empty Boxes
    for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement("div");
        empty.className = "empty";
        calendar.appendChild(empty);
    }

    // Days
    for (let d = 1; d <= totalDays; d++) {

        const box = document.createElement("div");

        box.className = "day";
        box.dataset.day = d;
        box.dataset.status = "";
        box.dataset.overtime = 0;

        box.innerHTML = `
    <div class="day-number">${d}</div>
    <div class="status"></div>
    <div class="hours">0</div>
`;

        calendar.appendChild(box);
    }

    // Saved Attendance Load
    loadAttendance();
}

// Generate Button
document.getElementById("generateBtn")
.addEventListener("click",generateCalendar);

// Change Month
monthSelect.addEventListener("change",generateCalendar);

// Change Year
yearSelect.addEventListener("change",generateCalendar);

// First Load
generateCalendar();


// ===============================
// Attendance Click Event
// ===============================
calendar.addEventListener("click", function(e){

    const box = e.target.closest(".day");

    if(!box || !box.dataset.day) return;

    box.classList.remove("present","absent","holiday");

    if(box.dataset.status === "present"){

        box.dataset.status = "absent";
        box.classList.add("absent");
        box.dataset.overtime = 0;

    }else if(box.dataset.status === "absent"){

        box.dataset.status = "holiday";
        box.classList.add("holiday");
        box.dataset.overtime = 0;

    }else if(box.dataset.status === "holiday"){

        box.dataset.status = "";
        box.dataset.overtime = 0;

    }else{

        box.dataset.status = "present";
        box.classList.add("present");

        let ot = prompt("Enter OT Hours", "0");
        box.dataset.overtime = Number(ot) || 0;
    }

    // Calendar मा Hours देखाउने
    const workHours = Number(document.getElementById("workHours").value);
    const hoursDiv = box.querySelector(".hours");

    if(box.dataset.status === "present"){
        const ot = Number(box.dataset.overtime);
        hoursDiv.textContent = ot > 0
            ? `${workHours} + ${ot} OT`
            : `${workHours} Hrs`;
    }else if(box.dataset.status === "absent"){
        hoursDiv.textContent = "Absent";
    }else if(box.dataset.status === "holiday"){
        hoursDiv.textContent = "Holiday";
    }else{
        hoursDiv.textContent = "";
    }

    saveAttendance();
    updateTable();
    updateSummary();

});

    


// ===============================
// Save & Load Attendance
// ===============================

// ===============================
// Storage Key
// ===============================
function storageKey() {
    return `attendance_${yearSelect.value}_${monthSelect.value}`;
}

function saveAttendance() {

    const attendance = {};

    document.querySelectorAll(".day").forEach(day => {

        if (!day.dataset.day) return;

        const otInput = document.getElementById("ot_" + day.dataset.day);

        if (otInput) {
            day.dataset.overtime = Number(otInput.value) || 0;
        }

        attendance[day.dataset.day] = {
            status: day.dataset.status || "",
            overtime: Number(day.dataset.overtime) || 0
        };

    });

    localStorage.setItem(storageKey(), JSON.stringify(attendance));

    updateTable();
    updateSummary();
}

function updateSummary() {

    let present = 0;
    let absent = 0;
    let holiday = 0;

    document.querySelectorAll(".day").forEach(day => {
        switch (day.dataset.status) {
            case "present":
                present++;
                break;
            case "absent":
                absent++;
                break;
            case "holiday":
                holiday++;
                break;
        }
    });

    document.getElementById("presentDays").textContent = present;
    document.getElementById("absentDays").textContent = absent;
    document.getElementById("holidayDays").textContent = holiday;
    let workingDays = 0;

const year = Number(yearSelect.value);
const month = Number(monthSelect.value);
const totalDays = new Date(year, month + 1, 0).getDate();

for (let d = 1; d <= totalDays; d++) {
    const date = new Date(year, month, d);

    // Sunday बाहेक सबै दिन
    if (date.getDay() !== 0) {
        workingDays++;
    }
}

document.getElementById("workingDays").textContent = workingDays;

    // Inputs
    const payType = document.getElementById("payType").value;
    const workHours = Number(document.getElementById("workHours").value);
    const basicSalary = Number(document.getElementById("basicSalary").value);
    const foodAllowance = Number(document.getElementById("foodAllowance").value);
    const hourlyRate = Number(document.getElementById("hourlyRate").value);
    const bonus = Number(document.getElementById("bonus").value);
    const advance = Number(document.getElementById("advance").value);

    // Hours
    let totalHours = present * workHours;
    let totalOT = 0;

    document.querySelectorAll(".day").forEach(day => {
        totalOT += Number(day.dataset.overtime || 0);
    });

    if (payType === "monthly") {
        document.getElementById("totalHours").textContent =
            (totalHours + totalOT).toFixed(1) + " hrs";
    } else {
        document.getElementById("totalHours").textContent =
            totalHours.toFixed(1) + " hrs";
    }

    // Salary Calculation
let totalSalary = 0;

if (payType === "monthly") {

    const basicHours = 26 * workHours;
    const hourlyBasicRate = basicSalary / basicHours;
    const overtimePay = totalOT * hourlyBasicRate * 1.25;

    const dailySalary = (basicSalary + foodAllowance) / 30;
    const deduction = absent * dailySalary;

    totalSalary =
        basicSalary +
        foodAllowance +
        overtimePay +
        bonus -
        deduction -
        advance;

} else {

    let totalWorkedHours = 0;

    document.querySelectorAll(".day").forEach(day => {
        if (day.dataset.status === "present") {
            totalWorkedHours += workHours + Number(day.dataset.overtime || 0);
        }
    });

    document.getElementById("totalHours").textContent =
        totalWorkedHours.toFixed(1) + " hrs";

    totalSalary =
        (totalWorkedHours * hourlyRate) +
        bonus -
        advance;
}

document.getElementById("totalSalary").textContent =
    totalSalary.toFixed(2) + " AED";
document.querySelectorAll(".day").forEach(day => {

    const hoursDiv = day.querySelector(".hours");
    if (!hoursDiv) return;

    if (day.dataset.status === "present") {

        const ot = Number(day.dataset.overtime || 0);

        if (ot > 0) {
            hoursDiv.textContent = workHours + " + " + ot + " OT";
        } else {
            hoursDiv.textContent = workHours + " Hrs";
        }

    } else if (day.dataset.status === "holiday") {

        hoursDiv.textContent = "Holiday";

    } else if (day.dataset.status === "absent") {

        hoursDiv.textContent = "Absent";

    } else {

        hoursDiv.textContent = "";

    }

});

}

function loadAttendance() {

    const saved = localStorage.getItem(storageKey());

    if (!saved) {
        updateTable();
        updateSummary();
        return;
    }

    const attendance = JSON.parse(saved);

    document.querySelectorAll(".day").forEach(day => {

        if (!day.dataset.day) return;

        // सबै पुरानो data हटाउने
        day.dataset.status = "";
        day.dataset.overtime = 0;

        day.classList.remove("present", "absent", "holiday");

        const item = attendance[day.dataset.day];

        if (!item) return;

        // Status Restore
        day.dataset.status = item.status || "";

        // OT Restore
        day.dataset.overtime = item.overtime || 0;

        // Colour Restore
        if (item.status === "present") {
            day.classList.add("present");
        } else if (item.status === "absent") {
            day.classList.add("absent");
        } else if (item.status === "holiday") {
            day.classList.add("holiday");
        }

    });

    // Table र Summary Update
    updateTable();
    updateSummary();
}
// ===============================
// Attendance Table
// ===============================

function updateTable(){

const tbody=document.querySelector("#attendanceTable tbody");

tbody.innerHTML="";

document.querySelectorAll(".day").forEach(day=>{

if(!day.dataset.day) return;

const status=day.dataset.status || "";
const saved = JSON.parse(localStorage.getItem(storageKey()) || "{}");
const item = saved[day.dataset.day] || {};
if(status=="") return;

const workHours = Number(document.getElementById("workHours").value);

let hours = 0;

if (status === "present") {
    hours = workHours + Number(item.overtime || 0);
}

tbody.innerHTML += `
<tr>
<td>${day.dataset.day}/${parseInt(monthSelect.value)+1}/${yearSelect.value}</td>
<td>${status.toUpperCase()}</td>

<td>
<input type="number"
id="ot_${day.dataset.day}"
value="${item.overtime || 0}"
min="0"
step="0.5"
onchange="saveAttendance()"
style="width:70px;">
</td>

<td>${hours}</td>

<td>
<button onclick="clearAttendance(${day.dataset.day})">
Delete
</button>
</td>

</tr>
`;

});
document.querySelectorAll("[id^='ot_']").forEach(input => {

    input.addEventListener("change", function () {

        const day = this.id.replace("ot_", "");

        const box = document.querySelector(`.day[data-day="${day}"]`);

        if (box) {
            box.dataset.overtime = this.value;
        }

        saveAttendance();
        updateSummary();

    });

});

}

function clearAttendance(day){

const box=document.querySelector(
`.day[data-day="${day}"]`
);

if(!box) return;

box.dataset.status = "";
box.dataset.overtime = 0;
box.classList.remove(
"present",
"absent",
"holiday"
);

saveAttendance();
updateTable();
updateSummary();

}
document.getElementById("saveBtn").addEventListener("click", function () {
    saveAttendance();
    alert("Attendance Saved");
});

document.getElementById("printBtn").addEventListener("click", function () {
    window.print();
});
const payTypeSelect = document.getElementById("payType");

function togglePayFields(){

    const monthlyFields = document.getElementById("monthlyFields");
    const hourlyFields = document.getElementById("hourlyFields");

    if(payTypeSelect.value === "monthly"){

        monthlyFields.style.display = "block";
        hourlyFields.style.display = "none";

    }else{

        monthlyFields.style.display = "none";
        hourlyFields.style.display = "block";

    }

    updateSummary();
}


payTypeSelect.addEventListener("change", togglePayFields);


// First Load
togglePayFields();

</script>
</html>

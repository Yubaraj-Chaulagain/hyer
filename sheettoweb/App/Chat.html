<script>
const API="https://script.google.com/macros/s/AKfycbwBu7zwzAsxjSHUELRR37JilunhJ_bFEo34qqN6sYJIUn13lzJT0VVFrjDp38ylX08F6A/exec";
const photoURLInput = document.getElementById("photoURL");
let lastMsgCount = 0;
let ME="";
let ME_ID="";
let messageTimer=null;
let memberTimer=null;
let loadingMessages=false;
let loadingMembers=false;
let appVisible=true;
let cachedMembers=[];
let notificationInitialized=false;
let notificationItems=[];
let notificationKeys=new Set();

// ---------- UI ----------
function showSignup(){loginBox.style.display="none";signupBox.style.display="block";}
function showLogin(){loginBox.style.display="block";signupBox.style.display="none";resetBox.style.display="none";}
function showReset(){loginBox.style.display="none";resetBox.style.display="block";}
function showPrivate(){privateDiv.style.display="block";publicDiv.style.display="none";changeDiv.style.display="none";}
function showPublic(){privateDiv.style.display="none";publicDiv.style.display="block";changeDiv.style.display="none";}
function showChange(){privateDiv.style.display="none";publicDiv.style.display="none";changeDiv.style.display="block";}

// ---------- LOGIN ----------
// ---------- LOGIN ----------
async function login() {
  const loginIDEl = document.getElementById("loginID");
  const loginPassEl = document.getElementById("loginPass");
  const myNameEl = document.getElementById("myName");
  const myPhotoEl = document.getElementById("myPhoto");
  const loginBoxEl = document.getElementById("loginBox");
  const chatAreaEl = document.getElementById("chatArea");

  const id = (loginIDEl.value || "").trim();
  const pass = loginPassEl.value || "";

  if (!id || !pass) {
    alert("Please enter Member ID and Password");
    return;
  }

  const btn = document.querySelector('#loginBox button[onclick="login()"]');
  if (btn) { btn.disabled = true; btn.textContent = "Logging in..."; }

  try {
    // Keep the existing Apps Script API and parameters unchanged.
    const res = await fetch(API, {
      method: "POST",
      body: new URLSearchParams({
        action: "login",
        id: id,
        pass: pass
      }),
      cache: "no-store"
    });

    const text = (await res.text()).trim();

    if (!res.ok) {
      throw new Error("Server returned HTTP " + res.status);
    }

    if (!text || text === "FAIL") {
      alert("Wrong Member ID or Password");
      return;
    }

    let data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      console.error("Login response:", text);
      alert("Login server returned an invalid response. Please try again.");
      return;
    }

    if (!data || data.error || !data.name) {
      alert(data && data.error ? data.error : "Wrong Member ID or Password");
      return;
    }

    ME = String(data.name);
    ME_ID = id;
    notificationInitialized=false;
    notificationItems=[];
    notificationKeys=new Set();
    renderNotifications();
    sessionStorage.setItem("chat_me", ME);
    sessionStorage.setItem("chat_member_id", ME_ID);
    myNameEl.textContent = ME;
    myPhotoEl.src = data.photo && String(data.photo).trim() !== ""
      ? data.photo
      : "https://ui-avatars.com/api/?name=" + encodeURIComponent(ME) + "&background=075e54&color=fff";

    loginBoxEl.style.display = "none";
    chatAreaEl.style.display = "block";

    await loadMembers();
    await loadMessages();

    // Avoid creating multiple timers after repeated logins.
    if (window.chatMessageTimer) clearInterval(window.chatMessageTimer);
    if (window.chatMemberTimer) clearInterval(window.chatMemberTimer);

    window.chatMessageTimer = setInterval(() => {
      if (document.visibilityState === "visible" && ME) loadMessages();
    }, 3000);

    window.chatMemberTimer = setInterval(() => {
      if (document.visibilityState === "visible" && ME) loadMembers();
    }, 15000);

  } catch (err) {
    console.error("Login error:", err);
    alert("Login failed. Please check your internet connection and try again.");
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "Login"; }
  }
}
// ---------- SIGNUP ----------
async function signup(){
  if(!sid.value || !sname.value || !semail.value || !spass.value){
    alert("Fill all");
    return;
  }

  let photoURL = document.getElementById("photoURL").value;
  let deleteURL = "";

  const r = await fetch(API,{
    method:'post',
    body:new URLSearchParams({
      action:'register',
      id:sid.value,
      name:sname.value,
      email:semail.value,
      pass:spass.value,
      photo:photoURL,
      deleteurl:deleteURL
    })
  });

  const t = await r.json(); // JSON parse

  if(t.error){
    alert(t.error); // "Member ID already exists"
  } else {
    alert("Registered Successfully");
    showLogin();
  }
}
    

// ---------- LOGOUT ----------
async function logout(){

if (window.chatMessageTimer) { clearInterval(window.chatMessageTimer); window.chatMessageTimer = null; }
if (window.chatMemberTimer) { clearInterval(window.chatMemberTimer); window.chatMemberTimer = null; }

try { await fetch(API,{
method:'post',
body:new URLSearchParams({
action:'logout',
id:loginID.value
})
}); } catch(e) { console.warn("Logout request failed", e); }

ME="";
ME_ID="";
notificationInitialized=false;
notificationItems=[];
notificationKeys=new Set();
renderNotifications();
sessionStorage.removeItem("chat_me");
sessionStorage.removeItem("chat_member_id");
chatArea.style.display="none";
loginBox.style.display="block";

}

// ---------- PRIVATE SEND ----------
async function sendPrivate(){if(!msg.value) return; await fetch(API,{method:'post',body:new URLSearchParams({action:'send',from:ME,to:member.value,msg:msg.value})}); msg.value="";}

// ---------- PUBLIC SEND ----------
async function sendPublic(){if(!publicMsg.value) return; await fetch(API,{method:'post',body:new URLSearchParams({action:'public',from:ME,msg:publicMsg.value})}); publicMsg.value="";}

// ---------- NOTIFICATIONS (ONLY FOR THE LOGGED-IN USER) ----------
function notificationKey(row){
  return [row[0] ?? "", row[1] ?? "", row[2] ?? "", row[3] ?? ""].join("|");
}
function toggleNotifications(){
  const box=document.getElementById("notificationBox");
  if(box) box.style.display=box.style.display==="none" ? "block" : "none";
}
function renderNotifications(){
  const box=document.getElementById("notificationBox");
  const list=document.getElementById("notificationList");
  const count=document.getElementById("notificationCount");
  if(!box||!list||!count) return;
  list.innerHTML=notificationItems.length
    ? notificationItems.map((n,i)=>`<div class="notificationItem" data-i="${i}"><b>${escapeHTML(n.from)}</b>: ${escapeHTML(n.msg)}</div>`).join("")
    : "<div style='color:#777'>No new notifications</div>";
  count.textContent=notificationItems.length;
  count.style.display=notificationItems.length ? "inline-block" : "none";
  list.querySelectorAll('.notificationItem').forEach(el=>el.onclick=()=>{
    const n=notificationItems[Number(el.dataset.i)];
    if(n && member){ member.value=n.from; showPrivate(); loadMessages(); }
  });
}
function clearNotifications(){
  notificationItems=[];
  renderNotifications();
}
function addIncomingNotification(row){
  const from=String(row[1] ?? "");
  const to=String(row[2] ?? "");
  const message=String(row[3] ?? "");
  // Private message only: recipient must be the currently logged-in name or ID.
  // Public (ALL) messages, own messages, and messages for other users are ignored.
  const isMine = to===String(ME) || to===String(ME_ID);
  const isOwn = from===String(ME) || from===String(ME_ID);
  if(!from || !message || !isMine || isOwn) return;
  const key=notificationKey(row);
  if(notificationKeys.has(key)) return;
  notificationKeys.add(key);
  notificationItems.unshift({from,msg:message,key});
  if(notificationItems.length>30) notificationItems.length=30;
  renderNotifications();
  try{
    if(document.hidden && 'Notification' in window){
      if(Notification.permission==='granted') new Notification('New private message from '+from,{body:message});
      else if(Notification.permission==='default') Notification.requestPermission();
    }
  }catch(e){}
}

// ---------- LOAD MESSAGES ----------
function escapeHTML(v){ return String(v ?? "").replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }

async function loadMessages() {
  if(!ME || loadingMessages || !appVisible) return;
  loadingMessages=true;
  try {
  let r = await fetch(API + "?action=msgs", {cache:"no-store"});
  let d = await r.json();

  chat.innerHTML = "";
  publicChat.innerHTML = "";

  d.slice(1).forEach(row => {
    let from = row[1];
    let to = row[2];
    let message = row[3];
    if(!notificationInitialized){
      const k=notificationKey(row);
      notificationKeys.add(k);
    } else {
      addIncomingNotification(row);
    }
    if(to !== "ALL") saveKnownMembers([from,to]);
    else saveKnownMembers([from]);

    // Public message
    if (to == "ALL") {
      publicChat.innerHTML += "<div><b>" + escapeHTML(from) + ":</b> " + escapeHTML(message) + "</div>";
    }

    // Private message: only if a member is selected
    else if (member.value && ((from == ME && to == member.value) || (from == member.value && to == ME))) {
      chat.innerHTML += "<div class='" + (from == ME ? "msgMe" : "msgOther") + "'>" + escapeHTML(message) + "</div>";
    }
  });

  notificationInitialized=true;
  chat.scrollTop = chat.scrollHeight;
  publicChat.scrollTop = publicChat.scrollHeight;
  } catch(err) { console.warn("Message refresh failed", err); } finally { loadingMessages=false; }
}
// ---------- ALL MEMBERS + ONLINE/OFFLINE ----------
function getKnownMembers(){
  try{
    const a=JSON.parse(localStorage.getItem("chatAllMembers")||"[]");
    return Array.isArray(a)?a.map(String).filter(Boolean):[];
  }catch(e){ return []; }
}
function saveKnownMembers(list){
  const old=getKnownMembers();
  const incoming=Array.isArray(list)?list.map(String).filter(Boolean):[];
  const all=[...new Set([...old,...incoming])];
  localStorage.setItem("chatAllMembers",JSON.stringify(all));
  return all;
}
function renderMemberList(allMembers,onlineMembers,current){
  const all=[...new Set(allMembers.map(String).filter(x=>x && x!==String(ME)))];
  const online=new Set(onlineMembers.map(String));
  all.sort((a,b)=>{
    const ao=online.has(a)?0:1, bo=online.has(b)?0:1;
    return ao-bo || a.localeCompare(b);
  });
  const on=all.filter(x=>online.has(x));
  const off=all.filter(x=>!online.has(x));
  let html="<option value=''>Select Member</option>";
  if(on.length) html+="<optgroup label='🟢 Online'>"+on.map(x=>"<option class='memberOptionOnline' value='"+x.replace(/'/g,"&#39;")+"'>🟢 "+x+" — Online</option>").join("")+"</optgroup>";
  if(off.length) html+="<optgroup label='⚪ Offline'>"+off.map(x=>"<option class='memberOptionOffline' value='"+x.replace(/'/g,"&#39;")+"'>⚪ "+x+" — Offline</option>").join("")+"</optgroup>";
  member.innerHTML=html;
  if(current && all.includes(String(current))) member.value=current;
}
async function loadMembers(){
  if(!ME || loadingMembers || !appVisible) return;
  loadingMembers=true;
  const current=member.value;
  try{
    const r=await fetch(API+"?action=members",{cache:"no-store"});
    const data=await r.json();
    const onlineMembers=Array.isArray(data?.online)?data.online.map(String).filter(Boolean):[];
    const serverAll=Array.isArray(data?.all)?data.all.map(String).filter(Boolean):[];
    cachedMembers=onlineMembers;
    const allMembers=saveKnownMembers(serverAll);
    renderMemberList(allMembers,onlineMembers,current);
  }catch(e){
    console.warn("Member refresh failed",e);
    renderMemberList(getKnownMembers(),[],current);
  }finally{ loadingMembers=false; }
}
// ---------- PASSWORD RESET ----------
// SEND OTP
async function sendForgetOTP(){
  const memberId = fMemberID.value.trim();
  if(!memberId){ resetMsg.innerText="Enter Member ID"; return; }

  const res = await fetch(API, {
    method:'POST',
    body: new URLSearchParams({
      action:'sendOTP',
      memberId: memberId
    })
  });
  const data = await res.json();

  if(data.error){
    resetMsg.innerText = data.error;
  } else {
    resetMsg.innerText = "OTP sent to your registered email.";
  }
}

async function verifyForgetOTP(){
  const memberId = fMemberID.value.trim();
  const otp = fOTP.value.trim();
  const pass1 = fNew.value.trim();
  const pass2 = fNew2.value.trim();

  if(!memberId || !otp || !pass1 || !pass2){ resetMsg.innerText="Fill all fields"; return; }
  if(pass1 !== pass2){ resetMsg.innerText="Passwords do not match"; return; }

  const res = await fetch(API, {
    method:'POST',
    body: new URLSearchParams({
      action:'verifyOTP',
      memberId: memberId,
      otp: otp,
      newpass: pass1
    })
  });

  const data = await res.json();
  if(data.error){ resetMsg.innerText = data.error; }
  else { resetMsg.innerText = "Password changed successfully."; showLogin(); }
}
    
// VERIFY + CHANGE PASSWORD
async function resetPass(){

if(!fotp.value || !fnew.value){
alert("Enter OTP and new password");
return;
}

let r = await fetch(API,{
method:'post',
body:new URLSearchParams({
action:'resetPass',
id:fid.value,
otp:fotp.value,
newpass:fnew.value
})
});

let t = await r.text();

if(t=="changed"){
alert("Password Changed Successfully");
showLogin();
}
else{
alert("Wrong OTP");
}

}
    
async function changePass(){
  const oldPass = String(cold.value || "");
  const newPass = String(cnew.value || "");
  const retypePass = String(cretype.value || "");

  if(!oldPass || !newPass || !retypePass){
    alert("Fill all fields");
    return;
  }

  if(newPass !== retypePass){
    alert("New password not match");
    return;
  }

  const memberId = String(
    ME_ID || sessionStorage.getItem("chat_member_id") ||
    document.getElementById("loginID").value || ""
  ).trim();

  if(!memberId){
    alert("Member ID not found. Please login again.");
    return;
  }

  const btn = document.querySelector('#changeDiv button[onclick="changePass()"]');
  if(btn){ btn.disabled=true; btn.textContent="Updating..."; }

  try{
    const res = await fetch(API,{
      method:'POST',
      body:new URLSearchParams({
        action:'changePass',
        id:memberId,
        oldpass:oldPass,
        newpass:newPass
      }),
      cache:'no-store'
    });

    const raw = (await res.text()).trim();
    let data = null;
    try { data = JSON.parse(raw); } catch(e) {}

    // The current Apps Script returns JSON: {ok:true} or {error:"..."}.
    if(data && data.ok === true){
      alert("Password Changed Successfully.");
      cold.value="";
      cnew.value="";
      cretype.value="";
      showPrivate();
      return;
    }

    if(data && data.error){
      alert(data.error);
      return;
    }

    // Backward compatibility if an older deployment returns plain text.
    if(raw.toLowerCase() === "changed" || raw.toLowerCase() === "ok") {
      alert("Password Changed Successfully.");
      cold.value=""; cnew.value=""; cretype.value="";
      showPrivate();
      return;
    }

    alert("Password change failed: " + (raw || "No response from server"));
  }catch(err){
    console.error("Change password error:",err);
    alert("Password change failed. Please check your internet connection.");
  }finally{
    if(btn){ btn.disabled=false; btn.textContent="Update Password"; }
  }
}
// ---------- PHOTO UPLOAD ----------
async function changeProfilePhoto(){
  const fileInput = document.createElement("input");
  fileInput.type="file"; fileInput.accept="image/*"; fileInput.click();
  fileInput.onchange = async ()=>{
    const file=fileInput.files[0]; if(!file)return;
    const reader = new FileReader();
    reader.onload=async ()=>{
      try{
        const base64=reader.result.split(",")[1];
        const res=await fetch(API,{
          method:"POST",
          body:new URLSearchParams({
            action:"uploadPhoto",
            memberId:ME_ID,
            image:base64
          })
        });
        const data=await res.json();
        if(data.ok && data.url){
          myPhoto.src=data.url;
          alert("Photo Updated");
        }else{
          alert(data.error || "Upload Failed");
        }
      }catch(err){
        console.error(err);
        alert("Photo upload failed");
      }
    };
    reader.readAsDataURL(file);
  };
}

  // Example: Send photo/file/audio/video
async function sendFileMessage(file){
  const reader = new FileReader();
  reader.onload = async ()=>{
    const base64 = reader.result;
    const filename = file.name;

    // 1️⃣ Upload to Litterbox
    const uploadRes = await fetch(API, {
      method: "POST",
      body: new URLSearchParams({
        action: "uploadTempFile",
        file: base64,
        name: filename,
        mime: file.type || "application/octet-stream",
        memberId: ME_ID
      })
    });
    const data = await uploadRes.json();
    if(!data.url){ alert("Upload failed"); return; }

    // 2️⃣ Send message with file URL
    await fetch(API, {
      method: "POST",
      body: new URLSearchParams({
        action: "send",
        from: ME,
        to: member.value,
        msg: "",
        type: file.type.split("/")[0],
        fileURL: data.url
      })
    });
  };
  reader.readAsDataURL(file);
}

function openFile(){

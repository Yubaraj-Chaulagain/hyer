<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YouTube + TikTok + Mobile Video Player</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0b0b0b;
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:12px;
}

h2{
    text-align:center;
    margin:8px 0 14px;
}

.input-row{
    display:flex;
    gap:8px;
    margin-bottom:8px;
}

input[type="text"]{
    flex:1;
    min-width:0;
    padding:12px;
    border-radius:8px;
    border:1px solid #444;
    background:#181818;
    color:#fff;
}

button,
.local-btn{
    border:0;
    border-radius:8px;
    padding:11px 14px;
    background:#222;
    color:#fff;
    cursor:pointer;
    font-size:14px;
}

button:hover,
.local-btn:hover{
    background:#333;
}

.load-btn{
    background:#e50914;
}

.load-btn:hover{
    background:#ff1a25;
}

.local-btn{
    display:inline-block;
    background:#075e54;
}

.local-btn input{
    display:none;
}

.clear-btn{
    background:#642020;
}

.status{
    padding:8px 10px;
    background:#151515;
    border-radius:7px;
    margin:8px 0;
    font-size:13px;
    color:#bbb;
}

.player-box{
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border-radius:10px;
    overflow:hidden;
    margin:10px 0;
    position:relative;
}

#youtubePlayer,
#tiktokPlayer,
#localPlayer{
    width:100%;
    height:100%;
}

#youtubePlayer{
    display:block;
}

#tiktokPlayer{
    display:none;
    border:0;
    background:#000;
}

#localPlayer{
    display:none;
    object-fit:contain;
    background:#000;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:center;
    margin:8px 0;
}

.controls button{
    min-width:70px;
}

.volume-box{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin:8px 0 14px;
}

#volume{
    width:180px;
}

.section{
    background:#121212;
    border-radius:10px;
    padding:10px;
    margin-top:12px;
}

.section h3{
    margin:4px 0 10px;
    font-size:17px;
}

.search{
    width:100%;
    padding:11px;
    border-radius:8px;
    border:1px solid #444;
    background:#181818;
    color:#fff;
    margin-bottom:8px;
}

.video-list{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.video-item{
    display:flex;
    gap:10px;
    align-items:center;
    padding:7px;
    background:#1b1b1b;
    border-radius:8px;
    cursor:pointer;
}

.video-item:hover{
    background:#282828;
}

.thumb{
    width:110px;
    height:62px;
    object-fit:cover;
    border-radius:6px;
    background:#000;
    flex-shrink:0;
}

.tiktok-thumb{
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
}

.video-info{
    min-width:0;
}

.video-title{
    font-size:14px;
    font-weight:bold;
    line-height:1.3;
    overflow:hidden;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
}

.video-type{
    font-size:11px;
    color:#999;
    margin-top:4px;
}

.local-tools{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.empty{
    text-align:center;
    color:#777;
    padding:15px;
    font-size:13px;
}

@media(max-width:600px){

    .input-row{
        flex-direction:column;
    }

    .input-row button{
        width:100%;
    }

    .controls button{
        min-width:62px;
        padding:10px 8px;
        font-size:13px;
    }

    .thumb{
        width:90px;
        height:51px;
    }

    .video-title{
        font-size:13px;
    }
}
</style>
</head>

<body>

<div class="container">

<h2>▶ YouTube + TikTok + Mobile Player</h2>

<div class="input-row">

    <input
        type="text"
        id="videoUrl"
        placeholder="Paste YouTube or TikTok URL..."
    >

    <button class="load-btn" onclick="loadVideoURL()">
        Load Video
    </button>

</div>

<div class="local-tools">

    <label class="local-btn">
        📱 Select Mobile Videos

        <input
            type="file"
            id="localVideos"
            accept="video/*"
            multiple
        >

    </label>

    <button
        class="clear-btn"
        onclick="clearLocalVideos()"
    >
        🗑 Clear Mobile Videos
    </button>

</div>

<div class="status" id="status">
    Ready
</div>


<!-- PLAYER -->

<div class="player-box">

    <div id="youtubePlayer"></div>

    <iframe
        id="tiktokPlayer"
        allow="fullscreen"
        title="TikTok Player"
    ></iframe>

    <video
        id="localPlayer"
        playsinline
        preload="metadata"
    ></video>

</div>


<!-- CONTROLS -->

<div class="controls">

    <button onclick="previousVideo()">
        ⏮ Previous
    </button>

    <button onclick="seekVideo(-10)">
        ↶ -10
    </button>

    <button onclick="playVideo()">
        ▶ Play
    </button>

    <button onclick="pauseVideo()">
        ⏸ Pause
    </button>

    <button onclick="seekVideo(10)">
        +10 ↷
    </button>

    <button onclick="nextVideo()">
        Next ⏭
    </button>

    <button onclick="stopVideo()">
        ⏹ Stop
    </button>

</div>


<div class="volume-box">

    🔊

    <input
        type="range"
        id="volume"
        min="0"
        max="100"
        value="100"
        oninput="changeVolume(this.value)"
    >

    <span id="volumeText">
        100%
    </span>

</div>


<!-- GOOGLE SHEET -->

<div class="section">

    <h3>📊 Google Sheet Videos</h3>

    <input
        class="search"
        id="search"
        type="text"
        placeholder="Search videos..."
        oninput="searchVideos()"
    >

    <div
        id="sheetList"
        class="video-list"
    >
        <div class="empty">
            Loading Google Sheet...
        </div>
    </div>

</div>


<!-- LOCAL -->

<div class="section">

    <h3>📱 Mobile Videos</h3>

    <div
        id="localList"
        class="video-list"
    >

        <div class="empty">
            No mobile videos selected.
        </div>

    </div>

</div>


<!-- HISTORY -->

<div class="section">

    <h3>🕘 History</h3>

    <div
        id="historyList"
        class="video-list"
    >

        <div class="empty">
            No history yet.
        </div>

    </div>

</div>

</div>


<!-- YOUTUBE API -->

<script src="https://www.youtube.com/iframe_api"></script>


<script>

/* =====================================================
   GOOGLE SHEET
===================================================== */

const SHEET_CSV =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQfLCxJaz-eDFB7SGeROjZDepLOHg1ZggZhYf5kfWJc8S-l1H9frmOshuakfD7_4ocFZd2tvRvEaLN9/pub?gid=281133690&single=true&output=csv";


/* =====================================================
   VARIABLES
===================================================== */

let player = null;

let playerReady = false;

let sheetVideos = [];

let currentIndex = -1;

let localVideos = [];

let localIndex = -1;

let mode = "youtube";

let historyVideos = [];


/* =====================================================
   YOUTUBE READY
===================================================== */

function onYouTubeIframeAPIReady(){

    player =
        new YT.Player(
            "youtubePlayer",
            {

                height:"100%",
                width:"100%",

                videoId:"",

                playerVars:{
                    autoplay:0,
                    controls:1,
                    rel:0,
                    playsinline:1,
                    modestbranding:1
                },

                events:{

                    onReady:function(){

                        playerReady = true;

                        setStatus(
                            "YouTube player ready"
                        );

                    },

                    onStateChange:onPlayerStateChange,

                    onError:function(event){

                        setStatus(
                            "YouTube error: " +
                            event.data
                        );

                    }

                }

            }
        );

}


/* =====================================================
   YOUTUBE STATE
===================================================== */

function onPlayerStateChange(event){

    if(
        player &&
        event.data ===
        YT.PlayerState.ENDED
    ){

        setTimeout(
            nextVideo,
            300
        );

    }

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(text){

    document
        .getElementById("status")
        .textContent = text;

}


/* =====================================================
   YOUTUBE ID
===================================================== */

function extractVideoID(input){

    if(!input){

        return null;

    }

    input =
        String(input).trim();


    if(
        /^[a-zA-Z0-9_-]{11}$/.test(input)
    ){

        return input;

    }


    try{

        const url =
            new URL(input);

        if(
            url.hostname.includes(
                "youtube.com"
            ) &&
            url.searchParams.get("v")
        ){

            return url.searchParams.get("v");

        }


        if(
            url.hostname ===
            "youtu.be"
        ){

            return url.pathname
                .substring(1);

        }


        if(
            url.pathname
                .startsWith("/embed/")
        ){

            return url.pathname
                .split("/")[2];

        }


        if(
            url.pathname
                .startsWith("/shorts/")
        ){

            return url.pathname
                .split("/")[2];

        }

    }catch(e){

        return null;

    }

    return null;

}


/* =====================================================
   TIKTOK URL CHECK
===================================================== */

function isTikTokURL(url){

    if(!url){

        return false;

    }

    return /(^|\/\/)(www\.)?(tiktok\.com|vm\.tiktok\.com|vt\.tiktok\.com)/i
        .test(url);

}


/* =====================================================
   TIKTOK ID
===================================================== */

function extractTikTokID(input){

    if(!input){

        return null;

    }

    input =
        String(input).trim();


    /*
       Direct TikTok numeric ID
    */

    if(/^\d{15,25}$/.test(input)){

        return input;

    }


    try{

        const url =
            new URL(input);


        /*
           Official TikTok player URL
        */

        const playerMatch =
            url.pathname.match(
                /\/player\/v1\/(\d+)/i
            );

        if(playerMatch){

            return playerMatch[1];

        }


        /*
           Normal TikTok URL

           /@username/video/123456
        */

        const videoMatch =
            url.pathname.match(
                /\/video\/(\d+)/i
            );

        if(videoMatch){

            return videoMatch[1];

        }

    }catch(e){

        return null;

    }


    return null;

}


/* =====================================================
   IMAGE URL FROM SHEET
===================================================== */

function extractImageURL(value){

    if(!value){

        return "";

    }

    const text =
        String(value);


    /*
       Handles:

       https://...

       IMAGE("https://...")
    */

    const match =
        text.match(
            /https?:\/\/[^"')\s]+/i
        );


    if(match){

        return match[0];

    }


    return "";

}


/* =====================================================
   LOAD MANUAL URL
===================================================== */

function loadVideoURL(){

    const input =
        document
        .getElementById("videoUrl")
        .value
        .trim();


    if(!input){

        alert(
            "YouTube वा TikTok URL राख्नुहोस्।"
        );

        return;

    }


    /*
       TIKTOK
    */

    if(isTikTokURL(input)){

        const id =
            extractTikTokID(input);


        if(id){

            currentIndex =
                sheetVideos.findIndex(
                    v =>
                        v.type === "tiktok" &&
                        v.id === id
                );


            loadTikTok(
                id,
                "Manual TikTok Video",
                input
            );

            return;

        }


        /*
           vm.tiktok.com short URL
           browser बाट redirect resolve
           गर्न CORS limitation हुन सक्छ।
        */

        alert(
            "यो TikTok short URL हो।\n\n" +
            "Google Sheet को D column मा TikTok Video ID राख्नुहोस्, " +
            "वा TikTok को full URL प्रयोग गर्नुहोस्।"
        );

        return;

    }


    /*
       YOUTUBE
    */

    const id =
        extractVideoID(input);


    if(!id){

        alert(
            "Valid YouTube वा TikTok URL भेटिएन।"
        );

        return;

    }


    const foundIndex =
        sheetVideos.findIndex(
            v =>
                v.type === "youtube" &&
                v.id === id
        );


    if(foundIndex !== -1){

        loadYouTubeVideo(
            foundIndex
        );

        return;

    }


    mode = "youtube";

    currentIndex = -1;

    showYouTubePlayer();


    if(playerReady){

        player.loadVideoById(id);


        addHistory({

            id:id,

            title:"Manual YouTube Video",

            type:"YouTube",

            url:input

        });


        setStatus(
            "Playing manual YouTube video"
        );

    }

}


/* =====================================================
   LOAD SHEET YOUTUBE
===================================================== */

function loadYouTubeVideo(index){

    if(!sheetVideos.length){

        return;

    }


    if(index < 0){

        index =
            sheetVideos.length - 1;

    }


    if(index >= sheetVideos.length){

        index = 0;

    }


    /*
       If current item is TikTok,
       use TikTok player
    */

    const video =
        sheetVideos[index];


    if(video.type === "tiktok"){

        loadTikTok(
            video.id,
            video.title,
            video.url,
            index
        );

        return;

    }


    currentIndex = index;

    mode = "youtube";

    showYouTubePlayer();


    if(!playerReady){

        setStatus(
            "YouTube player loading..."
        );

        return;

    }


    player.loadVideoById(
        video.id
    );


    addHistory({

        id:video.id,

        title:video.title,

        type:"Google Sheet YouTube",

        url:video.url,

        thumbnail:video.thumbnail || ""

    });


    setStatus(
        "YouTube: " +
        video.title
    );


    renderSheetVideos();

}


/* =====================================================
   LOAD TIKTOK
===================================================== */

function loadTikTok(
    id,
    title,
    url,
    index
){

    if(!id){

        setStatus(
            "TikTok Video ID भेटिएन।"
        );

        return;

    }


    mode = "tiktok";


    if(
        typeof index === "number" &&
        index >= 0
    ){

        currentIndex = index;

    }
    else{

        currentIndex =
            sheetVideos.findIndex(
                v =>
                    v.type === "tiktok" &&
                    v.id === id
            );

    }


    showTikTokPlayer();


    const iframe =
        document.getElementById(
            "tiktokPlayer"
        );


    /*
       TikTok Official Embed Player
    */

    iframe.src =
        "https://www.tiktok.com/player/v1/" +
        encodeURIComponent(id) +
        "?controls=1" +
        "&description=1" +
        "&music_info=1";


    addHistory({

        id:id,

        title:title ||
            "TikTok Video",

        type:"TikTok",

        url:url || "",

        thumbnail:
            findThumbnail(
                id,
                "tiktok"
            )

    });


    setStatus(
        "TikTok: " +
        (title || "Video")
    );


    renderSheetVideos();

}


/* =====================================================
   FIND THUMBNAIL
===================================================== */

function findThumbnail(
    id,
    type
){

    const video =
        sheetVideos.find(
            v =>
                v.id === id &&
                v.type === type
        );


    if(video){

        return video.thumbnail || "";

    }


    return "";

}


/* =====================================================
   NEXT
===================================================== */

function nextVideo(){

    /*
       LOCAL
    */

    if(mode === "local"){

        if(!localVideos.length){

            return;

        }


        localIndex++;


        if(
            localIndex >=
            localVideos.length
        ){

            localIndex = 0;

        }


        playLocalVideo(
            localIndex
        );

        return;

    }


    /*
       SHEET
    */

    if(!sheetVideos.length){

        setStatus(
            "Google Sheet मा video छैन।"
        );

        return;

    }


    currentIndex++;


    if(
        currentIndex >=
        sheetVideos.length
    ){

        currentIndex = 0;

    }


    const video =
        sheetVideos[currentIndex];


    if(video.type === "tiktok"){

        loadTikTok(
            video.id,
            video.title,
            video.url,
            currentIndex
        );

    }
    else{

        loadYouTubeVideo(
            currentIndex
        );

    }

}


/* =====================================================
   PREVIOUS
===================================================== */

function previousVideo(){

    if(mode === "local"){

        if(!localVideos.length){

            return;

        }


        localIndex--;


        if(localIndex < 0){

            localIndex =
                localVideos.length - 1;

        }


        playLocalVideo(
            localIndex
        );

        return;

    }


    if(!sheetVideos.length){

        return;

    }


    currentIndex--;


    if(currentIndex < 0){

        currentIndex =
            sheetVideos.length - 1;

    }


    const video =
        sheetVideos[currentIndex];


    if(video.type === "tiktok"){

        loadTikTok(
            video.id,
            video.title,
            video.url,
            currentIndex
        );

    }
    else{

        loadYouTubeVideo(
            currentIndex
        );

    }

}


/* =====================================================
   PLAY
===================================================== */

function playVideo(){

    if(mode === "local"){

        const video =
            document.getElementById(
                "localPlayer"
            );

        video.play().catch(
            function(){}
        );

        return;

    }


    if(mode === "tiktok"){

        sendTikTokMessage(
            "play",
            null
        );

        return;

    }


    if(
        playerReady &&
        player
    ){

        player.playVideo();

    }

}


/* =====================================================
   PAUSE
===================================================== */

function pauseVideo(){

    if(mode === "local"){

        document
            .getElementById(
                "localPlayer"
            )
            .pause();

        return;

    }


    if(mode === "tiktok"){

        sendTikTokMessage(
            "pause",
            null
        );

        return;

    }


    if(
        playerReady &&
        player
    ){

        player.pauseVideo();

    }

}


/* =====================================================
   STOP
===================================================== */

function stopVideo(){

    if(mode === "local"){

        const video =
            document.getElementById(
                "localPlayer"
            );

        video.pause();

        video.currentTime = 0;

        return;

    }


    if(mode === "tiktok"){

        sendTikTokMessage(
            "seekTo",
            0
        );

        sendTikTokMessage(
            "pause",
            null
        );

        return;

    }


    if(
        playerReady &&
        player
    ){

        player.pauseVideo();

        player.seekTo(
            0,
            true
        );

    }

}


/* =====================================================
   SEEK
===================================================== */

function seekVideo(seconds){

    /*
       LOCAL
    */

    if(mode === "local"){

        const video =
            document.getElementById(
                "localPlayer"
            );


        let target =
            video.currentTime +
            seconds;


        if(
            Number.isFinite(
                video.duration
            )
        ){

            target =
                Math.max(
                    0,
                    Math.min(
                        video.duration,
                        target
                    )
                );

        }
        else{

            target =
                Math.max(
                    0,
                    target
                );

        }


        video.currentTime =
            target;

        return;

    }


    /*
       TIKTOK
    */

    if(mode === "tiktok"){

        /*
           TikTok iframe बाट current
           time direct read गर्न
           requestCurrentTime पठाइन्छ।
        */

        const iframe =
            document.getElementById(
                "tiktokPlayer"
            );


        iframe.contentWindow.postMessage(
            {
                type:"getCurrentTime",
                "x-tiktok-player":true
            },
            "*"
        );


        /*
           last known time प्रयोग
        */

        let target =
            (window.tiktokCurrentTime || 0)
            + seconds;


        target =
            Math.max(
                0,
                target
            );


        sendTikTokMessage(
            "seekTo",
            target
        );

        window.tiktokCurrentTime =
            target;

        return;

    }


    /*
       YOUTUBE
    */

    if(
        !playerReady ||
        !player
    ){

        return;

    }


    const current =
        player.getCurrentTime();


    const duration =
        player.getDuration();


    let target =
        current + seconds;


    target =
        Math.max(
            0,
            Math.min(
                duration,
                target
            )
        );


    player.seekTo(
        target,
        true
    );

}


/* =====================================================
   TIKTOK MESSAGE
===================================================== */

function sendTikTokMessage(
    type,
    value
){

    const iframe =
        document.getElementById(
            "tiktokPlayer"
        );


    if(
        !iframe ||
        !iframe.contentWindow
    ){

        return;

    }


    iframe.contentWindow.postMessage(
        {
            type:type,

            value:value,

            "x-tiktok-player":true

        },
        "*"
    );

}


/* =====================================================
   TIKTOK EVENTS
===================================================== */

window.addEventListener(
    "message",
    function(event){

        const data =
            event.data;


        if(
            !data ||
            data["x-tiktok-player"] !== true
        ){

            return;

        }


        /*
           TikTok current time
        */

        if(
            data.type ===
            "onCurrentTime"
        ){

            window.tiktokCurrentTime =
                Number(data.value) || 0;

        }


        /*
           State:
           0 = ended
           1 = playing
           2 = paused
           3 = buffering
        */

        if(
            data.type ===
            "onStateChange"
        ){

            const state =
                Number(data.value);


            if(state === 0){

                setTimeout(
                    nextVideo,
                    300
                );

            }

        }

    }
);


/* =====================================================
   VOLUME
===================================================== */

function changeVolume(value){

    value =
        Number(value);


    document
        .getElementById(
            "volumeText"
        )
        .textContent =
        value + "%";


    if(mode === "local"){

        document
            .getElementById(
                "localPlayer"
            )
            .volume =
            value / 100;

        return;

    }


    if(mode === "tiktok"){

        /*
           TikTok official player supports
           mute / unMute rather than normal
           volume slider.
        */

        if(value <= 0){

            sendTikTokMessage(
                "mute",
                null
            );

        }
        else{

            sendTikTokMessage(
                "unMute",
                null
            );

        }

        return;

    }


    if(
        playerReady &&
        player
    ){

        player.setVolume(
            value
        );

    }

}

/* =====================================================
   LOCAL FILE SELECT
===================================================== */

document
    .getElementById(
        "localVideos"
    )
    .addEventListener(
        "change",
        function(event){

            const files =
                Array.from(
                    event.target.files || []
                );


            if(!files.length){

                return;

            }


            localVideos.forEach(
                function(video){

                    URL.revokeObjectURL(
                        video.url
                    );

                }
            );


            localVideos =
                files.map(
                    function(file){

                        return {

                            file:file,

                            url:
                                URL.createObjectURL(
                                    file
                                ),

                            title:
                                file.name

                        };

                    }
                );


            localIndex = -1;


            renderLocalVideos();


            setStatus(
                localVideos.length +
                " वटा mobile video loaded"
            );


            playLocalVideo(0);

        }
    );


/* =====================================================
   PLAY LOCAL
===================================================== */

function playLocalVideo(index){

    if(!localVideos.length){

        return;

    }


    if(index < 0){

        index =
            localVideos.length - 1;

    }


    if(
        index >=
        localVideos.length
    ){

        index = 0;

    }


    localIndex = index;

    mode = "local";

    showLocalPlayer();


    const video =
        document.getElementById(
            "localPlayer"
        );


    const item =
        localVideos[index];


    video.src =
        item.url;


    video.volume =
        Number(
            document.getElementById(
                "volume"
            ).value
        ) / 100;


    video.load();


    video.play().catch(
        function(){

            setStatus(
                "Video loaded — Play थिच्नुहोस्"
            );

        }
    );


    addHistory({

        id:
            "local-" + index,

        title:
            item.title,

        type:
            "Mobile"

    });


    setStatus(
        "📱 " +
        item.title
    );


    renderLocalVideos();

}


/* =====================================================
   LOCAL ENDED

document

function renderLocalVideos(){

    const box =

/* =====================================================
   CLEAR LOCAL
===================================================== */

function clearLocalVideos(){

    const video =
        document.getElementById(
            "localPlayer"
        );


    video.pause();

    video.removeAttribute(
        "src"
    );

    video.load();


    localVideos.forEach(
        function(item){

            URL.revokeObjectURL(
                item.url
            );

        }
    );


    localVideos = [];

    localIndex = -1;


    renderLocalVideos();


    mode = "youtube";

    showYouTubePlayer();


    setStatus(
        "Mobile videos cleared"
    );

}


/* =====================================================
   LOAD GOOGLE SHEET
===================================================== */

async function loadSheetVideos(){

    try{

        setStatus(
            "Google Sheet loading..."
        );


        const response =
            await fetch(
                SHEET_CSV +
                "&t=" +
                Date.now()
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const csv =
            await response.text();


        sheetVideos =
            parseCSV(csv);


        renderSheetVideos();


        setStatus(
            sheetVideos.length +
            " वटा Google Sheet videos loaded"
        );


    }
    catch(error){

        console.error(error);


        document
            .getElementById(
                "sheetList"
            )
            .innerHTML =

            '<div class="empty">' +
            'Google Sheet load failed.<br>' +
            escapeHTML(
                error.message
            ) +
            '</div>';


        setStatus(
            "Google Sheet load failed"
        );

    }

}


/* =====================================================
   CSV PARSER
===================================================== */

function parseCSV(csv){

    const rows = [];

    let row = [];

    let value = "";

    let insideQuotes = false;


    for(
        let i = 0;
        i < csv.length;
        i++
    ){

        const char =
            csv[i];

        const next =
            csv[i + 1];


        if(
            char === '"' &&
            next === '"'
        ){

            value += '"';

            i++;

        }

        else if(
            char === '"'
        ){

            insideQuotes =
                !insideQuotes;

        }

        else if(
            char === ',' &&
            !insideQuotes
        ){

            row.push(
                value.trim()
            );

            value = "";

        }

        else if(
            (
                char === '\n' ||
                char === '\r'
            ) &&
            !insideQuotes
        ){

            if(
                char === '\r' &&
                next === '\n'
            ){

                i++;

            }


            row.push(
                value.trim()
            );


            if(
                row.some(
                    x => x !== ""
                )
            ){

                rows.push(row);

            }


            row = [];

            value = "";

        }

        else{

            value += char;

        }

    }


    if(
        value !== "" ||
        row.length
    ){

        row.push(
            value.trim()
        );


        if(
            row.some(
                x => x !== ""
            )
        ){

            rows.push(row);

        }

    }


    /*
       Header skip
    */

    const data =
        rows.slice(1);


    const result = [];


    data.forEach(
        function(cols){

            /*
               A = Title
               B = URL
               C = Thumbnail
               D = Video ID
            */

            const title =
                (
                    cols[0] ||
                    "Untitled Video"
                ).trim();


            const url =
                (
                    cols[1] ||
                    ""
                ).trim();


            const thumbnail =
                extractImageURL(
                    cols[2] || ""
                );


            const sheetID =
                (
                    cols[3] ||
                    ""
                ).trim();


            /*
               TIKTOK
            */

            if(
                isTikTokURL(url)
            ){

                let id =
                    extractTikTokID(
                        url
                    );


                /*
                   If URL is
                   vm.tiktok.com,
                   use D column ID
                */

                if(
                    !id &&
                    /^\d{15,25}$/.test(
                        sheetID
                    )
                ){

                    id = sheetID;

                }


                if(id){

                    result.push({

                        id:id,

                        title:title,

                        url:url,

                        thumbnail:
                            thumbnail,

                        type:"tiktok"

                    });

                }


                return;

            }


            /*
               YOUTUBE
            */

            const youtubeID =
                extractVideoID(
                    url
                );


            if(youtubeID){

                result.push({

                    id:youtubeID,

                    title:title,

                    url:url,

                    thumbnail:
                        thumbnail,

                    type:"youtube"

                });

            }

        }
    );


    return result;

}


/* =====================================================
   RENDER SHEET
===================================================== */

function renderSheetVideos(){

    const box =
        document.getElementById(
            "sheetList"
        );


    const search =
        document
            .getElementById(
                "search"
            )
            .value
            .toLowerCase()
            .trim();


    box.innerHTML = "";


    const filtered =
        sheetVideos.filter(
            function(video){

                return (

                    video.title
                        .toLowerCase()
                        .includes(
                            search
                        )

                    ||

                    video.id
                        .toLowerCase()
                        .includes(
                            search
                        )

                    ||

                    video.url
                        .toLowerCase()
                        .includes(
                            search
                        )

                );

            }
        );


    if(!filtered.length){

        box.innerHTML =
            '<div class="empty">' +
            'Video भेटिएन।' +
            '</div>';

        return;

    }


    filtered.forEach(
        function(video){

            const index =
                sheetVideos.indexOf(
                    video
                );


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "video-item";


            let thumbnailHTML = "";


            /*
               YOUTUBE THUMBNAIL
            */

            if(
                video.type ===
                "youtube"
            ){

                thumbnailHTML = `

                    <img
                        class="thumb"
                        src="https://img.youtube.com/vi/${encodeURIComponent(video.id)}/hqdefault.jpg"
                        loading="lazy"
                        onerror="this.style.display='none'"
                    >

                `;

            }

            /*
               TIKTOK THUMBNAIL
            */

            else{

                if(video.thumbnail){

                    thumbnailHTML = `

                        <img
                            class="thumb"
                            src="${escapeHTML(
                                video.thumbnail
                            )}"
                            loading="lazy"
                            onerror="this.outerHTML='<div class=&quot;thumb tiktok-thumb&quot;>♪</div>'"
                        >

                    `;

                }
                else{

                    thumbnailHTML = `

                        <div class="thumb tiktok-thumb">
                            ♪
                        </div>

                    `;

                }

            }


            item.innerHTML = `

                ${thumbnailHTML}

                <div class="video-info">

                    <div class="video-title">
                        ${escapeHTML(
                            video.title
                        )}
                    </div>

                    <div class="video-type">

                        ${
                            video.type ===
                            "tiktok"
                            ? "TikTok"
                            : "YouTube"
                        }

                        • Sheet #${index + 1}

                    </div>

                </div>

            `;


            item.onclick =
                function(){

                    if(
                        video.type ===
                        "tiktok"
                    ){

                        loadTikTok(
                            video.id,
                            video.title,
                            video.url,
                            index
                        );

                    }
                    else{

                        loadYouTubeVideo(
                            index
                        );

                    }

                };


            box.appendChild(
                item
            );

        }
    );

}

===================================================== */

    renderSheetVideos();

}


/* =====================================================
   HISTORY
===================================================== */

function addHistory(video){

    historyVideos =
        historyVideos.filter(
            function(item){

                return !(
                    item.id ===
                    video.id &&

                    item.type ===
                    video.type
                );

            }
        );


    historyVideos.unshift(
        video
    );


    if(
        historyVideos.length >
        20
    ){

        historyVideos =
            historyVideos.slice(
                0,
                20
            );

    }


    renderHistory();

}


/* =====================================================
   RENDER HISTORY
===================================================== */

function renderHistory(){

    const box =
        document.getElementById(
            "historyList"
        );


    box.innerHTML = "";


    if(!historyVideos.length){

        box.innerHTML =
            '<div class="empty">' +
            'No history yet.' +
            '</div>';

        return;

    }


    historyVideos.forEach(
        function(video){

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "video-item";


            /*
               TIKTOK
            */

            if(
                video.type ===
                "TikTok"
            ){

                let thumb =
                    video.thumbnail;


                let thumbHTML =
                    thumb
                    ?

                    `<img
                        class="thumb"
                        src="${escapeHTML(
                            thumb
                        )}"
                        onerror="this.outerHTML='<div class=&quot;thumb tiktok-thumb&quot;>♪</div>'"
                    >`

                    :

                    `<div class="thumb tiktok-thumb">
                        ♪
                    </div>`;


                item.innerHTML = `

                    ${thumbHTML}

                    <div class="video-info">

                        <div class="video-title">
                            ${escapeHTML(
                                video.title
                            )}
                        </div>

                        <div class="video-type">
                            TikTok
                        </div>

                    </div>

                `;


                item.onclick =
                    function(){

                        loadTikTok(
                            video.id,
                            video.title,
                            video.url
                        );

                    };

            }


            /*
               YOUTUBE
            */

            else if(
                video.type ===
                "YouTube" ||
                video.type ===
                "Google Sheet YouTube"
            ){

                item.innerHTML = `

                    <img
                        class="thumb"
                        src="https://img.youtube.com/vi/${encodeURIComponent(video.id)}/hqdefault.jpg"
                    >

                    <div class="video-info">

                        <div class="video-title">
                            ${escapeHTML(
                                video.title
                            )}
                        </div>

                        <div class="video-type">
                            YouTube
                        </div>

                    </div>

                `;


                item.onclick =
                    function(){

                        const index =
                            sheetVideos.findIndex(
                                function(v){

                                    return (
                                        v.id ===
                                        video.id &&

                                        v.type ===
                                        "youtube"
                                    );

                                }
                            );


                        if(index !== -1){

                            loadYouTubeVideo(
                                index
                            );

                        }
                        else{

                            mode =
                                "youtube";

                            showYouTubePlayer();


                            if(playerReady){

                                player.loadVideoById(
                                    video.id
                                );

                            }

                        }

                    };

            }


            /*
               MOBILE
            */

            else{

                item.innerHTML = `

                    <div class="thumb tiktok-thumb">
                        📱
                    </div>

                    <div class="video-info">

                        <div class="video-title">
                            ${escapeHTML(
                                video.title
                            )}
                        </div>

                        <div class="video-type">
                            Mobile Video
                        </div>

                    </div>

                `;

            }


            box.appendChild(
                item
            );

        }
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text){

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitHub ZIP Storage</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;font-family:Arial;color:#17202a}header{background:#111827;color:white;text-align:center;padding:24px}main{max-width:720px;margin:auto;padding:16px}.card{background:white;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 3px 12px #0001}input{width:100%;padding:13px;border:1px solid #ccd3dc;border-radius:9px}button,.btn{border:0;border-radius:9px;padding:12px;margin:5px 3px 0 0;font-weight:bold;text-decoration:none;display:inline-block;cursor:pointer}.green{background:#16a34a;color:white}.blue{background:#2563eb;color:white}.red{background:#dc2626;color:white}.status{background:#eef2ff;padding:12px;border-radius:9px;margin-top:12px;white-space:pre-wrap}.item{border:1px solid #ddd;border-radius:12px;padding:13px;margin-top:10px}.meta,.small{font-size:13px;color:#64748b;margin-top:7px}.name{font-weight:bold;word-break:break-all}</style></head><body><header><h1>📦 GitHub ZIP Storage</h1>Upload · Update · Delete · Download</header><main><div class="card"><b>Repository:</b> Yubaraj-Chaulagain/Zip-Stroge<p class="small">Code मा तल GITHUB_TOKEN मा आफ्नो token paste गर्नुहोस्। Public website मा token राखेमा अरूले देख्न सक्छन्।</p></div><div class="card"><h2>➕ Add ZIP</h2><input id="upload" type="file" accept=".zip,application/zip"><p><button class="green" onclick="uploadZip()">⬆️ Upload ZIP</button><button onclick="loadFiles()">🔄 Refresh</button></p><div id="status" class="status">Token code मा राखेपछि Refresh थिच्नुहोस्।</div></div><div class="card"><h2>📁 Stored ZIP files</h2><input id="search" placeholder="Search ZIP..." oninput="renderFiles()"><div id="files">Ready.</div></div></main><script>
// Paste your Fine-grained GitHub token inside the quotes below.
// Required permission: Zip-Stroge repository -> Contents: Read and write.
// WARNING: Anyone who can view this HTML source can copy the token.
const GITHUB_TOKEN = "PASTE_YOUR_GITHUB_PAT_HERE";
const OWNER="Yubaraj-Chaulagain", REPO="Zip-Stroge", FOLDER="files/";let files=[];const $=id=>document.getElementById(id);
function api(path){return `https://api.github.com/repos/${OWNER}/${REPO}${path}`}function headers(){if(!GITHUB_TOKEN||GITHUB_TOKEN==="PASTE_YOUR_GITHUB_PAT_HERE")throw Error("HTML code मा GITHUB_TOKEN राख्नुहोस्।");return {Accept:"application/vnd.github+json",Authorization:"Bearer "+GITHUB_TOKEN,"X-GitHub-Api-Version":"2022-11-28"}}
function msg(s){$("status").textContent=s}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function size(n){if(!n)return"0 B";let u=["B","KB","MB","GB"],i=Math.floor(Math.log(n)/Math.log(1024));return(n/1024**i).toFixed(i?2:0)+" "+u[i]}
async function req(path,opt={}){let r=await fetch(api(path),{...opt,headers:{...headers(),...(opt.headers||{})}});if(!r.ok)throw Error("GitHub "+r.status+": "+await r.text());return r.json()}
async function loadFiles(){ $("files").textContent="Loading...";try{let d=await req("/contents/"+encodeURIComponent(FOLDER));files=(Array.isArray(d)?d:[]).filter(x=>x.type==="file"&&x.name.toLowerCase().endsWith(".zip"));renderFiles();msg("Loaded "+files.length+" ZIP file(s).")}catch(e){if(String(e).includes("GitHub 404")){files=[];renderFiles();msg("files folder छैन; पहिलो ZIP upload गर्दा बन्नेछ.")}else{$("files").textContent=e.message;msg("Load failed: token, permission, वा repo नाम जाँच्नुहोस्.")}}}
function renderFiles(){let q=$("search").value.toLowerCase();let a=files.filter(f=>f.name.toLowerCase().includes(q));$("files").innerHTML=a.length?a.map(f=>{let i=files.findIndex(x=>x.path===f.path);return `<div class="item"><div class="name">📦 ${esc(f.name)}</div><div class="meta">${size(f.size)} · SHA ${esc(f.sha.slice(0,10))}…</div><a class="btn green" href="${esc(f.download_url)}" target="_blank" rel="noopener">📥 Download</a><button class="blue" onclick="updateZip(${i})">🔄 Update/Replace</button><button class="red" onclick="deleteZip(${i})">🗑️ Delete</button></div>`}).join(""):"<p>No ZIP files found.</p>"}
function b64(buf){let s="",a=new Uint8Array(buf);for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(s)}async function getFile(path){try{return await req("/contents/"+encodeURIComponent(path))}catch(e){if(String(e).includes("GitHub 404"))return null;throw e}}
async function put(path,file,sha){let body={message:(sha?"Update ":"Add ")+file.name,content:b64(await file.arrayBuffer())};if(sha)body.sha=sha;return req("/contents/"+encodeURIComponent(path),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})}
async function uploadZip(){let f=$("upload").files[0];if(!f)return msg("पहिले ZIP file छान्नुहोस्।");if(!f.name.toLowerCase().endsWith(".zip"))return msg("ZIP file मात्र upload गर्न मिल्छ।");if(f.size>70*1024*1024)return msg("यस HTML बाट 70 MB भन्दा सानो ZIP upload गर्नुहोस्।");try{msg("Uploading...");let path=FOLDER+f.name;if(await getFile(path))return msg("त्यही नामको file छ; Update/Replace प्रयोग गर्नुहोस्।");await put(path,f);$("upload").value="";msg("Upload सफल: "+f.name);await loadFiles()}catch(e){msg("❌ "+e.message)}}
async function updateZip(i){let old=files[i],inp=document.createElement("input");inp.type="file";inp.accept=".zip,application/zip";inp.onchange=async()=>{let f=inp.files[0];if(!f)return;if(!f.name.toLowerCase().endsWith(".zip"))return msg("ZIP file छान्नुहोस्।");if(f.size>70*1024*1024)return msg("70 MB भन्दा सानो ZIP छान्नुहोस्।");try{msg("Updating...");let path=FOLDER+f.name,existing=await getFile(path);if(path===old.path)await put(path,f,old.sha);else{if(existing)await put(path,f,existing.sha);else await put(path,f);await deletePath(old.path,old.sha,"Delete old ZIP "+old.name)}msg("Update सफल: "+f.name);await loadFiles()}catch(e){msg("❌ "+e.message)}};inp.click()}
async function deletePath(path,sha,message){return req("/contents/"+encodeURIComponent(path),{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({message,sha})})}async function deleteZip(i){let f=files[i];if(!confirm("GitHub बाट यो ZIP delete गर्ने?\n"+f.name))return;try{msg("Deleting...");await deletePath(f.path,f.sha,"Delete ZIP "+f.name);msg("Deleted: "+f.name);await loadFiles()}catch(e){msg("❌ "+e.message)}}
</script></body></html>

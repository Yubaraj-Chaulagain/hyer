<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Pro Search Player</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#0f0f0f;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif
}

header{
    background:#181818;
    padding:14px;
    position:sticky;
    top:0;
    z-index:100;
    border-bottom:1px solid #303030
}

.header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    gap:10px;
    align-items:center
}

.logo{
    color:#ff0000;
    font-size:22px;
    font-weight:bold;
    white-space:nowrap
}

.search-box{
    flex:1;
    display:flex
}

.search-box input{
    flex:1;
    min-width:0;
    background:#121212;
    border:1px solid #303030;
    color:#fff;
    padding:12px 15px;
    font-size:16px;
    outline:none;
    border-radius:4px 0 0 4px
}

.search-box button{
    background:#303030;
    color:#fff;
    border:0;
    padding:0 20px;
    cursor:pointer;
    font-size:15px;
    border-radius:0 4px 4px 0
}

.search-box button:hover{
    background:#444
}

.search-box button:disabled{
    opacity:.6;
    cursor:not-allowed
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px
}

.player-section{
    background:#181818;
    border-radius:10px;
    padding:15px;
    margin-bottom:20px
}

.player-wrapper{
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border-radius:8px;
    overflow:hidden
}

#player{
    width:100%;
    height:100%
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:15px
}

.controls button{
    background:#303030;
    color:#fff;
    border:0;
    padding:10px 14px;
    border-radius:5px;
    cursor:pointer;
    font-size:14px
}

.controls button:hover{
    background:#505050
}

.volume-box{
    display:flex;
    align-items:center;
    gap:8px;
    margin-left:auto
}

.volume-box input{
    width:110px
}

.now-playing{
    margin-top:12px;
    color:#aaa;
    font-size:14px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap
}

.section-title{
    font-size:20px;
    font-weight:bold;
    margin:20px 0 12px
}

.results{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:15px
}

.video-card{
    background:#181818;
    border-radius:8px;
    overflow:hidden;
    cursor:pointer;
    transition:.2s;
    border:1px solid transparent
}

.video-card:hover{
    transform:translateY(-2px);
    border-color:#444;
    background:#202020
}

.thumbnail{
    width:100%;
    aspect-ratio:16/9;
    object-fit:cover;
    display:block;
    background:#222
}

.video-info{
    padding:12px
}

.video-title{
    font-size:15px;
    font-weight:bold;
    line-height:1.4;
    margin-bottom:8px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden
}

.channel{
    color:#aaa;
    font-size:13px
}

.queue{
    display:flex;
    flex-direction:column;
    gap:8px
}

.queue-item{
    background:#181818;
    border-radius:7px;
    padding:10px;
    display:flex;
    align-items:center;
    gap:10px
}

.queue-item.active{
    border:1px solid #ff0000
}

.queue-item img{
    width:100px;
    height:56px;
    object-fit:cover;
    border-radius:5px
}

.queue-info{
    flex:1;
    min-width:0
}

.queue-title{
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis
}

.queue-channel{
    color:#aaa;
    font-size:12px;
    margin-top:4px
}

.queue-actions{
    display:flex;
    gap:5px
}

.queue-actions button{
    background:#303030;
    border:0;
    color:#fff;
    padding:7px 9px;
    border-radius:4px;
    cursor:pointer
}

.queue-actions button:hover{
    background:#555
}

.message{
    background:#181818;
    border-radius:8px;
    padding:30px;
    text-align:center;
    color:#aaa;
    grid-column:1/-1
}

.error{
    color:#ff6666
}

.status{
    margin-top:8px;
    color:#777;
    font-size:12px
}

@media(max-width:700px){

    .header-inner{
        flex-direction:column;
        align-items:stretch
    }

    .logo{
        text-align:center
    }

    .controls{
        justify-content:center
    }

    .volume-box{
        margin-left:0;
        width:100%;
        justify-content:center
    }

    .results{
        grid-template-columns:1fr
    }

    .container{
        padding:10px
    }

    .queue-item img{
        width:80px;
        height:45px
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">

        <div class="logo">
            ▶ YouTube Pro
        </div>

        <div class="search-box">

            <input
                id="searchInput"
                type="text"
                placeholder="Search YouTube..."
                autocomplete="off"
            >

            <button id="searchButton">
                🔍 Search
            </button>

        </div>

    </div>
</header>


<main class="container">

    <!-- PLAYER -->

    <section class="player-section">

        <div class="player-wrapper">
            <div id="player"></div>
        </div>

        <div class="controls">

            <button id="previousBtn">
                ⏮ Previous
            </button>

            <button id="playBtn">
                ▶ Play
            </button>

            <button id="pauseBtn">
                ⏸ Pause
            </button>

            <button id="nextBtn">
                ⏭ Next
            </button>

            <button id="backBtn">
                ⏪ -10s
            </button>

            <button id="forwardBtn">
                +10s ⏩
            </button>

            <button id="cancelBtn">
                ✖ Cancel
            </button>

            <div class="volume-box">
                🔊
                <input
                    id="volumeControl"
                    type="range"
                    min="0"
                    max="100"
                    value="100"
                >
            </div>

        </div>

        <div
            class="now-playing"
            id="nowPlaying"
        >
            Nothing playing
        </div>

    </section>


    <!-- RESULTS -->

    <div class="section-title">
        Search Results
    </div>

    <div
        id="resultsContainer"
        class="results"
    >
        <div class="message">
            Search for a YouTube video
        </div>
    </div>


    <!-- QUEUE -->

    <div class="section-title">
        🎵 Queue
    </div>

    <div
        id="queueContainer"
        class="queue"
    >
        <div class="message">
            Queue is empty
        </div>
    </div>

</main>


<!-- YouTube IFrame Player API -->

<script src="https://www.youtube.com/iframe_api"></script>


<script>

/* =====================================================
   SERPAPI KEY
   =====================================================

   ONLY CHANGE THIS LINE.

   Example:

   const SERPAPI_KEY = "your_real_key_here";

   ===================================================== */

const SERPAPI_KEY = "c246f4daf9aee54f8d3846559be1c9b55e878dd0935bd70a18e453d6ca7dfbc8";


/* =====================================================
   GLOBAL VARIABLES
   ===================================================== */

let player = null;

let playerReady = false;

let queue = [];

let currentVideoIndex = -1;


/* =====================================================
   YOUTUBE PLAYER
   ===================================================== */

window.onYouTubeIframeAPIReady = function(){

    player = new YT.Player("player", {

        width:"100%",
        height:"100%",

        videoId:"",

        playerVars:{
            autoplay:0,
            controls:1,
            rel:0,
            modestbranding:1,
            playsinline:1
        },

        events:{

            onReady:function(event){

                playerReady = true;

                event.target.setVolume(100);

                updateNowPlaying();

            },

            onStateChange:function(event){

                if(
                    event.data ===
                    YT.PlayerState.ENDED
                ){

                    nextVideo();

                }

            },

            onError:function(event){

                console.log(
                    "YouTube error:",
                    event.data
                );

            }

        }

    });

};


/* =====================================================
   SEARCH
   ===================================================== */

document
    .getElementById("searchButton")
    .addEventListener(
        "click",
        searchVideos
    );


document
    .getElementById("searchInput")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                searchVideos();

            }

        }
    );


async function searchVideos(){

    const input =
        document.getElementById(
            "searchInput"
        );

    const button =
        document.getElementById(
            "searchButton"
        );

    const container =
        document.getElementById(
            "resultsContainer"
        );


    const query =
        input.value.trim();


    if(!query){

        alert(
            "Please enter a search query."
        );

        return;

    }


    if(
        !SERPAPI_KEY ||
        SERPAPI_KEY ===
        "YOUR_SERPAPI_KEY_HERE"
    ){

        container.innerHTML = `
            <div class="message error">
                ❌ SerpApi key is missing.<br><br>
                Open index.html and add your
                SerpApi key.
            </div>
        `;

        return;

    }


    button.disabled = true;

    button.textContent =
        "🔎 Searching...";


    container.innerHTML = `
        <div class="message">
            🔎 Searching YouTube for
            <b>${escapeHTML(query)}</b>...
        </div>
    `;


    try{

        /*
         * GitHub Pages / browser request
         *
         * SerpApi YouTube engine:
         * engine=youtube
         * search_query=query
         */

        const params =
            new URLSearchParams();

        params.set(
            "engine",
            "youtube"
        );

        params.set(
            "search_query",
            query
        );

        params.set(
            "api_key",
            SERPAPI_KEY
        );

        params.set(
            "hl",
            "en"
        );

        params.set(
            "gl",
            "us"
        );


        const url =
            "https://serpapi.com/search.json?" +
            params.toString();


        const response =
            await fetch(url, {
                method:"GET"
            });


        let data;


        try{

            data =
                await response.json();

        }catch(e){

            throw new Error(
                "Invalid response from SerpApi."
            );

        }


        if(!response.ok){

            throw new Error(
                data.error ||
                "SerpApi HTTP error: " +
                response.status
            );

        }


        if(data.error){

            throw new Error(
                data.error
            );

        }


        /*
         * IMPORTANT:
         * YouTube results are in
         * data.video_results
         */

        const results =
            Array.isArray(
                data.video_results
            )
            ? data.video_results
            : [];


        const videos =
            results
                .map(function(video){

                    const videoID =
                        video.video_id ||
                        "";

                    return {

                        videoID:videoID,

                        title:
                            video.title ||
                            "Untitled Video",

                        channel:
                            getChannelName(
                                video
                            ),

                        thumbnail:
                            video.thumbnail ||
                            (
                                videoID
                                ?
                                "https://i.ytimg.com/vi/" +
                                videoID +
                                "/hqdefault.jpg"
                                :
                                ""
                            )

                    };

                })
                .filter(function(video){

                    return (
                        video.videoID &&
                        video.title
                    );

                });


        displayResults(videos);


    }catch(error){

        console.error(
            "SerpApi error:",
            error
        );


        container.innerHTML = `
            <div class="message error">

                ❌ Search failed

                <br><br>

                ${escapeHTML(
                    error.message
                )}

                <br><br>

                If the browser shows a
                <b>CORS</b> error, direct
                browser access to SerpApi is
                being blocked.

            </div>
        `;

    }finally{

        button.disabled = false;

        button.textContent =
            "🔍 Search";

    }

}


/* =====================================================
   CHANNEL NAME
   ===================================================== */

function getChannelName(video){

    if(
        video.channel &&
        typeof video.channel === "object"
    ){

        return (
            video.channel.name ||
            video.channel.title ||
            "Unknown Channel"
        );

    }


    if(
        typeof video.channel === "string"
    ){

        return video.channel;

    }


    return (
        video.author?.name ||
        video.author ||
        "Unknown Channel"
    );

}


/* =====================================================
   DISPLAY RESULTS
   ===================================================== */

function displayResults(videos){

    const container =
        document.getElementById(
            "resultsContainer"
        );


    container.innerHTML = "";


    if(!videos.length){

        container.innerHTML = `
            <div class="message">
                😕 No YouTube videos found.
            </div>
        `;

        return;

    }


    videos.forEach(function(video){

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "video-card";


        const img =
            document.createElement(
                "img"
            );

        img.className =
            "thumbnail";

        img.src =
            video.thumbnail;

        img.alt =
            video.title;

        img.loading =
            "lazy";


        img.onerror =
            function(){

                this.src =
                    "https://i.ytimg.com/vi/" +
                    video.videoID +
                    "/hqdefault.jpg";

            };


        const info =
            document.createElement(
                "div"
            );

        info.className =
            "video-info";


        const title =
            document.createElement(
                "div"
            );

        title.className =
            "video-title";

        title.textContent =
            video.title;


        const channel =
            document.createElement(
                "div"
            );

        channel.className =
            "channel";

        channel.textContent =
            "👤 " +
            video.channel;


        info.appendChild(title);

        info.appendChild(channel);


        card.appendChild(img);

        card.appendChild(info);


        /*
         * Click result:
         * Add to queue + play immediately
         */

        card.addEventListener(
            "click",
            function(){

                addToQueue(
                    video,
                    true
                );

            }
        );


        container.appendChild(card);

    });

}


/* =====================================================
   ADD TO QUEUE
   ===================================================== */

function addToQueue(
    video,
    playNow = false
){

    queue.push(video);

    renderQueue();


    if(playNow){

        playQueueVideo(
            queue.length - 1
        );

    }

}


/* =====================================================
   PLAY QUEUE VIDEO
   ===================================================== */

function playQueueVideo(index){

    if(
        index < 0 ||
        index >= queue.length
    ){

        return;

    }


    if(
        !player ||
        !playerReady
    ){

        alert(
            "YouTube player is not ready yet."
        );

        return;

    }


    currentVideoIndex =
        index;


    const video =
        queue[index];


    player.loadVideoById(
        video.videoID
    );


    updateNowPlaying();

    renderQueue();

}


/* =====================================================
   PLAY
   ===================================================== */

function playVideo(){

    if(
        player &&
        playerReady
    ){

        player.playVideo();

    }

}


/* =====================================================
   PAUSE
   ===================================================== */

function pauseVideo(){

    if(
        player &&
        playerReady
    ){

        player.pauseVideo();

    }

}


/* =====================================================
   PREVIOUS
   ===================================================== */

function previousVideo(){

    if(!queue.length){

        return;

    }


    if(currentVideoIndex <= 0){

        currentVideoIndex =
            queue.length - 1;

    }else{

        currentVideoIndex--;

    }


    playQueueVideo(
        currentVideoIndex
    );

}


/* =====================================================
   NEXT
   ===================================================== */

function nextVideo(){

    if(!queue.length){

        return;

    }


    if(currentVideoIndex < 0){

        currentVideoIndex = 0;

    }else if(
        currentVideoIndex >=
        queue.length - 1
    ){

        /*
         * Loop back to first video.
         */

        currentVideoIndex = 0;

    }else{

        currentVideoIndex++;

    }


    playQueueVideo(
        currentVideoIndex
    );

}


/* =====================================================
   BACK 10 SEC
   ===================================================== */

function seekBackward(){

    if(
        !player ||
        !playerReady
    ){

        return;

    }


    const current =
        player.getCurrentTime();


    player.seekTo(
        Math.max(
            0,
            current - 10
        ),
        true
    );

}


/* =====================================================
   FORWARD 10 SEC
   ===================================================== */

function seekForward(){

    if(
        !player ||
        !playerReady
    ){

        return;

    }


    const current =
        player.getCurrentTime();


    const duration =
        player.getDuration();


    player.seekTo(
        Math.min(
            duration,
            current + 10
        ),
        true
    );

}


/* =====================================================
   CANCEL
   ===================================================== */

function cancelVideo(){

    if(
        !player ||
        !playerReady
    ){

        return;

    }


    player.stopVideo();


    document.getElementById(
        "nowPlaying"
    ).textContent =
        "⏹ Playback cancelled";

}


/* =====================================================
   VOLUME
   ===================================================== */

document
    .getElementById(
        "volumeControl"
    )
    .addEventListener(
        "input",
        function(){

            changeVolume(
                this.value
            );

        }
    );


function changeVolume(value){

    if(
        player &&
        playerReady
    ){

        player.setVolume(
            Number(value)
        );

    }

}


/* =====================================================
   QUEUE RENDER
   ===================================================== */

function renderQueue(){

    const container =
        document.getElementById(
            "queueContainer"
        );


    container.innerHTML = "";


    if(!queue.length){

        container.innerHTML = `
            <div class="message">
                Queue is empty
            </div>
        `;

        return;

    }


    queue.forEach(
        function(video,index){

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "queue-item" +
                (
                    index ===
                    currentVideoIndex
                    ?
                    " active"
                    :
                    ""
                );


            const img =
                document.createElement(
                    "img"
                );


            img.src =
                video.thumbnail ||
                "https://i.ytimg.com/vi/" +
                video.videoID +
                "/hqdefault.jpg";


            img.alt =
                video.title;


            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "queue-info";


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "queue-title";


            title.textContent =
                video.title;


            const channel =
                document.createElement(
                    "div"
                );


            channel.className =
                "queue-channel";


            channel.textContent =
                video.channel;


            info.appendChild(title);

            info.appendChild(channel);


            const actions =
                document.createElement(
                    "div"
                );


            actions.className =
                "queue-actions";


            const playBtn =
                document.createElement(
                    "button"
                );


            playBtn.textContent =
                "▶";


            playBtn.title =
                "Play";


            playBtn.onclick =
                function(event){

                    event.stopPropagation();

                    playQueueVideo(
                        index
                    );

                };


            const removeBtn =
                document.createElement(
                    "button"
                );


            removeBtn.textContent =
                "✖";


            removeBtn.title =
                "Remove";


            removeBtn.onclick =
                function(event){

                    event.stopPropagation();

                    removeFromQueue(
                        index
                    );

                };


            actions.appendChild(
                playBtn
            );

            actions.appendChild(
                removeBtn
            );


            item.appendChild(img);

            item.appendChild(info);

            item.appendChild(actions);


            item.onclick =
                function(){

                    playQueueVideo(
                        index
                    );

                };


            container.appendChild(
                item
            );

        }
    );

}


/* =====================================================
   REMOVE QUEUE ITEM
   ===================================================== */

function removeFromQueue(index){

    if(
        index < 0 ||
        index >= queue.length
    ){

        return;

    }


    const removingCurrent =
        index === currentVideoIndex;


    queue.splice(
        index,
        1
    );


    if(!queue.length){

        currentVideoIndex = -1;

        if(player && playerReady){

            player.stopVideo();

        }

    }else if(index < currentVideoIndex){

        currentVideoIndex--;

    }else if(removingCurrent){

        /*
         * Continue with another queue item.
         */

        if(
            currentVideoIndex >=
            queue.length
        ){

            currentVideoIndex =
                queue.length - 1;

        }

        playQueueVideo(
            currentVideoIndex
        );

        return;

    }


    renderQueue();

    updateNowPlaying();

}


/* =====================================================
   NOW PLAYING
   ===================================================== */

function updateNowPlaying(){

    const element =
        document.getElementById(
            "nowPlaying"
        );


    if(
        currentVideoIndex >= 0 &&
        queue[currentVideoIndex]
    ){

        element.textContent =
            "▶ Now Playing: " +
            queue[currentVideoIndex].title;

    }else{

        element.textContent =
            "Nothing playing";

    }

}


/* =====================================================
   BUTTON EVENTS
   ===================================================== */

document
    .getElementById("playBtn")
    .onclick =
    playVideo;


document
    .getElementById("pauseBtn")
    .onclick =
    pauseVideo;


document
    .getElementById("nextBtn")
    .onclick =
    nextVideo;


document
    .getElementById("previousBtn")
    .onclick =
    previousVideo;


document
    .getElementById("backBtn")
    .onclick =
    seekBackward;


document
    .getElementById("forwardBtn")
    .onclick =
    seekForward;


document
    .getElementById("cancelBtn")
    .onclick =
    cancelVideo;


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>
</html>

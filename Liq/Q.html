<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YouTube Pro Search Player</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0f0f0f;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

header {
    background: #181818;
    padding: 15px;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid #303030;
}

.header-inner {
    max-width: 1200px;
    margin: auto;
    display: flex;
    gap: 10px;
    align-items: center;
}

.logo {
    color: #ff0000;
    font-size: 22px;
    font-weight: bold;
    white-space: nowrap;
}

.search-box {
    flex: 1;
    display: flex;
}

.search-box input {
    width: 100%;
    background: #121212;
    border: 1px solid #303030;
    color: white;
    padding: 12px 15px;
    font-size: 16px;
    outline: none;
    border-radius: 4px 0 0 4px;
}

.search-box button {
    background: #303030;
    color: white;
    border: none;
    padding: 0 20px;
    cursor: pointer;
    font-size: 16px;
    border-radius: 0 4px 4px 0;
}

.search-box button:hover {
    background: #444;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 20px;
}

.player-section {
    background: #181818;
    border-radius: 10px;
    padding: 15px;
    margin-bottom: 20px;
}

.player-wrapper {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 8px;
    overflow: hidden;
}

#player {
    width: 100%;
    height: 100%;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 15px;
}

.controls button {
    background: #303030;
    color: white;
    border: none;
    padding: 10px 14px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
}

.controls button:hover {
    background: #505050;
}

.controls button:active {
    transform: scale(.97);
}

.volume-box {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-left: auto;
}

.volume-box input {
    width: 100px;
}

.now-playing {
    margin-top: 12px;
    color: #aaa;
    font-size: 14px;
}

.section-title {
    font-size: 20px;
    font-weight: bold;
    margin: 20px 0 12px;
}

.results {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 15px;
}

.video-card {
    background: #181818;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    transition: .2s;
    border: 1px solid transparent;
}

.video-card:hover {
    transform: translateY(-2px);
    border-color: #444;
    background: #202020;
}

.thumbnail {
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    display: block;
    background: #222;
}

.video-info {
    padding: 12px;
}

.video-title {
    font-size: 15px;
    font-weight: bold;
    line-height: 1.4;
    margin-bottom: 8px;

    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.channel {
    color: #aaa;
    font-size: 13px;
}

.queue-section {
    margin-top: 25px;
}

.queue {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.queue-item {
    background: #181818;
    border-radius: 7px;
    padding: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.queue-item img {
    width: 100px;
    height: 56px;
    object-fit: cover;
    border-radius: 5px;
}

.queue-info {
    flex: 1;
    min-width: 0;
}

.queue-title {
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.queue-channel {
    color: #aaa;
    font-size: 12px;
    margin-top: 4px;
}

.queue-actions {
    display: flex;
    gap: 5px;
}

.queue-actions button {
    background: #303030;
    border: none;
    color: white;
    padding: 7px 9px;
    border-radius: 4px;
    cursor: pointer;
}

.queue-actions button:hover {
    background: #555;
}

.message {
    background: #181818;
    border-radius: 8px;
    padding: 30px;
    text-align: center;
    color: #aaa;
    grid-column: 1 / -1;
}

.status {
    margin-top: 10px;
    font-size: 13px;
    color: #888;
}

.error {
    color: #ff6666;
}

.success {
    color: #5ee17a;
}

@media (max-width: 700px) {
    .header-inner {
        flex-direction: column;
        align-items: stretch;
    }

    .logo {
        text-align: center;
    }

    .controls {
        justify-content: center;
    }

    .volume-box {
        margin-left: 0;
        width: 100%;
        justify-content: center;
    }

    .results {
        grid-template-columns: 1fr;
    }

    .container {
        padding: 10px;
    }

    .queue-item img {
        width: 80px;
        height: 45px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">

        <div class="logo">
            ▶ YouTube Pro
        </div>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Search YouTube..."
                autocomplete="off"
            >

            <button id="searchButton">
                🔍 Search
            </button>
        </div>

    </div>
</header>


<div class="container">

    <!-- PLAYER -->
    <section class="player-section">

        <div class="player-wrapper">
            <div id="player"></div>
        </div>

        <div class="controls">

            <button onclick="previousVideo()">
                ⏮ Previous
            </button>

            <button onclick="playVideo()">
                ▶ Play
            </button>

            <button onclick="pauseVideo()">
                ⏸ Pause
            </button>

            <button onclick="nextVideo()">
                ⏭ Next
            </button>

            <button onclick="seekBackward()">
                ⏪ -10s
            </button>

            <button onclick="seekForward()">
                +10s ⏩
            </button>

            <button onclick="cancelVideo()">
                ✖ Cancel
            </button>

            <div class="volume-box">
                🔊
                <input
                    type="range"
                    id="volumeControl"
                    min="0"
                    max="100"
                    value="100"
                    oninput="changeVolume(this.value)"
                >
            </div>

        </div>

        <div class="now-playing" id="nowPlaying">
            Nothing playing
        </div>

    </section>


    <!-- SEARCH RESULTS -->
    <div class="section-title">
        Search Results
    </div>

    <div id="resultsContainer" class="results">
        <div class="message">
            Search for a YouTube video
        </div>
    </div>


    <!-- QUEUE -->
    <section class="queue-section">

        <div class="section-title">
            🎵 Queue
        </div>

        <div id="queueContainer" class="queue">
            <div class="message">
                Queue is empty
            </div>
        </div>

    </section>

</div>


<!-- YOUTUBE IFRAME API -->
<script src="https://www.youtube.com/iframe_api"></script>


<script>

/*
=========================================================
 SERPAPI KEY
=========================================================

PASTE YOUR SERPAPI KEY HERE.

Example:

const SERPAPI_KEY = "9fc5b64dea0e6400318994c473d314e0e5ada40ea7804b0aa6b015165ca7bb80";

IMPORTANT:
Because this is a single HTML file, the key will be
visible in the browser.

Use this setup for personal/testing use.
For production, use a backend proxy.
=========================================================
*/

const SERPAPI_KEY = "9fc5b64dea0e6400318994c473d314e0e5ada40ea7804b0aa6b015165ca7bb80";


/*
=========================================================
 GLOBAL VARIABLES
=========================================================
*/

let player = null;

let currentVideoIndex = -1;

let queue = [];

let searchResults = [];

let isPlayerReady = false;


/*
=========================================================
 YOUTUBE PLAYER
=========================================================
*/

function onYouTubeIframeAPIReady() {

    player = new YT.Player("player", {

        width: "100%",
        height: "100%",

        videoId: "",

        playerVars: {
            autoplay: 0,
            controls: 1,
            rel: 0,
            modestbranding: 1,
            playsinline: 1
        },

        events: {

            onReady: function(event) {

                isPlayerReady = true;

                event.target.setVolume(100);

                updateNowPlaying();

            },

            onStateChange: function(event) {

                /*
                When video ends automatically
                play next video from queue.
                */

                if (event.data === YT.PlayerState.ENDED) {
                    nextVideo();
                }

            },

            onError: function(event) {

                console.log("YouTube Player Error:", event.data);

            }

        }

    });

}


/*
=========================================================
 SEARCH BUTTON
=========================================================
*/

document
    .getElementById("searchButton")
    .addEventListener("click", searchVideos);


/*
=========================================================
 ENTER KEY SEARCH
=========================================================
*/

document
    .getElementById("searchInput")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            searchVideos();
        }

    });


/*
=========================================================
 SERPAPI YOUTUBE SEARCH
=========================================================
*/

async function searchVideos() {

    const input =
        document.getElementById("searchInput");

    const query = input.value.trim();

    const container =
        document.getElementById("resultsContainer");

    const button =
        document.getElementById("searchButton");


    if (!query) {

        alert("Please enter something to search.");

        return;
    }


    if (
        !SERPAPI_KEY ||
        SERPAPI_KEY === "YOUR_SERPAPI_KEY_HERE"
    ) {

        container.innerHTML = `
            <div class="message error">
                ❌ SerpApi key is missing.<br><br>
                Open this HTML file and replace
                <b>YOUR_SERPAPI_KEY_HERE</b>
                with your real SerpApi key.
            </div>
        `;

        return;
    }


    button.disabled = true;

    button.textContent = "🔎 Searching...";


    container.innerHTML = `
        <div class="message">
            🔎 Searching YouTube for
            <b>${escapeHTML(query)}</b>...
        </div>
    `;


    try {

        /*
        SerpApi YouTube Search endpoint
        */

        const url =
            "https://serpapi.com/search.json?" +
            new URLSearchParams({

                engine: "youtube",

                search_query: query,

                api_key: SERPAPI_KEY,

                hl: "en",

                gl: "us"

            });


        const response =
            await fetch(url);


        const data =
            await response.json();


        /*
        Check HTTP error
        */

        if (!response.ok) {

            throw new Error(
                data.error ||
                `HTTP Error ${response.status}`
            );

        }


        /*
        Check SerpApi error
        */

        if (data.error) {

            throw new Error(data.error);

        }


        /*
        Get YouTube video results
        */

        const videos =
            (data.video_results || [])

                .map(function(video) {

                    return {

                        videoID:
                            video.video_id,

                        title:
                            video.title ||
                            "Untitled Video",

                        channel:
                            video.channel?.name ||
                            video.channel ||
                            "Unknown Channel",

                        thumbnail:
                            video.thumbnail ||
                            (
                                video.video_id
                                    ? `https://i.ytimg.com/vi/${video.video_id}/hqdefault.jpg`
                                    : ""
                            )

                    };

                })

                .filter(function(video) {

                    return video.videoID;

                });


        searchResults = videos;


        displayResults(videos);


    } catch (error) {

        console.error(error);


        container.innerHTML = `
            <div class="message error">

                ❌ Search failed

                <br><br>

                ${escapeHTML(error.message)}

                <br><br>

                Check:
                <br>
                • SerpApi key
                <br>
                • Internet connection
                <br>
                • SerpApi account
                <br>
                • Browser CORS restriction

            </div>
        `;

    } finally {

        button.disabled = false;

        button.textContent = "🔍 Search";

    }

}


/*
=========================================================
 DISPLAY SEARCH RESULTS
=========================================================
*/

function displayResults(videos) {

    const container =
        document.getElementById("resultsContainer");


    container.innerHTML = "";


    if (!videos.length) {

        container.innerHTML = `
            <div class="message">
                😕 No YouTube videos found.
            </div>
        `;

        return;
    }


    videos.forEach(function(video) {

        const card =
            document.createElement("div");

        card.className = "video-card";


        const img =
            document.createElement("img");

        img.className = "thumbnail";

        img.src = video.thumbnail;

        img.alt = video.title;

        img.loading = "lazy";


        /*
        If thumbnail fails,
        use YouTube fallback.
        */

        img.onerror = function() {

            this.src =
                `https://i.ytimg.com/vi/${video.videoID}/hqdefault.jpg`;

        };


        const info =
            document.createElement("div");

        info.className = "video-info";


        const title =
            document.createElement("div");

        title.className = "video-title";

        title.textContent = video.title;


        const channel =
            document.createElement("div");

        channel.className = "channel";

        channel.textContent =
            video.channel;


        info.appendChild(title);

        info.appendChild(channel);


        card.appendChild(img);

        card.appendChild(info);


        /*
        Click result:
        Add to queue and play.
        */

        card.addEventListener("click", function() {

            addToQueue(video, true);

        });


        container.appendChild(card);

    });

}


/*
=========================================================
 ADD VIDEO TO QUEUE
=========================================================
*/

function addToQueue(video, playNow = false) {

    queue.push(video);

    renderQueue();


    if (playNow) {

        const index =
            queue.length - 1;

        playQueueVideo(index);

    }

}


/*
=========================================================
 RENDER QUEUE
=========================================================
*/

function renderQueue() {

    const container =
        document.getElementById("queueContainer");


    container.innerHTML = "";


    if (!queue.length) {

        container.innerHTML = `
            <div class="message">
                Queue is empty
            </div>
        `;

        return;
    }


    queue.forEach(function(video, index) {

        const item =
            document.createElement("div");

        item.className = "queue-item";


        const img =
            document.createElement("img");

        img.src =
            video.thumbnail ||
            `https://i.ytimg.com/vi/${video.videoID}/hqdefault.jpg`;

        img.alt =
            video.title;


        const info =
            document.createElement("div");

        info.className = "queue-info";


        const title =
            document.createElement("div");

        title.className = "queue-title";

        title.textContent =
            video.title;


        const channel =
            document.createElement("div");

        channel.className = "queue-channel";

        channel.textContent =
            video.channel;


        info.appendChild(title);

        info.appendChild(channel);


        const actions =
            document.createElement("div");

        actions.className = "queue-actions";


        const playButton =
            document.createElement("button");

        playButton.textContent = "▶";


        playButton.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                playQueueVideo(index);

            }
        );


        const removeButton =
            document.createElement("button");

        removeButton.textContent = "✖";


        removeButton.addEventListener(
            "click",
            function(event) {

                event.stopPropagation();

                removeFromQueue(index);

            }
        );


        actions.appendChild(playButton);

        actions.appendChild(removeButton);


        item.appendChild(img);

        item.appendChild(info);

        item.appendChild(actions);


        item.addEventListener(
            "dblclick",
            function() {

                playQueueVideo(index);

            }
        );


        container.appendChild(item);

    });

}


/*
=========================================================
 PLAY QUEUE VIDEO
=========================================================
*/

function playQueueVideo(index) {

    if (!queue[index]) {
        return;
    }


    if (!player || !isPlayerReady) {

        alert("YouTube player is not ready yet.");

        return;

    }


    currentVideoIndex = index;


    const video =
        queue[index];


    player.loadVideoById(
        video.videoID
    );


    updateNowPlaying();

}


/*
=========================================================
 PLAY
=========================================================
*/

function playVideo() {

    if (!player || !isPlayerReady) {
        return;
    }

    player.playVideo();

}


/*
=========================================================
 PAUSE
=========================================================
*/

function pauseVideo() {

    if (!player || !isPlayerReady) {
        return;
    }

    player.pauseVideo();

}


/*
=========================================================
 PREVIOUS
=========================================================
*/

function previousVideo() {

    if (!queue.length) {
        return;
    }


    if (currentVideoIndex <= 0) {

        currentVideoIndex =
            queue.length - 1;

    } else {

        currentVideoIndex--;

    }


    playQueueVideo(currentVideoIndex);

}


/*
=========================================================
 NEXT
=========================================================
*/

function nextVideo() {

    if (!queue.length) {
        return;
    }


    if (currentVideoIndex < 0) {

        currentVideoIndex = 0;

    } else if (
        currentVideoIndex >= queue.length - 1
    ) {

        /*
        If current video is last,
        start from first video.
        */

        currentVideoIndex = 0;

    } else {

        currentVideoIndex++;

    }


    playQueueVideo(currentVideoIndex);

}


/*
=========================================================
 SEEK BACKWARD 10 SECONDS
=========================================================
*/

function seekBackward() {

    if (!player || !isPlayerReady) {
        return;
    }


    const current =
        player.getCurrentTime();


    player.seekTo(
        Math.max(0, current - 10),
        true
    );

}


/*
=========================================================
 SEEK FORWARD 10 SECONDS
=========================================================
*/

function seekForward() {

    if (!player || !isPlayerReady) {
        return;
    }


    const current =
        player.getCurrentTime();


    const duration =
        player.getDuration();


    player.seekTo(
        Math.min(duration, current + 10),
        true
    );

}


/*
=========================================================
 CANCEL / STOP VIDEO
=========================================================
*/

function cancelVideo() {

    if (!player || !isPlayerReady) {
        return;
    }


    player.stopVideo();


    document.getElementById(
        "nowPlaying"
    ).textContent =
        "⏹ Playback cancelled";

}


/*
=========================================================
 VOLUME
=========================================================
*/

function changeVolume(value) {

    if (!player || !isPlayerReady) {
        return;
    }


    player.setVolume(
        Number(value)
    );

}


/*
=========================================================
 REMOVE QUEUE ITEM
=========================================================
*/

function removeFromQueue(index) {

    if (
        index < 0 ||
        index >= queue.length
    ) {
        return;
    }


    const wasCurrent =
        index === currentVideoIndex;


    queue.splice(index, 1);


    if (!queue.length) {

        currentVideoIndex = -1;

    } else if (index < currentVideoIndex) {

        currentVideoIndex--;

    } else if (
        wasCurrent &&
        currentVideoIndex >= queue.length
    ) {

        currentVideoIndex =
            queue.length - 1;

    }


    renderQueue();

}


/*
=========================================================
 UPDATE NOW PLAYING
=========================================================
*/

function updateNowPlaying() {

    const element =
        document.getElementById(
            "nowPlaying"
        );


    if (
        currentVideoIndex >= 0 &&
        queue[currentVideoIndex]
    ) {

        const video =
            queue[currentVideoIndex];


        element.textContent =
            "▶ Now Playing: " +
            video.title;

    } else {

        element.textContent =
            "Nothing playing";

    }

}


/*
=========================================================
 HTML ESCAPE
=========================================================
*/

function escapeHTML(value) {

    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}

</script>

</body>
</html>

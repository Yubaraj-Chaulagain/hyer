<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zip-Stroge</title><style>body{font-family:Arial;margin:0;background:#f3f6fa;color:#17202a}header{background:#111827;color:#fff;text-align:center;padding:25px}main{max-width:720px;margin:auto;padding:16px}.card{background:#fff;padding:18px;margin:14px 0;border-radius:16px;box-shadow:0 3px 12px #0001}input{width:100%;padding:13px;box-sizing:border-box;border:1px solid #ccd3dc;border-radius:10px}button,a{border:0;border-radius:10px;padding:12px 15px;margin:7px 5px 0 0;font-weight:bold;text-decoration:none;display:inline-block;cursor:pointer}.g{background:#16a34a;color:#fff}.b{background:#2563eb;color:#fff}.r{background:#dc2626;color:#fff}.s{background:#eef2ff;padding:12px;border-radius:10px;margin-top:12px;white-space:pre-wrap}.item{background:#fff;border:1px solid #ddd;border-radius:12px;padding:13px;margin-top:10px}.meta{font-size:13px;color:#64748b;margin-top:6px}</style></head><body><header><h1>📦 GitHub ZIP Storage</h1>Upload · Update · Delete · Download</header><main><div class="card"><b>Repository:</b> Yubaraj-Chaulagain/Zip-Stroge<br><small>Token code भित्रै राख्नुहोस्; हरेक पटक token हाल्नु पर्दैन।</small></div><div class="card"><h2>➕ Add ZIP</h2><input id="f" type="file" accept=".zip"><button class="g" onclick="upload()">⬆️ Upload ZIP</button><button onclick="load()">🔄 Refresh</button><div id="st" class="s">Ready.</div></div><div class="card"><h2>📁 Stored ZIP files</h2><input id="q" placeholder="Search ZIP..." oninput="render()"><div id="list">Loading...</div></div></main><script>
// PASTE YOUR NEW TOKEN ONCE BELOW. DO NOT SEND IT TO CHATGPT.
const GITHUB_TOKEN="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";
const OWNER="Yubaraj-Chaulagain",REPO="Zip-Stroge",FOLDER="files/";let files=[];
const $=x=>document.getElementById(x),api=p=>`https://api.github.com/repos/${OWNER}/${REPO}${p}`;
function h(){if(!GITHUB_TOKEN||GITHUB_TOKEN.includes("PASTE_YOUR"))throw Error("GITHUB_TOKEN code भित्र राख्नुहोस्।");return {Accept:"application/vnd.github+json",Authorization:"Bearer "+GITHUB_TOKEN,"X-GitHub-Api-Version":"2022-11-28"}}
async function req(p,o={}){let r=await fetch(api(p),{...o,headers:{...h(),...(o.headers||{})}});if(!r.ok)throw Error("GitHub "+r.status+": "+await r.text());return r.json()}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sz(n){if(!n)return'0 B';let u=['B','KB','MB','GB'],i=Math.floor(Math.log(n)/Math.log(1024));return(n/1024**i).toFixed(i?2:0)+' '+u[i]}
function b64(b){let s='',a=new Uint8Array(b);for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(s)}
async function get(p){try{return await req('/contents/'+encodeURIComponent(p))}catch(e){if(String(e).includes('GitHub 404'))return null;throw e}}
async function load(){try{$('list').textContent='⏳ Loading...';let d=await req('/contents/'+encodeURIComponent(FOLDER));files=(Array.isArray(d)?d:[]).filter(x=>x.type==='file'&&x.name.toLowerCase().endsWith('.zip'));render();$('st').textContent='✅ Connected. ZIP files: '+files.length}catch(e){if(String(e).includes('GitHub 404')){files=[];render();$('st').textContent='✅ Connected. files/ folder छैन; पहिलो upload गर्दा बन्छ।'}else{$('list').textContent=e.message;$('st').textContent='❌ '+e.message}}}
function render(){let q=$('q').value.toLowerCase(),a=files.filter(x=>x.name.toLowerCase().includes(q));$('list').innerHTML=a.length?a.map(x=>{let i=files.findIndex(y=>y.path===x.path);return `<div class=item><b>📦 ${esc(x.name)}</b><div class=meta>${sz(x.size)} · SHA ${esc(x.sha.slice(0,10))}...</div><a class="g" href="${esc(x.download_url)}" target="_blank">📥 Download</a><button class="b" onclick="update(${i})">🔄 Update</button><button class="r" onclick="del(${i})">🗑️ Delete</button></div>`}).join(''):'<p>No ZIP files found.</p>'}
async function put(path,file,sha){let body={message:(sha?'Update ':'Add ')+file.name,content:b64(await file.arrayBuffer())};if(sha)body.sha=sha;return req('/contents/'+encodeURIComponent(path),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}
async function upload(){let f=$('f').files[0];if(!f)return $('st').textContent='पहिले ZIP छान्नुहोस्।';try{$('st').textContent='⏳ Uploading...';let p=FOLDER+f.name;if(await get(p))return $('st').textContent='⚠️ यही नामको ZIP छ; Update प्रयोग गर्नुहोस्।';await put(p,f);$('f').value='';$('st').textContent='✅ Upload सफल';load()}catch(e){$('st').textContent='❌ '+e.message}}
async function update(i){let old=files[i],p=document.createElement('input');p.type='file';p.accept='.zip';p.onchange=async()=>{let f=p.files[0];if(!f)return;try{$('st').textContent='⏳ Updating...';let np=FOLDER+f.name,ex=await get(np);if(np===old.path)await put(np,f,old.sha);else{await put(np,f,ex?.sha);await delPath(old.path,old.sha,'Delete old ZIP '+old.name)}$('st').textContent='✅ Update सफल';load()}catch(e){$('st').textContent='❌ '+e.message}};p.click()}
async function delPath(path,sha,message){return req('/contents/'+encodeURIComponent(path),{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,sha})})}
async function del(i){let f=files[i];if(!confirm('Delete '+f.name+' ?'))return;try{$('st').textContent='⏳ Deleting...';await delPath(f.path,f.sha,'Delete ZIP '+f.name);$('st').textContent='✅ Deleted';load()}catch(e){$('st').textContent='❌ '+e.message}}
load();</script></body></html>

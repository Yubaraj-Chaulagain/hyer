<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YouTube + TikTok + Mobile Video Player</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0b0b0b;
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:12px;
}

h2{
    text-align:center;
    margin:8px 0 14px;
}

.input-row{
    display:flex;
    gap:8px;
    margin-bottom:8px;
}

input[type="text"]{
    flex:1;
    min-width:0;
    padding:12px;
    border-radius:8px;
    border:1px solid #444;
    background:#181818;
    color:#fff;
}

button,
.local-btn{
    border:0;
    border-radius:8px;
    padding:11px 14px;
    background:#222;
    color:#fff;
    cursor:pointer;
    font-size:14px;
}

button:hover,
.local-btn:hover{
    background:#333;
}

.load-btn{
    background:#e50914;
}

.load-btn:hover{
    background:#ff1a25;
}

.local-btn{
    display:inline-block;
    background:#075e54;
}

.local-btn input{
    display:none;
}

.clear-btn{
    background:#642020;
}

.status{
    padding:8px 10px;
    background:#151515;
    border-radius:7px;
    margin:8px 0;
    font-size:13px;
    color:#bbb;
    word-break:break-word;
}

.player-box{
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border-radius:10px;
    overflow:hidden;
    margin:10px 0;
    position:relative;
}

#youtubePlayer,
#tiktokPlayer,
#localPlayer{
    width:100%;
    height:100%;
}

#youtubePlayer{
    display:block;
}

#tiktokPlayer{
    display:none;
    border:0;
    background:#000;
}

#localPlayer{
    display:none;
    object-fit:contain;
    background:#000;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:center;
    margin:8px 0;
}

.controls button{
    min-width:70px;
}

.volume-box{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin:8px 0 14px;
}

#volume{
    width:180px;
}

.section{
    background:#121212;
    border-radius:10px;
    padding:10px;
    margin-top:12px;
}

.section h3{
    margin:4px 0 10px;
    font-size:17px;
}

.search{
    width:100%;
    padding:11px;
    border-radius:8px;
    border:1px solid #444;
    background:#181818;
    color:#fff;
    margin-bottom:8px;
}

.video-list{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.video-item{
    display:flex;
    gap:10px;
    align-items:center;
    padding:7px;
    background:#1b1b1b;
    border-radius:8px;
    cursor:pointer;
    transition:.15s;
}

.video-item:hover{
    background:#282828;
}

.video-item.active{
    background:#333;
    outline:1px solid #555;
}

.thumb{
    width:110px;
    height:62px;
    object-fit:cover;
    border-radius:6px;
    background:#000;
    flex-shrink:0;
}

.tiktok-thumb{
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
}

.video-info{
    min-width:0;
}

.video-title{
    font-size:14px;
    font-weight:bold;
    line-height:1.3;
    overflow:hidden;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
}

.video-type{
    font-size:11px;
    color:#999;
    margin-top:4px;
}

.local-tools{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.empty{
    text-align:center;
    color:#777;
    padding:15px;
    font-size:13px;
}

.sheet-info{
    color:#888;
    font-size:11px;
    margin-top:4px;
    word-break:break-all;
}

@media(max-width:600px){

    .input-row{
        flex-direction:column;
    }

    .input-row button{
        width:100%;
    }

    .controls button{
        min-width:62px;
        padding:10px 8px;
        font-size:13px;
    }

    .thumb{
        width:90px;
        height:51px;
    }

    .video-title{
        font-size:13px;
    }
}
</style>
</head>

<body>

<div class="container">

<h2>▶ YouTube + TikTok + Mobile Player</h2>

<div class="input-row">

    <input
        type="text"
        id="videoUrl"
        placeholder="Paste YouTube URL, TikTok URL or TikTok ID..."
        autocomplete="off"
    >

    <button class="load-btn" onclick="loadVideoURL()">
        Load Video
    </button>

</div>

<div class="local-tools">

    <label class="local-btn">
        📱 Select Mobile Videos

        <input
            type="file"
            id="localVideos"
            accept="video/*"
            multiple
        >
    </label>

    <button
        class="clear-btn"
        onclick="clearLocalVideos()"
    >
        🗑 Clear Mobile Videos
    </button>

</div>

<div class="status" id="status">
    Ready
</div>


<!-- PLAYER -->

<div class="player-box">

    <div id="youtubePlayer"></div>

    <iframe
        id="tiktokPlayer"
        allow="fullscreen; autoplay"
        referrerpolicy="strict-origin-when-cross-origin"
        title="TikTok Player"
    ></iframe>

    <video
        id="localPlayer"
        playsinline
        preload="metadata"
    ></video>

</div>


<!-- CONTROLS -->

<div class="controls">

    <button onclick="previousVideo()">
        ⏮ Previous
    </button>

    <button onclick="seekVideo(-10)">
        ↶ -10
    </button>

    <button onclick="playVideo()">
        ▶ Play
    </button>

    <button onclick="pauseVideo()">
        ⏸ Pause
    </button>

    <button onclick="seekVideo(10)">
        +10 ↷
    </button>

    <button onclick="nextVideo()">
        Next ⏭
    </button>

    <button onclick="stopVideo()">
        ⏹ Stop
    </button>

</div>


<div class="volume-box">

    🔊

    <input
        type="range"
        id="volume"
        min="0"
        max="100"
        value="100"
        oninput="changeVolume(this.value)"
    >

    <span id="volumeText">
        100%
    </span>

</div>


<!-- GOOGLE SHEET -->

<div class="section">

    <h3>📊 Google Sheet Videos</h3>

    <input
        class="search"
        id="search"
        type="text"
        placeholder="Search videos..."
        oninput="searchVideos()"
    >

    <div
        id="sheetList"
        class="video-list"
    >
        <div class="empty">
            Loading Google Sheet...
        </div>
    </div>

</div>


<!-- LOCAL -->

<div class="section">

    <h3>📱 Mobile Videos</h3>

    <div
        id="localList"
        class="video-list"
    >

        <div class="empty">
            No mobile videos selected.
        </div>

    </div>

</div>


<!-- HISTORY -->

<div class="section">

    <h3>🕘 History</h3>

    <div
        id="historyList"
        class="video-list"
    >

        <div class="empty">
            No history yet.
        </div>

    </div>

</div>

</div>


<!-- YOUTUBE API -->

<script src="https://www.youtube.com/iframe_api"></script>


<script>

/* =====================================================
   GOOGLE SHEET CSV
===================================================== */

const SHEET_CSV =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQfLCxJaz-eDFB7SGeROjZDepLOHg1ZggZhYf5kfWJc8S-l1H9frmOshuakfD7_4ocFZd2tvRvEaLN9/pub?gid=281133690&single=true&output=csv";


/* =====================================================
   VARIABLES
===================================================== */

let player = null;

let playerReady = false;

let sheetVideos = [];

let currentIndex = -1;

let localVideos = [];

let localIndex = -1;

let mode = "youtube";

let historyVideos = [];

let tiktokCurrentTime = 0;

let tiktokCommandTimer = null;


/* =====================================================
   YOUTUBE READY
===================================================== */

function onYouTubeIframeAPIReady(){

    player = new YT.Player(
        "youtubePlayer",
        {

            height:"100%",
            width:"100%",

            videoId:"",

            playerVars:{
                autoplay:0,
                controls:1,
                rel:0,
                playsinline:1,
                modestbranding:1
            },

            events:{

                onReady:function(){

                    playerReady = true;

                    setStatus(
                        "YouTube player ready"
                    );

                },

                onStateChange:onPlayerStateChange,

                onError:function(event){

                    setStatus(
                        "YouTube error: " +
                        event.data
                    );

                }

            }

        }
    );

}


/* =====================================================
   YOUTUBE STATE
===================================================== */

function onPlayerStateChange(event){

    if(
        player &&
        event.data ===
        YT.PlayerState.ENDED
    ){

        setTimeout(
            function(){

                if(mode === "youtube"){
                    nextVideo();
                }

            },
            300
        );

    }

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(text){

    document
        .getElementById("status")
        .textContent = text;

}


/* =====================================================
   YOUTUBE ID
===================================================== */

function extractVideoID(input){

    if(!input){
        return null;
    }

    input = String(input).trim();

    /*
       Direct YouTube ID
    */

    if(
        /^[a-zA-Z0-9_-]{11}$/.test(input)
    ){
        return input;
    }

    try{

        const url = new URL(
            input
        );

        const host =
            url.hostname
            .toLowerCase()
            .replace(/^www\./,"");

        /*
           youtube.com/watch?v=
        */

        if(
            (
                host === "youtube.com" ||
                host === "m.youtube.com"
            ) &&
            url.searchParams.get("v")
        ){

            return url.searchParams
                .get("v")
                .substring(0,11);

        }

        /*
           youtu.be/VIDEO_ID
        */

        if(
            host === "youtu.be"
        ){

            return url.pathname
                .split("/")
                .filter(Boolean)[0] || null;

        }

        /*
           youtube.com/embed/VIDEO_ID
        */

        const embedMatch =
            url.pathname.match(
                /\/embed\/([a-zA-Z0-9_-]{11})/i
            );

        if(embedMatch){
            return embedMatch[1];
        }

        /*
           youtube.com/shorts/VIDEO_ID
        */

        const shortsMatch =
            url.pathname.match(
                /\/shorts\/([a-zA-Z0-9_-]{11})/i
            );

        if(shortsMatch){
            return shortsMatch[1];
        }

    }
    catch(e){
        return null;
    }

    return null;
}


/* =====================================================
   TIKTOK URL CHECK
===================================================== */

function isTikTokURL(value){

    if(!value){
        return false;
    }

    const text =
        String(value)
        .trim()
        .toLowerCase();

    return (
        text.includes("tiktok.com") ||
        text.includes("vm.tiktok.com") ||
        text.includes("vt.tiktok.com")
    );

}


/* =====================================================
   TIKTOK SHORT URL CHECK
===================================================== */

function isTikTokShortURL(value){

    if(!value){
        return false;
    }

    try{

        const url =
            new URL(value);

        const host =
            url.hostname
            .toLowerCase()
            .replace(/^www\./,"");

        return (
            host === "vm.tiktok.com" ||
            host === "vt.tiktok.com"
        );

    }
    catch(e){

        return false;

    }

}


/* =====================================================
   TIKTOK ID
===================================================== */

function extractTikTokID(input){

    if(!input){
        return null;
    }

    input =
        String(input)
        .trim();

    /*
       Direct numeric TikTok ID

       Example:
       7512345678901234567
    */

    if(
        /^\d{15,25}$/.test(input)
    ){

        return input;

    }

    try{

        const url =
            new URL(input);

        /*
           Official TikTok Player

           /player/v1/123456
        */

        const playerMatch =
            url.pathname.match(
                /\/player\/v1\/(\d+)/i
            );

        if(playerMatch){

            return playerMatch[1];

        }

        /*
           Normal TikTok video

           /@username/video/123456
        */

        const videoMatch =
            url.pathname.match(
                /\/video\/(\d+)/i
            );

        if(videoMatch){

            return videoMatch[1];

        }

    }
    catch(e){

        return null;

    }

    return null;
}


/* =====================================================
   IMAGE URL
===================================================== */

function extractImageURL(value){

    if(!value){
        return "";
    }

    const text =
        String(value)
        .trim();

    /*
       Handles:
       https://...
       IMAGE("https://...")
       IMAGE('https://...')
    */

    const match =
        text.match(
            /https?:\/\/[^"')\s]+/i
        );

    if(match){

        return match[0]
            .replace(/&amp;/g,"&");

    }

    return "";
}


/* =====================================================
   LOAD MANUAL URL / ID
===================================================== */

function loadVideoURL(){

    const input =
        document
        .getElementById("videoUrl")
        .value
        .trim();

    if(!input){

        alert(
            "YouTube URL, TikTok URL वा TikTok Video ID राख्नुहोस्।"
        );

        return;
    }


    /* =================================================
       TIKTOK
    ================================================= */

    if(
        isTikTokURL(input)
    ){

        let id =
            extractTikTokID(input);


        /*
           Full TikTok URL बाट ID भेटिएन भने
           Google Sheet मा त्यही URL खोज्ने
        */

        if(!id){

            const found =
                findTikTokByURL(input);

            if(found){

                id = found.id;

                const index =
                    sheetVideos.indexOf(
                        found
                    );

                loadTikTok(
                    id,
                    found.title,
                    found.url,
                    index
                );

                return;

            }

        }


        if(id){

            const index =
                sheetVideos.findIndex(
                    function(v){

                        return (
                            v.type === "tiktok" &&
                            v.id === id
                        );

                    }
                );

            loadTikTok(
                id,
                index !== -1
                    ? sheetVideos[index].title
                    : "Manual TikTok Video",
                input,
                index
            );

            return;

        }


        /*
           vm.tiktok.com को ID भेटिएन
        */

        if(
            isTikTokShortURL(input)
        ){

            alert(
                "यो vm.tiktok.com short URL हो।\n\n" +
                "Browser बाट यसको redirect सधैं resolve गर्न सकिँदैन।\n\n" +
                "Google Sheet को D column मा त्यस TikTok video को numeric Video ID राख्नुहोस्।"
            );

            return;

        }


        alert(
            "TikTok Video ID भेटिएन।"
        );

        return;

    }


    /* =================================================
       TIKTOK ID ONLY
    ================================================= */

    if(
        /^\d{15,25}$/.test(input)
    ){

        const index =
            sheetVideos.findIndex(
                function(v){

                    return (
                        v.type === "tiktok" &&
                        v.id === input
                    );

                }
            );

        loadTikTok(
            input,
            index !== -1
                ? sheetVideos[index].title
                : "Manual TikTok Video",
            index !== -1
                ? sheetVideos[index].url
                : "",
            index
        );

        return;

    }


    /* =================================================
       YOUTUBE
    ================================================= */

    const youtubeID =
        extractVideoID(input);

    if(!youtubeID){

        alert(
            "Valid YouTube वा TikTok URL/ID भेटिएन।"
        );

        return;

    }


    const foundIndex =
        sheetVideos.findIndex(
            function(v){

                return (
                    v.type === "youtube" &&
                    v.id === youtubeID
                );

            }
        );


    if(foundIndex !== -1){

        loadSheetVideo(
            foundIndex
        );

        return;

    }


    mode = "youtube";

    currentIndex = -1;

    showYouTubePlayer();


    if(!playerReady){

        setStatus(
            "YouTube player loading..."
        );

        return;

    }


    player.loadVideoById(
        youtubeID
    );


    addHistory({

        id:youtubeID,

        title:"Manual YouTube Video",

        type:"YouTube",

        url:input,

        thumbnail:
            "https://img.youtube.com/vi/" +
            youtubeID +
            "/hqdefault.jpg"

    });


    setStatus(
        "Playing manual YouTube video"
    );

}


/* =====================================================
   FIND TIKTOK BY URL
===================================================== */

function findTikTokByURL(url){

    if(!url){
        return null;
    }

    const clean =
        normalizeURL(url);

    return (
        sheetVideos.find(
            function(v){

                return (
                    v.type === "tiktok" &&
                    normalizeURL(v.url) === clean &&
                    v.id
                );

            }
        ) || null
    );

}


/* =====================================================
   NORMALIZE URL
===================================================== */

function normalizeURL(url){

    if(!url){
        return "";
    }

    return String(url)
        .trim()
        .replace(/\/+$/,"")
        .toLowerCase();

}


/* =====================================================
   LOAD ANY SHEET VIDEO
===================================================== */

function loadSheetVideo(index){

    if(!sheetVideos.length){

        setStatus(
            "Google Sheet मा video छैन।"
        );

        return;

    }


    if(index < 0){

        index =
            sheetVideos.length - 1;

    }

    if(
        index >= sheetVideos.length
    ){

        index = 0;

    }


    const video =
        sheetVideos[index];


    if(
        video.type === "tiktok"
    ){

        loadTikTok(
            video.id,
            video.title,
            video.url,
            index
        );

        return;

    }


    loadYouTubeVideo(
        index
    );

}


/* =====================================================
   LOAD YOUTUBE SHEET VIDEO
===================================================== */

function loadYouTubeVideo(index){

    if(
        index < 0 ||
        index >= sheetVideos.length
    ){
        return;
    }


    const video =
        sheetVideos[index];


    if(
        video.type !== "youtube"
    ){

        loadSheetVideo(index);

        return;

    }


    currentIndex = index;

    mode = "youtube";

    showYouTubePlayer();


    if(!playerReady){

        setStatus(
            "YouTube player loading..."
        );

        return;

    }


    player.loadVideoById(
        video.id
    );


    addHistory({

        id:video.id,

        title:video.title,

        type:"Google Sheet YouTube",

        url:video.url,

        thumbnail:
            video.thumbnail ||
            "https://img.youtube.com/vi/" +
            video.id +
            "/hqdefault.jpg"

    });


    setStatus(
        "YouTube: " +
        video.title
    );


    renderSheetVideos();

}


/* =====================================================
   LOAD TIKTOK
===================================================== */

function loadTikTok(
    id,
    title,
    url,
    index
){

    if(!id){

        setStatus(
            "TikTok Video ID भेटिएन।"
        );

        return;

    }


    if(
        !/^\d{15,25}$/.test(
            String(id)
        )
    ){

        setStatus(
            "Invalid TikTok Video ID"
        );

        return;

    }


    mode = "tiktok";


    /*
       Keep exact Sheet position
    */

    if(
        typeof index === "number" &&
        index >= 0
    ){

        currentIndex = index;

    }
    else{

        currentIndex =
            sheetVideos.findIndex(
                function(v){

                    return (
                        v.type === "tiktok" &&
                        v.id === String(id)
                    );

                }
            );

    }


    tiktokCurrentTime = 0;


    showTikTokPlayer();


    const iframe =
        document.getElementById(
            "tiktokPlayer"
        );


    /*
       Clear old player first
       This helps TikTok reload correctly.
    */

    iframe.src = "about:blank";


    /*
       Small delay before loading new
       TikTok player.
    */

    clearTimeout(
        tiktokCommandTimer
    );


    tiktokCommandTimer =
        setTimeout(
            function(){

                const playerURL =
                    "https://www.tiktok.com/player/v1/" +
                    encodeURIComponent(id) +
                    "?controls=1" +
                    "&description=1" +
                    "&music_info=1" +
                    "&loop=0";

                iframe.src =
                    playerURL;

            },
            80
        );


    addHistory({

        id:String(id),

        title:
            title ||
            "TikTok Video",

        type:"TikTok",

        url:url || "",

        thumbnail:
            findThumbnail(
                String(id),
                "tiktok"
            )

    });


    setStatus(
        "TikTok: " +
        (
            title ||
            "Video"
        )
    );


    renderSheetVideos();

}


/* =====================================================
   FIND THUMBNAIL
===================================================== */

function findThumbnail(
    id,
    type
){

    const video =
        sheetVideos.find(
            function(v){

                return (
                    v.id === String(id) &&
                    v.type === type
                );

            }
        );


    if(video){

        return (
            video.thumbnail ||
            ""
        );

    }


    return "";

}


/* =====================================================
   NEXT VIDEO
===================================================== */

function nextVideo(){

    /*
       LOCAL VIDEOS
    */

    if(
        mode === "local"
    ){

        if(!localVideos.length){

            setStatus(
                "No mobile videos."
            );

            return;

        }


        localIndex++;


        if(
            localIndex >=
            localVideos.length
        ){

            localIndex = 0;

        }


        playLocalVideo(
            localIndex
        );

        return;

    }


    /*
       GOOGLE SHEET
    */

    if(!sheetVideos.length){

        setStatus(
            "Google Sheet मा video छैन।"
        );

        return;

    }


    /*
       If manual video was playing,
       start from first Sheet video.
    */

    if(
        currentIndex < 0
    ){

        currentIndex = 0;

    }
    else{

        currentIndex++;

    }


    if(
        currentIndex >=
        sheetVideos.length
    ){

        currentIndex = 0;

    }


    loadSheetVideo(
        currentIndex
    );

}


/* =====================================================
   PREVIOUS VIDEO
===================================================== */

function previousVideo(){

    /*
       LOCAL
    */

    if(
        mode === "local"
    ){

        if(!localVideos.length){
            return;
        }


        localIndex--;


        if(
            localIndex < 0
        ){

            localIndex =
                localVideos.length - 1;

        }


        playLocalVideo(
            localIndex
        );

        return;

    }


    /*
       SHEET
    */

    if(!sheetVideos.length){

        return;

    }


    /*
       If manual video was playing,
       previous starts from last Sheet video.
    */

    if(
        currentIndex < 0
    ){

        currentIndex =
            sheetVideos.length - 1;

    }
    else{

        currentIndex--;

    }


    if(
        currentIndex < 0
    ){

        currentIndex =
            sheetVideos.length - 1;

    }


    loadSheetVideo(
        currentIndex
    );

}

        );

/* =====================================================
   SEEK
===================================================== */

function seekVideo(seconds){

    /*
       LOCAL
    */

    if(
        mode === "local"
    ){

        const video =
            document.getElementById(
                "localPlayer"
            );


        let target =
            video.currentTime +
            seconds;


        if(
            Number.isFinite(
                video.duration
            )
        ){

            target =
                Math.max(
                    0,
                    Math.min(
                        video.duration,
                        target
                    )
                );

        }
        else{

            target =
                Math.max(
                    0,
                    target
                );

        }


        video.currentTime =
            target;

        return;

    }


    /*
       TIKTOK
    */

    if(
        mode === "tiktok"
    ){

        let target =
            Number(
                tiktokCurrentTime
            ) || 0;


        target +=
            Number(seconds) || 0;


        target =
            Math.max(
                0,
                target
            );


        tiktokCurrentTime =
            target;


        sendTikTokMessage(
            "seekTo",
            target
        );

        return;

    }


    /*
       YOUTUBE
    */

    if(
        !playerReady ||
        !player
    ){

        return;

    }


    const current =
        Number(
            player.getCurrentTime()
        ) || 0;


    const duration =
        Number(
            player.getDuration()
        ) || 0;


    let target =
        current +
        Number(seconds);


    target =
        Math.max(
            0,
            target
        );


    if(duration > 0){

        target =
            Math.min(
                duration,
                target
            );

    }


    player.seekTo(
        target,
        true
    );

}


/* =====================================================
   TIKTOK MESSAGE
===================================================== */

function sendTikTokMessage(
    type,
    value
){

    const iframe =
        document.getElementById(
            "tiktokPlayer"
        );


    if(
        !iframe ||
        !iframe.contentWindow
    ){

        return;

    }


    const message = {

        type:type,

        "x-tiktok-player":true

    };


    /*
       Only send value when required
    */

    if(
        value !== undefined &&
        value !== null
    ){

        message.value =
            value;

    }


    iframe.contentWindow.postMessage(
        message,
        "*"
    );

}


/* =====================================================
   TIKTOK EVENTS
===================================================== */

window.addEventListener(
    "message",
    function(event){

        const data =
            event.data;


        if(
            !data ||
            data["x-tiktok-player"] !== true
        ){

            return;

        }


        /*
           Current time
        */

        if(
            data.type ===
            "onCurrentTime"
        ){

            const value =
                Number(
                    data.value
                );


            if(
                Number.isFinite(value)
            ){

                tiktokCurrentTime =
                    value;

            }

        }


        /*
           State:
           0 = ended
           1 = playing
           2 = paused
           3 = buffering
        */

        if(
            data.type ===
            "onStateChange"
        ){

            const state =
                Number(
                    data.value
                );


            if(
                state === 0 &&
                mode === "tiktok"
            ){

                setTimeout(
                    function(){

                        if(
                            mode === "tiktok"
                        ){

                            nextVideo();

                        }

                    },
                    300
                );

            }

        }

    }
);

    /*
       LOCAL
    */

    if(
        mode === "local"
    ){

        document
            .getElementById(
                "localPlayer"
            )
            .volume =
            value / 100;

        return;

    }


    /*
       TIKTOK

       Official player supports
       mute/unMute rather than
       arbitrary volume.
    */

    if(
        mode === "tiktok"
    ){

        if(
            value <= 0
        ){

            sendTikTokMessage(
                "mute"
            );

        }
        else{

            sendTikTokMessage(
                "unMute"
            );

        }

        return;

    }


    /*
       YOUTUBE
    */

    if(
        playerReady &&
        player
    ){

        player.setVolume(
            value
        );

    }

}

/* =====================================================
   CSV PARSER
===================================================== */

function parseCSV(csv){

    const rows = [];

    let row = [];

    let value = "";

    let insideQuotes = false;


    for(
        let i = 0;
        i < csv.length;
        i++
    ){

        const char =
            csv[i];

        const next =
            csv[i + 1];


        if(
            char === '"' &&
            next === '"'
        ){

            value += '"';

            i++;

        }
        else if(
            char === '"'
        ){

            insideQuotes =
                !insideQuotes;

        }
        else if(
            char === ',' &&
            !insideQuotes
        ){

            row.push(
                value.trim()
            );

            value = "";

        }
        else if(
            (
                char === '\n' ||
                char === '\r'
            ) &&
            !insideQuotes
        ){

            if(
                char === '\r' &&
                next === '\n'
            ){

                i++;

            }


            row.push(
                value.trim()
            );


            if(
                row.some(
                    function(x){
                        return x !== "";
                    }
                )
            ){

                rows.push(row);

            }


            row = [];

            value = "";

        }
        else{

            value += char;

        }

    }


    if(
        value !== "" ||
        row.length
    ){

        row.push(
            value.trim()
        );


        if(
            row.some(
                function(x){
                    return x !== "";
                }
            )
        ){

            rows.push(row);

        }

    }


    /*
       First row = header
    */

    const data =
        rows.length > 0
        ? rows.slice(1)
        : [];


    const result = [];


    data.forEach(
        function(cols){

            /*
               A = Title
               B = URL
               C = Thumbnail
               D = Video ID
            */

            const title =
                (
                    cols[0] ||
                    "Untitled Video"
                ).trim();


            const url =
                (
                    cols[1] ||
                    ""
                ).trim();


            const thumbnail =
                extractImageURL(
                    cols[2] || ""
                );


            const sheetID =
                (
                    cols[3] ||
                    ""
                )
                .trim()
                .replace(/\s/g,"");


            /*
               =========================================
               TIKTOK
               =========================================
            */

            if(
                isTikTokURL(url)
            ){

                let id =
                    extractTikTokID(
                        url
                    );


                /*
                   Full TikTok URL:
                   ID URL बाट निकालिन्छ.
                */


                /*
                   vm.tiktok.com / vt.tiktok.com:
                   D column बाट ID
                */

                if(
                    !id &&
                    /^\d{15,25}$/.test(
                        sheetID
                    )
                ){

                    id =
                        sheetID;

                }


                /*
                   D column मा ID भए पनि
                   URL खाली/short भए support
                */

                if(id){

                    result.push({

                        id:String(id),

                        title:title,

                        url:url,

                        thumbnail:
                            thumbnail,

                        type:"tiktok"

                    });

                }

                return;

            }


            /*
               =========================================
               TIKTOK ID IN D COLUMN
               =========================================

               यदि B column खाली/invalid छ तर
               D मा TikTok ID छ भने पनि add गर्ने।
            */

            if(
                /^\d{15,25}$/.test(
                    sheetID
                ) &&
                (
                    !url ||
                    isTikTokURL(url)
                )
            ){

                result.push({

                    id:String(sheetID),

                    title:title,

                    url:url,

                    thumbnail:
                        thumbnail,

                    type:"tiktok"

                });

                return;

            }


            /*
               =========================================
               YOUTUBE
               =========================================
            */

            const youtubeID =
                extractVideoID(
                    url
                );


            if(youtubeID){

                result.push({

                    id:youtubeID,

                    title:title,

                    url:url,

                    thumbnail:
                        thumbnail,

                    type:"youtube"

                });

            }

        }
    );


    return result;

}

function renderSheetVideos(){

            "sheetList"
        );

        document
            .getElementById(
                "search"
            )
            .value
            .toLowerCase()
            .trim();

    const filtered =
        sheetVideos.filter(
            function(video){

                    video.title
                        .toLowerCase()
                        .includes(
                            search
                        )

                    ||

                    video.id
                        .toLowerCase()
                        .includes(
                            search
                        )

                    ||

                        .toLowerCase()
                        .includes(
                            search
                        )

function addHistory(video){

    historyVideos =
        historyVideos.filter(
            function(item){

                return !(
                    item.id ===
                    video.id &&

                    item.type ===
                    video.type
                );

            }
        );


    historyVideos.unshift(
        video
    );


    if(
        historyVideos.length >
        20
    ){

        historyVideos =
            historyVideos.slice(
                0,
                20
            );

    }


    renderHistory();

}

   ESCAPE HTML
===================================================== */

function escapeHTML(text){

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   KEYBOARD SUPPORT
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        /*
           Do not trigger when typing
        */

        const tag =
            document.activeElement
                ? document.activeElement.tagName
                : "";


        if(
            tag === "INPUT" ||
            tag === "TEXTAREA"
        ){

            return;

        }


        /*
           Space = Play/Pause
        */

        if(
            event.code === "Space"
        ){

            event.preventDefault();

            playVideo();

        }


        /*
           Arrow Right = +10
        */

        if(
            event.code === "ArrowRight"
        ){

            seekVideo(10);

        }


        /*
           Arrow Left = -10
        */

        if(
            event.code === "ArrowLeft"
        ){

            seekVideo(-10);

        }

    }
);


/* =====================================================
   ENTER KEY FOR URL
===================================================== */

document
    .getElementById(
        "videoUrl"
    )
    .addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter"
            ){

                event.preventDefault();

                loadVideoURL();

            }

        }
    );

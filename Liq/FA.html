<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Face Attendance System</title>
<style>
body{font-family:Arial;margin:0;background:#f1f5f9;color:#17202a}header{background:#0f766e;color:#fff;padding:16px;text-align:center}main{max-width:1050px;margin:auto;padding:12px}.card{background:white;padding:15px;margin:12px 0;border-radius:14px;box-shadow:0 2px 9px #0001}h2{font-size:18px;margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.settings{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}input,select,button{width:100%;padding:11px;border:1px solid #ccd5dc;border-radius:8px;font-size:15px;box-sizing:border-box}button{background:#0f766e;color:white;border:0;font-weight:bold}button.red{background:#dc2626}button.gray{background:#475569}video{width:100%;max-height:360px;background:#111;border-radius:12px}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:9px}.status{text-align:center;padding:13px;margin-top:9px;border-radius:9px;background:#eef2f7;font-weight:bold;white-space:pre-line}.ok{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:8px;border-bottom:1px solid #ddd;text-align:left;font-size:13px}th{background:#e2e8f0}.preview{width:110px;height:110px;object-fit:cover;border-radius:10px;margin:8px auto;display:block}.hide{display:none}@media(max-width:700px){.grid,.settings,.buttons{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><h2>🙏 Face Recognition Attendance</h2><small>Employee Registration • Live Face Match • Attendance</small></header><main>

<div class="card"><h2>⚙️ Settings</h2><div class="settings">
<label>Office Start<input type="time" id="office" value="08:00"></label>
<label>Late After<input type="time" id="late" value="09:00"></label>
<label>Match Threshold<input type="number" id="threshold" min=".35" max=".75" step=".01" value=".50"></label></div><br><button onclick="saveSettings()">💾 Save Settings</button></div>

<div class="card"><h2>👤 Register Employee</h2><div class="grid">
<input id="id" placeholder="Employee ID *"><input id="name" placeholder="Employee Name *"><input id="company" placeholder="Company"><input id="department" placeholder="Department"><input id="position" placeholder="Position"><input id="phone" placeholder="Phone">
<select id="shift"><option>General</option><option>Morning</option><option>Day</option><option>Night</option></select></div><br>
<input type="file" id="photo" accept="image/*" capture="user"><img id="preview" class="preview hide"><button onclick="register()" style="margin-top:8px">➕ Register Employee</button><div id="reg" class="status"></div></div>

<div class="card"><h2>📷 Live Attendance</h2><video id="video" autoplay muted playsinline></video><canvas id="canvas" class="hide"></canvas>
<div class="buttons"><button onclick="start()">▶️ Start</button><button class="gray" onclick="stop()">⏹ Stop</button><button onclick="scan()">🔍 Scan</button><button onclick="autoScan()">🔄 Auto</button></div><div id="status" class="status">Loading face recognition...</div></div>

<div class="card"><h2>📊 Attendance</h2><div class="grid"><input id="search" placeholder="Search employee / ID / company" oninput="render()"><input id="date" type="date" onchange="render()"></div><br><div class="buttons"><button onclick="csv()">⬇️ CSV</button><button class="gray" onclick="render()">🔄 Refresh</button><button class="red" onclick="clearAtt()">🗑 Clear Attendance</button><button class="red" onclick="resetAll()">⚠️ Reset All</button></div>
<div class="table"><table><thead><tr><th>Date</th><th>Time</th><th>ID</th><th>Name</th><th>Company</th><th>Department</th><th>Status</th><th>Action</th></tr></thead><tbody id="att"></tbody></table></div></div>

<div class="card"><h2>👥 Registered Employees</h2><div class="table"><table><thead><tr><th>ID</th><th>Name</th><th>Company</th><th>Department</th><th>Position</th><th>Shift</th><th>Action</th></tr></thead><tbody id="emps"></tbody></table></div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script><script>
const EK='fa_emp',AK='fa_att',SK='fa_set';let E=JSON.parse(localStorage.getItem(EK)||'[]'),A=JSON.parse(localStorage.getItem(AK)||'[]'),S=JSON.parse(localStorage.getItem(SK)||'{"office":"08:00","late":"09:00","threshold":0.50}'),stream=null,loaded=false,busy=false,timer=null;
const $=x=>document.getElementById(x);$('office').value=S.office;$('late').value=S.late;$('threshold').value=S.threshold;
$('photo').onchange=e=>{if(e.target.files[0]){$('preview').src=URL.createObjectURL(e.target.files[0]);$('preview').classList.remove('hide')}};
function msg(id,t,c=''){$(id).textContent=t;$(id).className='status '+c}
async function models(){if(loaded)return true;try{let b='https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights/';await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(b),faceapi.nets.faceLandmark68Net.loadFromUri(b),faceapi.nets.faceRecognitionNet.loadFromUri(b)]);loaded=true;msg('status','✅ Face recognition ready');return true}catch(e){msg('status','❌ Models need internet to load the first time','bad');return false}}
function saveSettings(){S={office:$('office').value||'08:00',late:$('late').value||'09:00',threshold:+$('threshold').value||.5};localStorage.setItem(SK,JSON.stringify(S));msg('reg','✅ Settings saved','ok')}
async function register(){let id=$('id').value.trim(),name=$('name').value.trim(),f=$('photo').files[0];if(!id||!name||!f)return msg('reg','❌ ID, Name and Photo are required','bad');if(E.some(x=>x.id.toLowerCase()==id.toLowerCase()))return msg('reg','❌ Employee ID already exists','bad');if(!await models())return;let src=await read(f),im=await image(src),d=await faceapi.detectSingleFace(im,new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();if(!d)return msg('reg','❌ No clear face found. Use a front-face photo.','bad');E.push({id,name,company:$('company').value.trim(),department:$('department').value.trim(),position:$('position').value.trim(),phone:$('phone').value.trim(),shift:$('shift').value,photo:src,descriptor:[...d.descriptor]});localStorage.setItem(EK,JSON.stringify(E));['id','name','company','department','position','phone'].forEach(x=>$(x).value='');$('photo').value='';$('preview').classList.add('hide');renderEmp();msg('reg','✅ Employee registered successfully','ok')}
async function start(){if(!await models())return;try{stop();stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});$('video').srcObject=stream;msg('status','📷 Camera started. Look at camera.')}catch(e){msg('status','❌ Camera access failed. Use HTTPS/localhost.','bad')}}
function stop(){if(stream)stream.getTracks().forEach(x=>x.stop());stream=null;if(timer){clearInterval(timer);timer=null}}
async function scan(){if(busy||!stream||!E.length)return msg('status',!stream?'❌ Start camera first':'❌ Register employee first','bad');busy=true;let d=await faceapi.detectSingleFace($('video'),new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks().withFaceDescriptor();if(!d){msg('status','🙂 Face not detected');busy=false;return}let best=null,bd=99;for(let e of E){let z=faceapi.euclideanDistance(d.descriptor,new Float32Array(e.descriptor));if(z<bd){bd=z;best=e}}if(best&&bd<=S.threshold)mark(best,bd);else msg('status','❌ SORRY — Face not recognized','bad');busy=false}
function mark(e,dist){let d=new Date(),date=d.toLocaleDateString('en-CA'),time=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false}),old=A.find(x=>x.id==e.id&&x.date==date);if(old)return msg('status','🙏 WELCOME — '+e.name+'\nAttendance already marked at '+old.time,'ok');let late=time>S.late;A.unshift({date,time,id:e.id,name:e.name,company:e.company,department:e.department,status:late?'Late':'Present',distance:+dist.toFixed(4)});localStorage.setItem(AK,JSON.stringify(A));render();msg('status','🙏 WELCOME — '+e.name+' • '+(late?'LATE':'PRESENT')+' • '+time,'ok')}
function autoScan(){if(timer){clearInterval(timer);timer=null;msg('status','⏹ Auto scan stopped');return}if(!stream)return start().then(()=>{timer=setInterval(scan,2500)});timer=setInterval(scan,2500);msg('status','🔄 Auto scan ON')}
function render(){let q=$('search').value.toLowerCase(),d=$('date').value,r=A.filter(x=>(!q||[x.id,x.name,x.company,x.department].join(' ').toLowerCase().includes(q))&&(!d||x.date==d));$('att').innerHTML=r.length?r.map(x=>'<tr><td>'+x.date+'</td><td>'+x.time+'</td><td>'+h(x.id)+'</td><td>'+h(x.name)+'</td><td>'+h(x.company)+'</td><td>'+h(x.department)+'</td><td>'+x.status+'</td><td><button class="red" onclick="delAtt('+JSON.stringify(x.date)+','+JSON.stringify(x.id)+')">Delete</button></td></tr>').join(''):'<tr><td colspan="8">No attendance found.</td></tr>'}
function renderEmp(){$('emps').innerHTML=E.length?E.map((x,i)=>'<tr><td>'+h(x.id)+'</td><td>'+h(x.name)+'</td><td>'+h(x.company)+'</td><td>'+h(x.department)+'</td><td>'+h(x.position)+'</td><td>'+h(x.shift)+'</td><td><button class="red" onclick="delEmp('+i+')">Delete</button></td></tr>').join(''):'<tr><td colspan="7">No employees.</td></tr>'}
function delEmp(i){if(confirm('Delete employee?')){E.splice(i,1);localStorage.setItem(EK,JSON.stringify(E));renderEmp()}}function delAtt(d,id){A=A.filter(x=>!(x.date==d&&x.id==id));localStorage.setItem(AK,JSON.stringify(A));render()}
function clearAtt(){if(confirm('Clear all attendance?')){A=[];localStorage.setItem(AK,'[]');render()}}function resetAll(){if(confirm('Delete all employees and attendance?')){E=[];A=[];localStorage.removeItem(EK);localStorage.removeItem(AK);render();renderEmp()}}
function csv(){let r=[['Date','Time','ID','Name','Company','Department','Status','Distance'],...A.map(x=>[x.date,x.time,x.id,x.name,x.company,x.department,x.status,x.distance])],s=r.map(a=>a.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='attendance.csv';a.click()}
function read(f){return new Promise((a,b)=>{let r=new FileReader();r.onload=()=>a(r.result);r.onerror=b;r.readAsDataURL(f)})}function image(s){return new Promise((a,b)=>{let i=new Image();i.onload=()=>a(i);i.onerror=b;i.src=s})}function h(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
render();renderEmp();models();
</script></body></html>

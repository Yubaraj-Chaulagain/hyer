<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YouTube Pro Player</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #0b0b0b;
    color: white;
    min-height: 100vh;
}

.app {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

header {
    text-align: center;
    margin-bottom: 25px;
}

header h1 {
    color: #ff0000;
    font-size: 28px;
}

header p {
    color: #aaa;
    margin-top: 8px;
}

/* SEARCH */
.search-box {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
}

.search-box input {
    flex: 1;
    padding: 15px;
    border: none;
    outline: none;
    border-radius: 10px;
    background: #1b1b1b;
    color: white;
    font-size: 16px;
}

.search-box button {
    padding: 0 25px;
    border: none;
    border-radius: 10px;
    background: #ff0000;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

/* PLAYER */
.player-box {
    background: #111;
    padding: 15px;
    border-radius: 15px;
    box-shadow: 0 0 30px rgba(255,0,0,.15);
}

.player {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: black;
    border-radius: 10px;
    overflow: hidden;
}

#player {
    width: 100%;
    height: 100%;
}

/* CONTROLS */
.controls {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 18px;
}

.controls button {
    background: #222;
    border: none;
    color: white;
    padding: 12px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
}

.controls button:hover {
    background: #ff0000;
}

/* VOLUME */
.volume-box {
    margin-top: 20px;
}

.volume-box label {
    color: #aaa;
}

.volume-box input {
    width: 100%;
    margin-top: 8px;
}

/* HISTORY */
.history {
    margin-top: 30px;
}

.history h2 {
    margin-bottom: 15px;
}

.history-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #161616;
    padding: 12px;
    border-radius: 8px;
}

.history-item button {
    background: #ff0000;
    color: white;
    border: none;
    padding: 7px 12px;
    border-radius: 6px;
    cursor: pointer;
}

/* MOBILE */
@media(max-width: 600px) {
    .search-box {
        flex-direction: column;
    }

    .search-box button {
        padding: 14px;
    }

    .controls button {
        flex: 1 1 40%;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <h1>▶ YouTube Pro Player</h1>
    <p>Professional YouTube Player • No Search API Required</p>
</header>

<div class="search-box">
    <input
        type="text"
        id="youtubeUrl"
        placeholder="Paste YouTube Video URL or Video ID"
    >

    <button onclick="loadVideo()">Load Video</button>
</div>

<div class="player-box">

    <div class="player">
        <div id="player"></div>
    </div>

    <div class="controls">

        <button onclick="previousVideo()">⏮ Previous</button>

        <button onclick="backward()">⏪ -10 sec</button>

        <button onclick="playVideo()">▶ Play</button>

        <button onclick="pauseVideo()">⏸ Pause</button>

        <button onclick="forward()">⏩ +10 sec</button>

        <button onclick="stopVideo()">⏹ Cancel</button>

    </div>

    <div class="volume-box">
        <label>🔊 Volume</label>

        <input
            type="range"
            min="0"
            max="100"
            value="100"
            onchange="changeVolume(this.value)"
        >
    </div>

</div>

<div class="history">

    <h2>📜 Previous Videos</h2>

    <div class="history-list" id="historyList"></div>

</div>

</div>


<!-- YouTube IFrame API -->
<script src="https://www.youtube.com/iframe_api"></script>

<script>

let player;
let playlist = [];
let currentIndex = -1;


/* YOUTUBE PLAYER READY */

function onYouTubeIframeAPIReady() {

    player = new YT.Player("player", {

        height: "100%",
        width: "100%",

        videoId: "",

        playerVars: {
            autoplay: 0,
            controls: 1,
            rel: 0
        }

    });

}


/* EXTRACT VIDEO ID */

function extractVideoID(url) {

    if (!url) return null;

    // Direct Video ID
    if (
        url.length === 11 &&
        !url.includes("/") &&
        !url.includes(".")
    ) {
        return url;
    }

    let match = url.match(
        /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&?/ ]{11})/
    );

    return match ? match[1] : null;
}


/* LOAD VIDEO */

function loadVideo() {

    let input =
        document.getElementById("youtubeUrl");

    let value =
        input.value.trim();

    let videoID =
        extractVideoID(value);


    if (!videoID) {

        alert(
            "Please enter a valid YouTube URL or Video ID"
        );

        return;
    }


    // Prevent duplicates
    let existing =
        playlist.indexOf(videoID);


    if (existing !== -1) {

        currentIndex = existing;

    } else {

        playlist.push(videoID);

        currentIndex =
            playlist.length - 1;

    }


    player.loadVideoById(videoID);


    input.value = "";


    renderHistory();

}


/* PLAY */

function playVideo() {

    if (player)
        player.playVideo();

}


/* PAUSE */

function pauseVideo() {

    if (player)
        player.pauseVideo();

}


/* STOP / CANCEL */

function stopVideo() {

    if (player) {

        player.stopVideo();

    }

}


/* BACKWARD 10 SEC */

function backward() {

    if (!player) return;

    let current =
        player.getCurrentTime();

    player.seekTo(
        Math.max(0, current - 10),
        true
    );

}


/* FORWARD 10 SEC */

function forward() {

    if (!player) return;

    let current =
        player.getCurrentTime();

    player.seekTo(
        current + 10,
        true
    );

}


/* VOLUME */

function changeVolume(value) {

    if (player)
        player.setVolume(value);

}


/* PREVIOUS VIDEO */

function previousVideo() {

    if (
        playlist.length === 0 ||
        currentIndex <= 0
    ) {
        return;
    }


    currentIndex--;


    let videoID =
        playlist[currentIndex];


    player.loadVideoById(videoID);

    renderHistory();

}


/* PLAY HISTORY VIDEO */

function playHistory(index) {

    currentIndex = index;


    player.loadVideoById(
        playlist[index]
    );


    renderHistory();

}


/* RENDER HISTORY */

function renderHistory() {

    let container =
        document.getElementById(
            "historyList"
        );


    container.innerHTML = "";


    playlist.forEach(
        (videoID, index) => {


            let item =
                document.createElement(
                    "div"
                );


            item.className =
                "history-item";


            let text =
                document.createElement(
                    "span"
                );


            text.innerText =
                "YouTube Video: " +
                videoID;


            let button =
                document.createElement(
                    "button"
                );


            button.innerText =
                "Play";


            button.onclick =
                () =>
                playHistory(index);


            item.appendChild(text);

            item.appendChild(button);


            container.appendChild(item);

        }
    );

}

</script>

</body>
</html>

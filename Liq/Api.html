<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YouTube + Mobile Video Player</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#0b0b0b;
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    max-width:1000px;
    margin:auto;
    padding:12px;
}

h2{
    text-align:center;
    margin:8px 0 14px;
}

.input-row{
    display:flex;
    gap:8px;
    margin-bottom:8px;
}

input[type="text"]{
    flex:1;
    min-width:0;
    padding:12px;
    border-radius:8px;
    border:1px solid #444;
    background:#181818;
    color:#fff;
}

button,
.local-btn{
    border:0;
    border-radius:8px;
    padding:11px 14px;
    background:#222;
    color:#fff;
    cursor:pointer;
    font-size:14px;
}

button:hover,
.local-btn:hover{
    background:#333;
}

.load-btn{
    background:#e50914;
}

.load-btn:hover{
    background:#ff1a25;
}

.local-btn{
    display:inline-block;
    background:#075e54;
}

.local-btn input{
    display:none;
}

.clear-btn{
    background:#642020;
}

.status{
    padding:8px 10px;
    background:#151515;
    border-radius:7px;
    margin:8px 0;
    font-size:13px;
    color:#bbb;
}

.player-box{
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border-radius:10px;
    overflow:hidden;
    margin:10px 0;
}

#youtubePlayer,
#localPlayer{
    width:100%;
    height:100%;
}

#localPlayer{
    display:none;
    object-fit:contain;
    background:#000;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:center;
    margin:8px 0;
}

.controls button{
    min-width:70px;
}

.volume-box{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin:8px 0 14px;
}

#volume{
    width:180px;
}

.section{
    background:#121212;
    border-radius:10px;
    padding:10px;
    margin-top:12px;
}

.section h3{
    margin:4px 0 10px;
    font-size:17px;
}

.search{
    width:100%;
    padding:11px;
    border-radius:8px;
    border:1px solid #444;
    background:#181818;
    color:#fff;
    margin-bottom:8px;
}

.video-list{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.video-item{
    display:flex;
    gap:10px;
    align-items:center;
    padding:7px;
    background:#1b1b1b;
    border-radius:8px;
    cursor:pointer;
}

.video-item:hover{
    background:#282828;
}

.thumb{
    width:110px;
    height:62px;
    object-fit:cover;
    border-radius:6px;
    background:#000;
    flex-shrink:0;
}

.video-info{
    min-width:0;
}

.video-title{
    font-size:14px;
    font-weight:bold;
    line-height:1.3;
    overflow:hidden;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
}

.video-type{
    font-size:11px;
    color:#999;
    margin-top:4px;
}

.local-tools{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.empty{
    text-align:center;
    color:#777;
    padding:15px;
    font-size:13px;
}

@media(max-width:600px){
    .input-row{
        flex-direction:column;
    }

    .input-row button{
        width:100%;
    }

    .controls button{
        min-width:62px;
        padding:10px 8px;
        font-size:13px;
    }

    .thumb{
        width:90px;
        height:51px;
    }

    .video-title{
        font-size:13px;
    }
}
</style>
</head>

<body>

<div class="container">

<h2>▶ YouTube + Mobile Video Player</h2>

<div class="input-row">
    <input
        type="text"
        id="youtubeUrl"
        placeholder="Paste YouTube URL..."
    >
    <button class="load-btn" onclick="loadYouTubeURL()">
        Load YouTube
    </button>
</div>

<div class="local-tools">

    <label class="local-btn">
        📱 Select Mobile Videos
        <input
            type="file"
            id="localVideos"
            accept="video/*"
            multiple
        >
    </label>

    <button class="clear-btn" onclick="clearLocalVideos()">
        🗑 Clear Mobile Videos
    </button>

</div>

<div class="status" id="status">
    Ready
</div>

<div class="player-box">

    <div id="youtubePlayer"></div>

    <video
        id="localPlayer"
        playsinline
        preload="metadata"
    ></video>

</div>

<div class="controls">

    <button onclick="previousVideo()">⏮ Previous</button>

    <button onclick="seekVideo(-10)">↶ -10</button>

    <button onclick="playVideo()">▶ Play</button>

    <button onclick="pauseVideo()">⏸ Pause</button>

    <button onclick="seekVideo(10)">+10 ↷</button>

    <button onclick="nextVideo()">Next ⏭</button>

    <button onclick="stopVideo()">⏹ Stop</button>

</div>

<div class="volume-box">

    🔊

    <input
        type="range"
        id="volume"
        min="0"
        max="100"
        value="100"
        oninput="changeVolume(this.value)"
    >

    <span id="volumeText">100%</span>

</div>


<!-- GOOGLE SHEET -->

<div class="section">

    <h3>📊 Google Sheet Videos</h3>

    <input
        class="search"
        id="search"
        type="text"
        placeholder="Search videos..."
        oninput="searchVideos()"
    >

    <div id="sheetList" class="video-list">
        <div class="empty">
            Loading Google Sheet...
        </div>
    </div>

</div>


<!-- LOCAL VIDEOS -->

<div class="section">

    <h3>📱 Mobile Videos</h3>

    <div id="localList" class="video-list">

        <div class="empty">
            No mobile videos selected.
        </div>

    </div>

</div>


<!-- HISTORY -->

<div class="section">

    <h3>🕘 History</h3>

    <div id="historyList" class="video-list">

        <div class="empty">
            No history yet.
        </div>

    </div>

</div>

</div>


<script src="https://www.youtube.com/iframe_api"></script>

<script>

/* =====================================================
   GOOGLE SHEET
===================================================== */

const SHEET_CSV =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQfLCxJaz-eDFB7SGeROjZDepLOHg1ZggZhYf5kfWJc8S-l1H9frmOshuakfD7_4ocFZd2tvRvEaLN9/pub?gid=281133690&single=true&output=csv";


/* =====================================================
   VARIABLES
===================================================== */

let player = null;

let playerReady = false;

let sheetVideos = [];

let currentIndex = -1;

let localVideos = [];

let localIndex = -1;

let mode = "youtube";

let historyVideos = [];


/* =====================================================
   YOUTUBE API READY
===================================================== */

function onYouTubeIframeAPIReady(){

    player = new YT.Player("youtubePlayer",{

        height:"100%",
        width:"100%",

        videoId:"",

        playerVars:{
            autoplay:0,
            controls:1,
            rel:0,
            playsinline:1,
            modestbranding:1
        },

        events:{

            onReady:function(){

                playerReady = true;

                setStatus("YouTube player ready");

            },

            onStateChange:onPlayerStateChange,

            onError:function(event){

                setStatus(
                    "YouTube error: " + event.data
                );

            }

        }

    });

}


/* =====================================================
   YOUTUBE AUTO NEXT
===================================================== */

function onPlayerStateChange(event){

    if(event.data === YT.PlayerState.ENDED){

        setTimeout(function(){

            nextVideo();

        },300);

    }

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(text){

    document.getElementById("status").textContent = text;

}


/* =====================================================
   EXTRACT YOUTUBE ID
===================================================== */

function extractVideoID(input){

    if(!input) return null;

    input = input.trim();

    /*
       Direct ID
    */

    if(/^[a-zA-Z0-9_-]{11}$/.test(input)){

        return input;

    }

    try{

        const url = new URL(input);

        /*
           youtube.com/watch?v=
        */

        if(
            url.hostname.includes("youtube.com") &&
            url.searchParams.get("v")
        ){

            return url.searchParams.get("v");

        }

        /*
           youtu.be/ID
        */

        if(url.hostname === "youtu.be"){

            return url.pathname.substring(1);

        }

        /*
           /embed/ID
        */

        if(url.pathname.startsWith("/embed/")){

            return url.pathname.split("/")[2];

        }

        /*
           /shorts/ID
        */

        if(url.pathname.startsWith("/shorts/")){

            return url.pathname.split("/")[2];

        }

    }catch(e){

        return null;

    }

    return null;

}


/* =====================================================
   LOAD YOUTUBE URL
===================================================== */

function loadYouTubeURL(){

    const input =
        document.getElementById("youtubeUrl").value.trim();

    if(!input){

        alert("YouTube URL राख्नुहोस्।");

        return;

    }

    const id = extractVideoID(input);

    if(!id){

        alert("Valid YouTube video URL भेटिएन।");

        return;

    }

    mode = "youtube";

    showYouTubePlayer();

    /*
       If video exists in Google Sheet,
       use its Sheet position.
    */

    const foundIndex =
        sheetVideos.findIndex(v => v.id === id);

    if(foundIndex !== -1){

        currentIndex = foundIndex;

        loadYouTubeVideo(currentIndex);

        return;

    }

    /*
       Manual YouTube video
    */

    currentIndex = -1;

    if(playerReady){

        player.loadVideoById(id);

        addHistory({

            id:id,

            title:"Manual YouTube Video",

            type:"YouTube"

        });

        setStatus("Playing manual YouTube video");

    }

}


/* =====================================================
   LOAD SHEET YOUTUBE VIDEO
===================================================== */

function loadYouTubeVideo(index){

    if(!sheetVideos.length){

        return;

    }

    if(index < 0){

        index = sheetVideos.length - 1;

    }

    if(index >= sheetVideos.length){

        index = 0;

    }

    currentIndex = index;

    const video = sheetVideos[index];

    mode = "youtube";

    showYouTubePlayer();

    if(!playerReady){

        setStatus("YouTube player अझै loading...");

        return;

    }

    player.loadVideoById(video.id);

    addHistory({

        id:video.id,

        title:video.title,

        type:"Google Sheet"

    });

    setStatus(
        "YouTube: " +
        video.title
    );

    renderSheetVideos();

}


/* =====================================================
   NEXT
===================================================== */

function nextVideo(){

    /*
       LOCAL MODE
    */

    if(mode === "local"){

        if(!localVideos.length){

            return;

        }

        localIndex++;

        if(localIndex >= localVideos.length){

            localIndex = 0;

        }

        playLocalVideo(localIndex);

        return;

    }


    /*
       YOUTUBE MODE
    */

    if(!sheetVideos.length){

        setStatus(
            "Google Sheet मा video छैन।"
        );

        return;

    }

    currentIndex++;

    if(currentIndex >= sheetVideos.length){

        currentIndex = 0;

    }

    loadYouTubeVideo(currentIndex);

}


/* =====================================================
   PREVIOUS
===================================================== */

function previousVideo(){

    /*
       LOCAL
    */

    if(mode === "local"){

        if(!localVideos.length){

            return;

        }

        localIndex--;

        if(localIndex < 0){

            localIndex =
                localVideos.length - 1;

        }

        playLocalVideo(localIndex);

        return;

    }


    /*
       YOUTUBE
    */

    if(!sheetVideos.length){

        return;

    }

    currentIndex--;

    if(currentIndex < 0){

        currentIndex =
            sheetVideos.length - 1;

    }

    loadYouTubeVideo(currentIndex);

}


/* =====================================================
   PLAY
===================================================== */

function playVideo(){

    if(mode === "local"){

        const video =
            document.getElementById("localPlayer");

        video.play().catch(function(){});

        return;

    }

    if(playerReady){

        player.playVideo();

    }

}


/* =====================================================
   PAUSE
===================================================== */

function pauseVideo(){

    if(mode === "local"){

        document
            .getElementById("localPlayer")
            .pause();

        return;

    }

    if(playerReady){

        player.pauseVideo();

    }

}


/* =====================================================
   STOP
===================================================== */

function stopVideo(){

    if(mode === "local"){

        const video =
            document.getElementById("localPlayer");

        video.pause();

        video.currentTime = 0;

        return;

    }

    if(playerReady){

        player.pauseVideo();

        player.seekTo(0,true);

    }

}


/* =====================================================
   SEEK
===================================================== */

function seekVideo(seconds){

    if(mode === "local"){

        const video =
            document.getElementById("localPlayer");

        video.currentTime =
            Math.max(
                0,
                Math.min(
                    video.duration || Infinity,
                    video.currentTime + seconds
                )
            );

        return;

    }

    if(!playerReady){

        return;

    }

    const current =
        player.getCurrentTime();

    const duration =
        player.getDuration();

    let target =
        current + seconds;

    target =
        Math.max(
            0,
            Math.min(duration,target)
        );

    player.seekTo(target,true);

}


/* =====================================================
   VOLUME
===================================================== */

function changeVolume(value){

    value = Number(value);

    document.getElementById(
        "volumeText"
    ).textContent = value + "%";


    if(mode === "local"){

        document.getElementById(
            "localPlayer"
        ).volume = value / 100;

        return;

    }

    if(playerReady){

        player.setVolume(value);

    }

}


/* =====================================================
   SHOW YOUTUBE
===================================================== */

function showYouTubePlayer(){

    document.getElementById(
        "youtubePlayer"
    ).style.display = "block";

    document.getElementById(
        "localPlayer"
    ).style.display = "none";

}


/* =====================================================
   SHOW LOCAL
===================================================== */

function showLocalPlayer(){

    document.getElementById(
        "youtubePlayer"
    ).style.display = "none";

    document.getElementById(
        "localPlayer"
    ).style.display = "block";

}


/* =====================================================
   LOCAL VIDEO FILE SELECT
===================================================== */

document
.getElementById("localVideos")
.addEventListener("change",function(event){

    const files =
        Array.from(event.target.files || []);

    if(!files.length){

        return;

    }


    /*
       Release old object URLs
    */

    localVideos.forEach(function(video){

        URL.revokeObjectURL(video.url);

    });


    localVideos = files.map(function(file){

        return {

            file:file,

            url:URL.createObjectURL(file),

            title:file.name

        };

    });


    localIndex = -1;

    renderLocalVideos();

    setStatus(
        localVideos.length +
        " वटा mobile video loaded"
    );


    /*
       Automatically play first selected video
    */

    playLocalVideo(0);

});


/* =====================================================
   PLAY LOCAL VIDEO
===================================================== */

function playLocalVideo(index){

    if(!localVideos.length){

        return;

    }

    if(index < 0){

        index = localVideos.length - 1;

    }

    if(index >= localVideos.length){

        index = 0;

    }

    localIndex = index;

    mode = "local";

    showLocalPlayer();


    const video =
        document.getElementById("localPlayer");

    const item =
        localVideos[index];


    video.src = item.url;

    video.volume =
        Number(
            document.getElementById(
                "volume"
            ).value
        ) / 100;


    video.load();

    video.play().catch(function(){

        /*
           Some browsers may require
           a user tap on Play.
        */

        setStatus(
            "Video loaded — Play थिच्नुहोस्"
        );

    });


    addHistory({

        id:"local-" + index,

        title:item.title,

        type:"Mobile"

    });


    setStatus(
        "📱 " +
        item.title
    );


    renderLocalVideos();

}


/* =====================================================
   LOCAL VIDEO ENDED
===================================================== */

document
.getElementById("localPlayer")
.addEventListener("ended",function(){

    if(mode !== "local"){

        return;

    }

    nextVideo();

});


/* =====================================================
   RENDER LOCAL LIST
===================================================== */

function renderLocalVideos(){

    const box =
        document.getElementById(
            "localList"
        );

    box.innerHTML = "";


    if(!localVideos.length){

        box.innerHTML =
            '<div class="empty">' +
            'No mobile videos selected.' +
            '</div>';

        return;

    }


    localVideos.forEach(function(video,index){

        const item =
            document.createElement("div");

        item.className =
            "video-item";


        item.innerHTML = `

            <div class="thumb"
                 style="
                 display:flex;
                 align-items:center;
                 justify-content:center;
                 font-size:25px;
                 ">
                 📱
            </div>

            <div class="video-info">

                <div class="video-title">
                    ${escapeHTML(video.title)}
                </div>

                <div class="video-type">
                    Mobile Video ${index + 1}
                </div>

            </div>

        `;


        item.onclick = function(){

            playLocalVideo(index);

        };


        box.appendChild(item);

    });

}


/* =====================================================
   CLEAR LOCAL
===================================================== */

function clearLocalVideos(){

    const video =
        document.getElementById("localPlayer");

    video.pause();

    video.removeAttribute("src");

    video.load();


    localVideos.forEach(function(item){

        URL.revokeObjectURL(item.url);

    });


    localVideos = [];

    localIndex = -1;

    renderLocalVideos();

    mode = "youtube";

    showYouTubePlayer();

    setStatus(
        "Mobile videos cleared"
    );

}


/* =====================================================
   LOAD GOOGLE SHEET
===================================================== */

async function loadSheetVideos(){

    try{

        setStatus(
            "Google Sheet loading..."
        );


        const response =
            await fetch(SHEET_CSV + "&t=" + Date.now());


        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }


        const csv =
            await response.text();


        sheetVideos =
            parseCSV(csv);


        renderSheetVideos();


        setStatus(
            sheetVideos.length +
            " वटा Google Sheet videos loaded"
        );


    }catch(error){

        console.error(error);

        document.getElementById(
            "sheetList"
        ).innerHTML =

            '<div class="empty">' +
            'Google Sheet load failed.<br>' +
            escapeHTML(error.message) +
            '</div>';

        setStatus(
            "Google Sheet load failed"
        );

    }

}


/* =====================================================
   CSV PARSER
===================================================== */

function parseCSV(csv){

    const rows = [];

    let row = [];

    let value = "";

    let insideQuotes = false;


    for(let i=0;i<csv.length;i++){

        const char = csv[i];

        const next = csv[i + 1];


        if(char === '"' && next === '"'){

            value += '"';

            i++;

        }

        else if(char === '"'){

            insideQuotes =
                !insideQuotes;

        }

        else if(char === ',' && !insideQuotes){

            row.push(value.trim());

            value = "";

        }

        else if(
            (char === '\n' ||
             char === '\r') &&
            !insideQuotes
        ){

            if(char === '\r' && next === '\n'){

                i++;

            }

            row.push(value.trim());

            if(row.some(x => x !== "")){

                rows.push(row);

            }

            row = [];

            value = "";

        }

        else{

            value += char;

        }

    }


    if(value !== "" || row.length){

        row.push(value.trim());

        if(row.some(x => x !== "")){

            rows.push(row);

        }

    }


    /*
       First row = header
    */

    const data =
        rows.slice(1);


    const result = [];


    data.forEach(function(cols){

        const title =
            (cols[0] || "Untitled Video").trim();

        const url =
            (cols[1] || "").trim();


        const id =
            extractVideoID(url);


        if(id){

            result.push({

                id:id,

                title:title,

                url:url

            });

        }

    });


    return result;

}


/* =====================================================
   RENDER SHEET
===================================================== */

function renderSheetVideos(){

    const box =
        document.getElementById(
            "sheetList"
        );


    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();


    box.innerHTML = "";


    const filtered =
        sheetVideos.filter(function(video){

            return (

                video.title
                    .toLowerCase()
                    .includes(search)

                ||

                video.id
                    .toLowerCase()
                    .includes(search)

                ||

                video.url
                    .toLowerCase()
                    .includes(search)

            );

        });


    if(!filtered.length){

        box.innerHTML =
            '<div class="empty">' +
            'Video भेटिएन।' +
            '</div>';

        return;

    }


    filtered.forEach(function(video){

        const index =
            sheetVideos.indexOf(video);


        const item =
            document.createElement("div");


        item.className =
            "video-item";


        item.innerHTML = `

            <img
                class="thumb"
                src="https://img.youtube.com/vi/${video.id}/hqdefault.jpg"
                loading="lazy"
                onerror="this.style.display='none'"
            >

            <div class="video-info">

                <div class="video-title">
                    ${escapeHTML(video.title)}
                </div>

                <div class="video-type">
                    YouTube • Sheet #${index + 1}
                </div>

            </div>

        `;


        item.onclick = function(){

            mode = "youtube";

            loadYouTubeVideo(index);

        };


        box.appendChild(item);

    });

}


/* =====================================================
   SEARCH
===================================================== */

function searchVideos(){

    renderSheetVideos();

}


/* =====================================================
   HISTORY
===================================================== */

function addHistory(video){

    historyVideos =
        historyVideos.filter(function(item){

            return !(
                item.id === video.id &&
                item.type === video.type
            );

        });


    historyVideos.unshift(video);


    if(historyVideos.length > 20){

        historyVideos =
            historyVideos.slice(0,20);

    }


    renderHistory();

}


/* =====================================================
   RENDER HISTORY
===================================================== */

function renderHistory(){

    const box =
        document.getElementById(
            "historyList"
        );


    box.innerHTML = "";


    if(!historyVideos.length){

        box.innerHTML =
            '<div class="empty">' +
            'No history yet.' +
            '</div>';

        return;

    }


    historyVideos.forEach(function(video){

        const item =
            document.createElement("div");


        item.className =
            "video-item";


        if(video.type === "YouTube" ||
           video.type === "Google Sheet"){

            item.innerHTML = `

                <img
                    class="thumb"
                    src="https://img.youtube.com/vi/${video.id}/hqdefault.jpg"
                >

                <div class="video-info">

                    <div class="video-title">
                        ${escapeHTML(video.title)}
                    </div>

                    <div class="video-type">
                        ${video.type}
                    </div>

                </div>

            `;


            item.onclick = function(){

                const index =
                    sheetVideos.findIndex(
                        v => v.id === video.id
                    );


                if(index !== -1){

                    mode = "youtube";

                    loadYouTubeVideo(index);

                }
                else{

                    mode = "youtube";

                    showYouTubePlayer();

                    if(playerReady){

                        player.loadVideoById(
                            video.id
                        );

                    }

                }

            };

        }
        else{

            item.innerHTML = `

                <div class="thumb"
                     style="
                     display:flex;
                     align-items:center;
                     justify-content:center;
                     font-size:25px;
                     ">
                     📱
                </div>

                <div class="video-info">

                    <div class="video-title">
                        ${escapeHTML(video.title)}
                    </div>

                    <div class="video-type">
                        Mobile Video
                    </div>

                </div>

            `;

        }


        box.appendChild(item);

    });

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   START
===================================================== */

loadSheetVideos();

</script>

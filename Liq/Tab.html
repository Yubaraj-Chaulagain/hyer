<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Media Player</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f1115;color:#fff;font-family:Arial,sans-serif}
.side-nav{
 position:fixed;left:0;top:0;bottom:0;width:190px;
 background:#181a1f;border-right:1px solid #292c33;
 padding:12px 8px;z-index:1000;overflow-y:auto
}
.app{margin-left:190px;max-width:none;padding:15px}
body.nav-closed .side-nav{transform:translateX(-100%)}
body.nav-closed .app{margin-left:0}
body.nav-closed .nav-toggle{left:12px}
.side-nav{transition:transform .25s ease}

.player-wrap{background:#000;border-radius:12px;overflow:hidden;margin-bottom:15px}
.player{position:relative;width:100%;aspect-ratio:16/9;background:#000}
.player iframe,.player video{width:100%;height:100%;border:0;display:block}
.player-title{padding:10px 12px;background:#181a1f;font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px;background:#181a1f}
.controls button,.clear-btn{border:0;border-radius:7px;padding:9px 13px;background:#2563eb;color:#fff;font-weight:bold;cursor:pointer}
.controls button:hover,.clear-btn:hover{opacity:.85}
.volume{width:110px}
.app-layout{display:block;width:100%}
.nav-item{width:100%;display:flex;align-items:center;gap:10px;padding:13px 12px;margin-bottom:6px;border:0;border-radius:8px;background:transparent;color:#aaa;text-align:left;font-size:14px;font-weight:bold;cursor:pointer}
.nav-item:last-child{margin-bottom:0}
.nav-item:hover{background:#24272d;color:#fff}
.nav-item.active{background:#2563eb;color:#fff}
.nav-icon{width:25px;text-align:center;font-size:17px}.nav-text{flex:1}
.page-content{flex:1;min-width:0}
.tab-panel{display:none}.tab-panel.active{display:block}
.search{width:100%;padding:12px;border-radius:8px;border:1px solid #30343c;background:#181a1f;color:#fff;margin-bottom:12px;outline:none}
.video-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.card{background:#181a1f;border:1px solid #292c33;border-radius:10px;overflow:hidden;cursor:pointer}
.card:hover{border-color:#2563eb}
.thumb{width:100%;aspect-ratio:16/9;object-fit:cover;background:#222}
.card-title{padding:9px;font-size:13px;line-height:1.3}
.offline-tools{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.file-label{display:inline-block;background:#2563eb;padding:10px 13px;border-radius:7px;font-weight:bold;cursor:pointer}
.file-label input{display:none}
.empty{padding:25px;text-align:center;background:#181a1f;border-radius:10px;color:#999}
.history{margin-top:15px;background:#181a1f;border-radius:10px;padding:12px}
.history h3{margin:0 0 10px}
@media(max-width:600px){
 .side-nav{width:65px;padding:5px;border-radius:0}
 .nav-toggle{left:72px;top:7px;width:38px;height:38px}
 body.nav-closed .nav-toggle{left:7px}
 .app{margin-left:65px;padding:7px}.app-layout{gap:7px}
 .nav-item{min-height:65px;padding:7px 3px;margin-bottom:5px;flex-direction:column;justify-content:center;gap:3px;text-align:center;font-size:9px}
 .nav-icon{width:auto;font-size:19px}.nav-text{width:100%;font-size:9px}
 .video-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
 .card-title{font-size:11px;padding:7px}
 .controls button{padding:8px 9px;font-size:12px}
}
</style>
</head>
<body class="nav-closed">
<button id="navToggle" class="nav-toggle" onclick="toggleSideNav()" aria-label="Toggle navigation">☰</button>
<div id="navOverlay" class="nav-overlay" onclick="closeSideNav()"></div>
<nav id="sideNav" class="side-nav">
 <button class="nav-item active" onclick="openTabAndClose('youtube',this)"><span class="nav-icon">▶</span><span class="nav-text">YouTube</span></button>
 <button class="nav-item" onclick="openTabAndClose('tiktok',this)"><span class="nav-icon">🎵</span><span class="nav-text">TikTok</span></button>
 <button class="nav-item" onclick="openTabAndClose('offline',this)"><span class="nav-icon">📱</span><span class="nav-text">Offline</span></button>
</nav>

<div class="app">

<div class="player-wrap">
 <div class="player">
  <iframe id="youtube-player" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
  <iframe id="tiktok-player" style="display:none" allow="fullscreen; autoplay" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  <video id="local-player" controls playsinline style="display:none"></video>
 </div>
 <div id="playerTitle" class="player-title">Select a video</div>
 <div class="controls">
  <button onclick="previousVideo()">⏮ Previous</button>
  <button onclick="playVideo()">▶ Play</button>
  <button onclick="pauseVideo()">⏸ Pause</button>
  <button onclick="nextVideo()">Next ⏭</button>
  <label>🔊 <input id="volume" class="volume" type="range" min="0" max="1" step=".05" value="1" oninput="setVolume(this.value)"></label>
 </div>
</div>

<div class="app-layout">
 <main class="page-content">
  <section id="youtubeTab" class="tab-panel active">
   <input id="youtubeSearch" class="search" placeholder="🔎 Search YouTube..." oninput="renderYouTube(this.value)">
   <div id="youtubeList" class="video-list"></div>
  </section>

  <section id="tiktokTab" class="tab-panel">
   <input id="tiktokSearch" class="search" placeholder="🔎 Search TikTok..." oninput="renderTikTok(this.value)">
   <div id="tiktokList" class="video-list"></div>
  </section>

  <section id="offlineTab" class="tab-panel">
   <div class="offline-tools">
    <label class="file-label">📁 Select Offline Videos
     <input id="localFiles" type="file" accept="video/*" multiple onchange="handleLocalFiles(event)">
    </label>
    <button class="clear-btn" onclick="clearLocalVideos()">🗑 Clear</button>
   </div>
   <div id="offlineList" class="video-list"></div>
  </section>
 </main>
</div>

<div class="history"><h3>Recently Played</h3><div id="historyList" class="video-list"></div></div>
</div>

<script>
const SHEET_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQfLCxJaz-eDFB7SGeROjZDepLOHg1ZggZhYf5kfWJc8S-l1H9frmOshuakfD7_4ocFZd2tvRvEaLN9/pub?gid=281133690&single=true&output=csv";

let sheetVideos=[],youtubeVideos=[],tiktokVideos=[];
let youtubeIndex=-1,tiktokIndex=-1,localVideos=[],localIndex=-1;
let activeTab="youtube",mode="",historyVideos=[];
let ytPlayer=null,ytReady=false;

function csvParse(text){
 const rows=[];let row=[],cell="",q=false;
 for(let i=0;i<text.length;i++){
  const c=text[i],n=text[i+1];
  if(c=='"'&&q&&n=='"'){cell+='"';i++;continue}
  if(c=='"'){q=!q;continue}
  if(c==','&&!q){row.push(cell.trim());cell="";continue}
  if((c=='\n'||c=='\r')&&!q){if(c=='\r'&&n=='\n')i++;row.push(cell.trim());cell="";if(row.some(x=>x))rows.push(row);row=[];continue}
  cell+=c;
 }
 if(cell||row.length){row.push(cell.trim());rows.push(row)}
 return rows;
}
function youtubeId(url){
 if(!url)return "";
 const m=String(url).match(/(?:v=|youtu\.be\/|youtube\.com\/shorts\/|youtube\.com\/embed\/)([A-Za-z0-9_-]{11})/);
 return m?m[1]:"";
}
async function loadSheet(){
 try{
  const res=await fetch(SHEET_URL);
  const text=await res.text();
  const rows=csvParse(text);
  sheetVideos=rows.slice(1).map(r=>({
   title:r[0]||"Untitled",url:r[1]||"",thumb:r[2]||"",id:r[3]||""
  })).filter(v=>v.url||v.id);
  youtubeVideos=[];tiktokVideos=[];
  sheetVideos.forEach(v=>{
   const isTik=/tiktok\.com/i.test(v.url)||/^\d+$/.test(v.id);
   if(isTik)tiktokVideos.push(v);
   else {v.id=youtubeId(v.url)||v.id;if(v.id)youtubeVideos.push(v)}
  });
  renderYouTube();renderTikTok();
 }catch(e){
  document.getElementById("youtubeList").innerHTML='<div class="empty">Unable to load Google Sheet.</div>';
  document.getElementById("tiktokList").innerHTML='<div class="empty">Unable to load Google Sheet.</div>';
 }
}
function loadYouTubeAPI(){
 if(document.getElementById("youtube-api"))return;
 const s=document.createElement("script");s.id="youtube-api";s.src="https://www.youtube.com/iframe_api";document.head.appendChild(s);
}
window.onYouTubeIframeAPIReady=function(){
 ytPlayer=new YT.Player("youtube-player",{videoId:"",playerVars:{autoplay:0,controls:1,rel:0,modestbranding:1},events:{
  onReady:()=>{ytReady=true},
  onStateChange:e=>{if(e.data===YT.PlayerState.ENDED&&mode==="youtube")nextVideo()}
 }});
};
function toggleSideNav(){
 document.body.classList.toggle("nav-closed");
}
function closeSideNav(){
 document.body.classList.add("nav-closed");
}
function openTab(tab,button){
 document.querySelectorAll(".tab-panel").forEach(x=>x.classList.remove("active"));
 document.querySelectorAll(".nav-item").forEach(x=>x.classList.remove("active"));
 document.getElementById(tab+"Tab").classList.add("active");button.classList.add("active");
 activeTab=tab;
}
function showPlayer(which){
 ["youtube-player","tiktok-player","local-player"].forEach(id=>document.getElementById(id).style.display="none");
 document.getElementById(which).style.display="block";
}
function playYouTube(v){
 mode="youtube";youtubeIndex=youtubeVideos.indexOf(v);showPlayer("youtube-player");
 if(ytReady)ytPlayer.loadVideoById(v.id);
 document.getElementById("playerTitle").textContent=v.title;addHistory(v);
}
function playTikTok(v){
 mode="tiktok";tiktokIndex=tiktokVideos.indexOf(v);showPlayer("tiktok-player");
 const iframe=document.getElementById("tiktok-player");
 const src="https://www.tiktok.com/player/v1/"+encodeURIComponent(v.id)+"?controls=1&description=1&music_info=1&loop=0";
 iframe.src="about:blank";setTimeout(()=>iframe.src=src,100);
 document.getElementById("playerTitle").textContent=v.title;addHistory(v);
}
function playLocal(i){
 mode="offline";localIndex=i;showPlayer("local-player");
 const p=document.getElementById("local-player");p.src=localVideos[i].url;p.volume=Number(document.getElementById("volume").value);
 p.play().catch(()=>{});document.getElementById("playerTitle").textContent=localVideos[i].title;
}
function playVideo(){
 if(mode==="youtube"&&ytReady)ytPlayer.playVideo();
 else if(mode==="offline")document.getElementById("local-player").play().catch(()=>{});
 else if(mode==="tiktok")postTikTok("play");
}
function pauseVideo(){
 if(mode==="youtube"&&ytReady)ytPlayer.pauseVideo();
 else if(mode==="offline")document.getElementById("local-player").pause();
 else if(mode==="tiktok")postTikTok("pause");
}
function postTikTok(action){
 const f=document.getElementById("tiktok-player");
 f.contentWindow?.postMessage({type:action},"*");
}
function nextVideo(){
 if(mode==="youtube"&&youtubeVideos.length){youtubeIndex=(youtubeIndex+1)%youtubeVideos.length;playYouTube(youtubeVideos[youtubeIndex])}
 else if(mode==="tiktok"&&tiktokVideos.length){tiktokIndex=(tiktokIndex+1)%tiktokVideos.length;playTikTok(tiktokVideos[tiktokIndex])}
 else if(mode==="offline"&&localVideos.length){localIndex=(localIndex+1)%localVideos.length;playLocal(localIndex)}
}
function previousVideo(){
 if(mode==="youtube"&&youtubeVideos.length){youtubeIndex=(youtubeIndex-1+youtubeVideos.length)%youtubeVideos.length;playYouTube(youtubeVideos[youtubeIndex])}
 else if(mode==="tiktok"&&tiktokVideos.length){tiktokIndex=(tiktokIndex-1+tiktokVideos.length)%tiktokVideos.length;playTikTok(tiktokVideos[tiktokIndex])}
 else if(mode==="offline"&&localVideos.length){localIndex=(localIndex-1+localVideos.length)%localVideos.length;playLocal(localIndex)}
}
function setVolume(v){
 const p=document.getElementById("local-player");p.volume=Number(v);
 if(ytReady)ytPlayer.setVolume(Number(v)*100);
}
function renderYouTube(q=""){
 const a=youtubeVideos.filter(v=>v.title.toLowerCase().includes(q.toLowerCase()));
 document.getElementById("youtubeList").innerHTML=a.length?a.map((v,i)=>{
  const thumb=v.thumb||`https://img.youtube.com/vi/${v.id}/hqdefault.jpg`;
  return `<div class="card" onclick='playYouTube(youtubeVideos[${youtubeVideos.indexOf(v)}])'><img class="thumb" src="${thumb}" onerror="this.src='https://img.youtube.com/vi/${v.id}/hqdefault.jpg'"><div class="card-title">${esc(v.title)}</div></div>`
 }).join(""):'<div class="empty">No YouTube videos found.</div>';
}
function renderTikTok(q=""){
 const a=tiktokVideos.filter(v=>v.title.toLowerCase().includes(q.toLowerCase()));
 document.getElementById("tiktokList").innerHTML=a.length?a.map(v=>`<div class="card" onclick='playTikTok(tiktokVideos[${tiktokVideos.indexOf(v)}])'>${v.thumb?`<img class="thumb" src="${esc(v.thumb)}">`:'<div class="thumb"></div>'}<div class="card-title">${esc(v.title)}</div></div>`).join(""):'<div class="empty">No TikTok videos found.</div>';
}
function handleLocalFiles(e){
 localVideos.forEach(v=>URL.revokeObjectURL(v.url));
 localVideos=Array.from(e.target.files).map(f=>({title:f.name,url:URL.createObjectURL(f),file:f}));
 localIndex=-1;renderOffline();
}
function renderOffline(){
 document.getElementById("offlineList").innerHTML=localVideos.length?localVideos.map((v,i)=>`<div class="card" onclick="playLocal(${i})"><video class="thumb" src="${v.url}" muted preload="metadata"></video><div class="card-title">${esc(v.title)}</div></div>`).join(""):'<div class="empty">Select local video files to play offline.</div>';
}
function clearLocalVideos(){
 localVideos.forEach(v=>URL.revokeObjectURL(v.url));localVideos=[];localIndex=-1;renderOffline();
 document.getElementById("localFiles").value="";
}
document.getElementById("local-player").addEventListener("ended",()=>{if(mode==="offline")nextVideo()});
function addHistory(v){
 const h={title:v.title,url:v.url||"",thumb:v.thumb||""};
 historyVideos=[h,...historyVideos.filter(x=>x.title!==h.title)].slice(0,10);
 renderHistory();
}
function renderHistory(){
 document.getElementById("historyList").innerHTML=historyVideos.length?historyVideos.map(v=>`<div class="card"><div class="card-title">${esc(v.title)}</div></div>`).join(""):'<div class="empty">No history yet.</div>';
}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
loadYouTubeAPI();loadSheet();renderOffline();renderHistory();
</script>
</body>
</html>

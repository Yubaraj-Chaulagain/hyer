<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitHub ZIP Storage</title><style>
body{font-family:Arial;margin:0;background:#f3f6fa}header{background:#111827;color:white;text-align:center;padding:24px}main{max-width:720px;margin:auto;padding:16px}.card{background:white;padding:18px;margin:14px 0;border-radius:16px;box-shadow:0 3px 12px #0001}input{width:100%;padding:13px;box-sizing:border-box;border:1px solid #ccd3dc;border-radius:10px;margin:5px 0}button,a{border:0;border-radius:10px;padding:12px 15px;margin:6px 4px 0 0;font-weight:bold;text-decoration:none;display:inline-block}.g{background:#16a34a;color:white}.b{background:#2563eb;color:white}.r{background:#dc2626;color:white}.s{background:#eef2ff;padding:12px;border-radius:10px;margin-top:10px;white-space:pre-wrap}.item{border:1px solid #ddd;border-radius:12px;padding:13px;margin-top:10px}.meta{font-size:13px;color:#64748b}
</style></head><body><header><h1>📦 GitHub ZIP Storage</h1>Upload · Update · Delete · Download</header><main>
<div class=card><h2>🔐 Admin Login</h2><input id=pin type=password placeholder="Admin PIN"><button class=b onclick=login()>Login</button><div id=ls class=s>PIN हालेर Login गर्नुहोस्।</div></div>
<div id=app style="display:none"><div class=card><b>Repository:</b> Yubaraj-Chaulagain/Zip-Stroge<br><small>🔒 GitHub token Apps Script server मा मात्र छ।</small></div>
<div class=card><h2>➕ Add ZIP</h2><input id=f type=file accept=.zip><button class=g onclick=upload()>⬆️ Upload ZIP</button><button onclick=load()>🔄 Refresh</button><div id=st class=s>Ready.</div></div>
<div class=card><h2>📁 Stored ZIP files</h2><input id=q placeholder="Search ZIP..." oninput=render()><div id=list>Loading...</div></div></div></main>
<script>
let PIN='',files=[];
function login(){PIN=pin.value.trim();ls.textContent='⏳ Checking...';google.script.run.withSuccessHandler(x=>{ls.textContent='✅ Login सफल';app.style.display='block';load()}).withFailureHandler(e=>{PIN='';ls.textContent='❌ '+e.message}).listFiles(PIN)}
function load(){st.textContent='⏳ Loading...';google.script.run.withSuccessHandler(x=>{files=x||[];render();st.textContent='✅ ZIP files: '+files.length}).withFailureHandler(e=>st.textContent='❌ '+e.message).listFiles(PIN)}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sz(n){if(!n)return'0 B';let u=['B','KB','MB','GB'],i=Math.floor(Math.log(n)/Math.log(1024));return(n/1024**i).toFixed(i?2:0)+' '+u[i]}
function render(){let a=files.filter(x=>x.name.toLowerCase().includes(q.value.toLowerCase()));list.innerHTML=a.length?a.map(x=>{let i=files.indexOf(x);return `<div class=item><b>📦 ${esc(x.name)}</b><div class=meta>${sz(x.size)} · SHA ${esc(x.sha.slice(0,10))}...</div><a class=g href="${esc(x.download_url)}" target=_blank>📥 Download</a><button class=b onclick="upd(${i})">🔄 Update</button><button class=r onclick="del(${i})">🗑️ Delete</button></div>`}).join(''):'<p>No ZIP files found.</p>'}
function b64(f,cb){let r=new FileReader();r.onload=()=>cb(r.result.split(',')[1]);r.readAsDataURL(f)}
function upload(){let f1=f.files[0];if(!f1)return st.textContent='पहिले ZIP छान्नुहोस्।';st.textContent='⏳ Uploading...';b64(f1,b=>google.script.run.withSuccessHandler(x=>{st.textContent='✅ '+x;f.value='';load()}).withFailureHandler(e=>st.textContent='❌ '+e.message).uploadZip(PIN,f1.name,b))}
function upd(i){let old=files[i],p=document.createElement('input');p.type='file';p.accept='.zip';p.onchange=()=>{let f1=p.files[0];if(!f1)return;st.textContent='⏳ Updating...';b64(f1,b=>google.script.run.withSuccessHandler(x=>{st.textContent='✅ '+x;load()}).withFailureHandler(e=>st.textContent='❌ '+e.message).updateZip(PIN,old.path,old.sha,f1.name,b))};p.click()}
function del(i){let x=files[i];if(!confirm('Delete '+x.name+' ?'))return;st.textContent='⏳ Deleting...';google.script.run.withSuccessHandler(x=>{st.textContent='✅ '+x;load()}).withFailureHandler(e=>st.textContent='❌ '+e.message).deleteZip(PIN,x.path,x.sha)}
</script></body></html>

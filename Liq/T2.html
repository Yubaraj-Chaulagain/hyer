*{box-sizing:border-box}body{font-family:Arial;margin:0;padding:8px;background:#f4f6f8;color:#222}.container{max-width:900px;margin:auto;background:#fff;padding:14px;border-radius:12px}h2{text-align:center}.tabs{display:flex;gap:7px;margin-bottom:12px}.tabs button{flex:1;padding:11px;border:0;border-radius:8px;font-weight:bold}.activeTab{background:#1976d2!important;color:#fff}.panel{display:none}.show{display:block}.search{display:flex;gap:7px}.search input{flex:1;padding:12px;font-size:16px;border:1px solid #bbb;border-radius:8px}.search button{width:55px;font-size:22px}.tableWrap{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ccc;padding:8px;text-align:left;vertical-align:top}th{background:#eee}.answerBtn{margin-top:6px;padding:6px;border:1px solid #bbb;border-radius:5px}.top{display:flex;justify-content:space-between;align-items:center}.badge{background:#eef2f7;padding:8px;border-radius:8px;font-weight:bold}.timer{font-size:25px;font-weight:bold;color:#d32f2f}.progress{height:8px;background:#ddd;border-radius:8px;margin:10px 0 16px}.progress div{height:100%;background:#1976d2}.question{font-size:21px;font-weight:bold;line-height:1.4}.answer{width:100%;min-height:125px;padding:12px;font-size:17px;border:1px solid #aaa;border-radius:9px}.buttons{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}button{cursor:pointer}.btn{padding:11px 14px;border:0;border-radius:8px;font-size:15px}.primary{background:#1976d2;color:white}.dark{background:#555;color:white}.gray{background:#eee}.result{display:none;margin-top:12px;padding:14px;border-radius:9px;text-align:center}.correct{display:block;background:#e8f5e9;border:2px solid #43a047;color:#1b5e20}.wrong{display:block;background:#ffebee;border:2px solid #e53935;color:#b71c1c}.signal{font-size:55px}.ca{margin-top:9px;padding:10px;background:#fff;text-align:left;color:#222;border-radius:7px}.score{text-align:center;padding:20px}.hidden{display:none}@media(max-width:600px){h2{font-size:20px}.question{font-size:18px}.answer{font-size:16px}}
</style></head><body><div class="container"><h2>Food Packaging Helper Interview</h2><div class="tabs"><button id="tabQ" class="activeTab" onclick="show('q')">📋 Questions & Answers</button><button id="tabZ" onclick="show('z')">🎯 Interview Quiz</button></div><div id="questionsPanel" class="panel show"><div class="search"><input id="s" placeholder="Type or speak to search..." onkeyup="filterQ()"><button onclick="voiceSearch()">🎤</button></div><div class="tableWrap"><table><thead><tr><th>No</th><th>Question</th><th>Sample Answer</th></tr></thead><tbody id="rows"></tbody></table></div></div><div id="quizPanel" class="panel"><div id="quizArea"><div class="top"><div class="badge" id="counter"></div><div class="timer" id="timerEl">01:00</div></div><div class="progress"><div id="progress"></div></div><div class="question" id="question"></div><textarea id="answer" class="answer" placeholder="Type your answer here..."></textarea><div class="buttons"><button class="btn gray" onclick="voiceAnswer()">🎤 Speak Answer</button><button class="btn primary" id="submit" onclick="check()">Submit Answer</button><button class="btn dark" id="next" onclick="nextQ()" disabled>Next Question ➜</button></div><div id="result" class="result"></div></div><div id="scoreArea" class="score hidden"><div class="signal">🏁</div><h3>Quiz Completed</h3><p id="scoreText"></p><button class="btn primary" onclick="restart()">🔄 Restart Quiz</button></div></div></div><script>
const questions=[{"no": "1", "q": "Tell me about yourself", "a": "I am hardworking, follow hygiene rules, and ready for packaging work in shifts."}, {"no": "2", "q": "Why do you want this job?", "a": "I want stable work and I am interested in factory packaging work."}, {"no": "3", "q": "Why Luxembourg?", "a": "It is good for work opportunities and career growth."}, {"no": "4", "q": "What is food packaging?", "a": "It is the process of packing food safely for storage and transport."}, {"no": "5", "q": "What experience do you have?", "a": "I have basic factory/packing experience and I learn quickly."}, {"no": "6", "q": "What is hygiene in packaging?", "a": "Keeping food clean and safe from contamination."}, {"no": "7", "q": "How do you handle repetitive work?", "a": "I stay focused and maintain consistency."}, {"no": "8", "q": "Are you ready for shift work?", "a": "Yes, I am flexible for all shifts."}, {"no": "9", "q": "What is FIFO?", "a": "First In First Out method for stock management."}, {"no": "10", "q": "What is contamination?", "a": "Mixing harmful substances with food."}, {"no": "11", "q": "Why is teamwork important?", "a": "It increases efficiency and reduces mistakes."}, {"no": "12", "q": "What will you do if product is damaged?", "a": "I will report and separate it."}, {"no": "13", "q": "What PPE do you use?", "a": "Gloves, mask, apron, and safety shoes."}, {"no": "14", "q": "How do you ensure quality?", "a": "By checking each item carefully."}, {"no": "15", "q": "What is your strength?", "a": "Hardworking and disciplined."}, {"no": "16", "q": "What is your weakness?", "a": "I am improving perfection habits."}, {"no": "17", "q": "How do you handle pressure?", "a": "I stay calm and organized."}, {"no": "18", "q": "What is labeling?", "a": "Marking product details correctly."}, {"no": "19", "q": "What is expiry date check?", "a": "Checking product validity before packing."}, {"no": "20", "q": "What is packaging material?", "a": "Plastic, paper, boxes used for stem?", "a": "Informing supervisor about issues."}, {"no": "44", "q": "What is food safety?", "a": "Keeping food safe for consumption."}, {"no": "45", "q": "What is inspection?", "a": "Checking quality and errors."}, {"no": "46", "q": "What is storage system?", "a": "Proper arrangement of goods."}, {"no": "47", "q": "What is shift rotation?", "a": "Changing work shifts."}, {"no": "48", "q": "What is supervisor role?", "a": "Managing workers and quality."}, {"no": "49", "q": "What is your goal?", "a": "To work and support my family."}, {"no": "50", "q": "Any experience abroad?", "a": "No but I am ready to learn."}, {"no": "51", "q": "Tell me about your family.", "a": "There are five members in my family. My father is a farmer, my mother is a homemaker, and I have one brother and one sister. I want to support my family."}, {"no": "52", "q": "Are you married?", "a": "No, I am not married."}, {"no": "53", "q": "Who will support your family while you work abroad?", "a": "My family members will support each other, and I will also support them financially."}, {"no": "54", "q": "Why do you want to work abroad?", "a": "I want to earn a better income, improve my skills, and provide a better future for my family."}, {"no": "55", "q": "Will your family support your decision?", "a": "Yes, my family fully supports my decision to work abroad."}, {"no": "56", "q": "Do you have children?", "a": "No, I do not have children."}, {"no": "57", "q": "Who depends on your income?", "a": "My parents and family depend on my income, so I want to work hard and support them."}, {"no": "58", "q": "Can you stay away from your family for work?", "a": "Yes. I will miss my family, but I understand that working abroad is important for our future."}, {"no": "59", "q": "How often will you contact your family?", "a": "I will contact them regularly during my free time."}, {"no": "60", "q": "What is your biggest motivation?", "a": "My biggest motivation is to give my family a better life and build a successful career."}, {"no": "61", "q": "What are your hobbies?", "a": "My hobbies are playing football, listening to music, and learning new skills."}, {"no": "62", "q": "Why do you like your hobbies?", "a": "They help me stay active, reduce stress, and improve my focus."}, {"no": "63", "q": "How do your hobbies help you at work?", "a": "They improve my discipline, teamwork, and concentration."}, {"no": "64", "q": "What do you do in your free time?", "a": "I spend time with my family, exercise, and learn new things."}, {"no": "65", "q": "Do you enjoy working with others?", "a": "Yes. I enjoy teamwork because we can complete work faster and help each other."}, {"no": "66", "q": "Why should we hire you?", "a": "I am hardworking, honest, punctual, and willing to learn. I always follow safety and hygiene rules."}, {"no": "67", "q": "What are your strengths?", "a": "My strengths are discipline, teamwork, quick learning, and responsibility."}, {"no": "68", "q": "What is your biggest weakness?", "a": "Sometimes I focus too much on details, but I am learning to manage my time better."}, {"no": "69", "q": "Where do you see yourself in 5 years?", "a": "I see myself as an experienced and trusted employee, growing with the company."}, {"no": "70", "q": "Can you work under pressure?", "a": "Yes. I stay calm, follow instructions, and complete my work carefully."}, {"no": "71", "q": "How do you deal with mistakes?", "a": "I admit my mistake, report it if necessary, and learn from it to avoid repeating it."}, {"no": "72", "q": "Are you willing to work overtime?", "a": "Yes, I am willing to work overtime if required by the company."}, {"no": "73", "q": "Why did you leave your previous job?", "a": "I wanted better career opportunities and professional growth."}, {"no": "74", "q": "How do you handle conflict with a co-worker?", "a": "I stay respectful, communicate calmly, and work together to solve the problem."}, {"no": "75", "q": "Do you have any questions for us?", "a": "Yes. I would like to know about the training process, work schedule, and opportunities for growth."}, {"no": "76", "q": "Do you like football?", "a": "Yes, I enjoy watching and playing football in my free time."}, {"no": "77", "q": "Who is your favorite football player?", "a": "My favorite football player is Cristiano Ronaldo because of his hard work, discipline, and dedication."}, {"no": "78", "q": "Why do you like Cristiano Ronaldo?", "a": "He is hardworking, disciplined, and never gives up. He inspires me to work hard."}, {"no": "79", "q": "Do you play football?", "a": "Yes, I play football for fitness and teamwork."}, {"no": "80", "q": "What can football teach you?", "a": "Football teaches teamwork, discipline, communication, and hard work."}, {"no": "81", "q": "Who is the greatest football player in your opinion?", "a": "In my opinion, Cristiano Ronaldo is one of the greatest football players because of his achievements and work ethic."}, {"no": "82", "q": "Who is Lionel Messi?", "a": "Lionel Messi is one of the world's greatest football players, known for his excellent dribbling, passing, and goal-scoring ability."}, {"no": "83", "q": "What is your favorite football team?", "a": "My favorite football team is Real Madrid."}, {"no": "84", "q": "Why do you like football?", "a": "Because it is exciting, improves fitness, and teaches teamwork and discipline."}, {"no": "85", "q": "How often do you play football?", "a": "I usually play football on weekends or during my free time."}, {"no": "86", "q": "What are your responsibilities?", "a": "My responsibility is to complete my work safely, follow company rules, maintain hygiene, and ensure quality packaging."}, {"no": "87", "q": "What responsibility did you have in your previous job?", "a": "I was responsible for packing products, checking quality, labeling items, and keeping the work area clean."}, {"no": "88", "q": "How do you handle responsibility?", "a": "I take responsibility seriously, complete tasks on time, and always try to do my best."}, {"no": "89", "q": "What will you do if your supervisor gives you a new responsibility?", "a": "I will listen carefully, ask questions if needed, and complete the task responsibly."}, {"no": "90", "q": "Why is responsibility important at work?", "a": "Responsibility helps maintain safety, quality, teamwork, and trust in the workplace."}, {"no": "91", "q": "Are you married?", "a": "Yes, I am married. / No, I am single."}, {"no": "92", "q": "Do you have children?", "a": "Yes, I have ___ child(ren). / No, I don't have any children."}, {"no": "93", "q": "Do you plan to bring your family to Luxembourg?", "a": "At first, I plan to come alone and focus on my job. Once I am settled and financially stable, I will decide about bringing my family."}, {"no": "94", "q": "Can you stay in Luxembourg for a long time?", "a": "Yes. I am looking for a long-term opportunity and I am committed to working and building my career in Luxembourg."}, {"no": "95", "q": "Will your family support your decision to work abroad?", "a": "Yes, my family fully supports my decision to work in Luxembourg."}];
const tbody=document.getElementById('rows');
questions.forEach(x=>{let tr=document.createElement('tr');tr.innerHTML='<td>'+esc(x.no)+'</td><td>'+esc(x.q)+'</td><td>'+esc(x.a)+'<br><button class="answerBtn" onclick="speak('+JSON.stringify(x.a)+')">🔊 Listen Answer</button></td>';tbody.appendChild(tr)});
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function filterQ(){let v=s.value.toLowerCase().trim();[...tbody.rows].forEach(r=>r.style.display=r.innerText.toLowerCase().includes(v)?'':'none')}
function voiceSearch(){let R=SpeechRecognition||webkitSpeechRecognition;if(!R)return alert('Please use Google Chrome.');let r=new R;r.lang='en-US';r.onresult=e=>{s.value=e.results[0][0].transcript;filterQ()};r.start()}
function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';speechSynthesis.speak(u)}
function show(p){questionsPanel.classList.toggle('show',p==='q');quizPanel.classList.toggle('show',p==='z');tabQ.classList.toggle('activeTab',p==='q');tabZ.classList.toggle('activeTab',p==='z');if(p==='z'&&!started)start()}
let i=0,ok=0,bad=0,left=60,done=false,timer,started=false;
function start(){started=true;i=0;ok=0;bad=0;load()}
function norm(x){return String(x).toLowerCase().replace(/[.,!?;:()[\]{}"'’`]/g,' ').replace(/\s+/g,' ').trim()}
function sim(u,e){u=norm(u);e=norm(e);if(!u||!e)return 0;if(u===e||u.includes(e)||e.includes(u))return 1;let a=new Set(u.split(' ').filter(x=>x.length>1)),b=new Set(e.split(' ').filter(x=>x.length>1)),c=0;a.forEach(w=>{if(b.has(w))c++});return .75*c/Math.max(b.size,1)+.25*c/Math.max(a.size,1)}
function load(){clearInterval(timer);done=false;left=60;let x=questions[i];counter.textContent=`Question ${i+1} of ${questions.length}`;question.textContent=x.q;answer.value='';answer.disabled=false;submit.disabled=false;next.disabled=true;result.className='result';result.innerHTML='';progress.style.width=(i/questions.length*100)+'%';tick();timer=setInterval(()=>{left--;tick();if(left<=0){clearInterval(timer);timeout()}},1000)}
function tick(){timerEl.textContent='01:'+String(left).padStart(2,'0')}
function showR(g,title){done=true;clearInterval(timer);answer.disabled=true;submit.disabled=true;next.disabled=false;result.className='result '+(g?'correct':'wrong');result.innerHTML='<div class="signal">'+(g?'✓':'✕')+'</div><b>'+title+'</b><div class="ca"><b>Correct Answer:</b><br>'+esc(questions[i].a)+'</div>'}
function check(){if(done)return;let u=answer.value.trim();if(!u)return alert('Please give your answer first.');let g=sim(u,questions[i].a)>=.52;g?ok++:bad++;showR(g,g?'Correct Answer!':'Wrong Answer')}
function timeout(){if(done)return;bad++;showR(false,'⏰ Time Up!')}
function nextQ(){if(!done)return;i++;if(i>=questions.length)return finish();load()}
function finish(){clearInterval(timer);quizArea.classList.add('hidden');scoreArea.classList.remove('hidden');scoreText.innerHTML=`Total Questions: <b>${questions.length}</b><br>Correct: <b>${ok}</b> | Wrong: <b>${bad}</b><br>Score: <b>${Math.round(ok/questions.length*100)}%</b>`}
function restart(){scoreArea.classList.add('hidden');quizArea.classList.remove('hidden');i=0;ok=0;bad=0;load()}
function voiceAnswer(){let R=SpeechRecognition||webkitSpeechRecognition;if(!R)return alert('Please use Google Chrome.');let r=new R;r.lang='en-US';r.onresult=e=>answer.value=e.results[0][0].transcript;r.start()}
</script></body></html>

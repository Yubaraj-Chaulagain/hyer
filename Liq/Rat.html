<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YouTube + Browser</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

/* =========================
   MAIN APP TABS
========================= */

.app-tabs{
    display:flex;
    background:#181818;
    border-bottom:1px solid #333;
    position:sticky;
    top:0;
    z-index:1000;
}

.app-tab{
    flex:1;
    padding:15px 10px;
    border:0;
    background:#181818;
    color:#aaa;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.app-tab.active{
    background:#252525;
    color:#fff;
    border-bottom:3px solid #ff0000;
}

.app-page{
    display:none;
}

.app-page.active{
    display:block;
}

/* =========================
   COMMON
========================= */

.container{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:12px;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #444;
    border-radius:8px;
    background:#1e1e1e;
    color:#fff;
    outline:none;
}

button{
    border:0;
    border-radius:8px;
    padding:10px 13px;
    background:#292929;
    color:#fff;
    cursor:pointer;
}

button:hover{
    background:#3a3a3a;
}

.row{
    display:flex;
    gap:8px;
    margin-bottom:10px;
}

.row input{
    flex:1;
}

/* =========================
   YOUTUBE
========================= */

.youtube-player-box{
    width:100%;
    background:#000;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:10px;
}

#youtubePlayer{
    width:100%;
    aspect-ratio:16/9;
}

#localPlayer{
    display:none;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
}

.youtube-controls{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin:10px 0;
}

.youtube-controls button{
    min-width:55px;
}

.seek-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin:8px 0;
}

.seek-row input{
    padding:0;
}

.volume-row{
    display:flex;
    align-items:center;
    gap:10px;
}

.volume-row input{
    width:150px;
    padding:0;
}

.section{
    background:#181818;
    border-radius:10px;
    padding:12px;
    margin-top:12px;
}

.section-title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

.video-list{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:10px;
}

.video-card{
    background:#222;
    border-radius:8px;
    overflow:hidden;
    cursor:pointer;
    border:1px solid transparent;
}

.video-card:hover{
    border-color:#555;
}

.video-card img{
    width:100%;
    display:block;
    aspect-ratio:16/9;
    object-fit:cover;
    background:#000;
}

.video-info{
    padding:8px;
}

.video-title{
    font-size:14px;
    line-height:1.35;
}

.small{
    color:#aaa;
    font-size:12px;
}

.file-label{
    display:inline-block;
    padding:10px 13px;
    background:#292929;
    border-radius:8px;
    cursor:pointer;
}

#localFile{
    display:none;
}

.local-list{
    margin-top:10px;
}

.local-item{
    padding:10px;
    background:#222;
    border-radius:7px;
    margin-bottom:6px;
    cursor:pointer;
}

.local-item.active{
    background:#333;
    border-left:3px solid #ff0000;
}

/* =========================
   BROWSER
========================= */

.browser-toolbar{
    background:#181818;
    padding:10px;
    position:sticky;
    top:52px;
    z-index:900;
}

.browser-buttons{
    display:flex;
    gap:6px;
    margin-bottom:8px;
}

.browser-buttons button{
    min-width:42px;
}

.address-row{
    display:flex;
    gap:7px;
}

.address-row input{
    flex:1;
}

.browser-frame-wrap{
    width:100%;
    height:calc(100vh - 155px);
    min-height:500px;
    background:#fff;
    position:relative;
}

#browserFrame{
    width:100%;
    height:100%;
    border:0;
    background:#fff;
}

.browser-info{
    background:#222;
    color:#aaa;
    padding:8px 10px;
    font-size:12px;
}

.bookmark-list,
.history-list{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.bookmark-item,
.history-item{
    background:#242424;
    padding:8px 10px;
    border-radius:7px;
    cursor:pointer;
    font-size:13px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .app-tab{
        font-size:14px;
        padding:13px 5px;
    }

    .container{
        padding:8px;
    }

    .video-list{
        grid-template-columns:repeat(2,1fr);
        gap:7px;
    }

    .video-title{
        font-size:12px;
    }

    .youtube-controls button{
        flex:1;
        min-width:70px;
    }

    .browser-frame-wrap{
        height:calc(100vh - 175px);
        min-height:450px;
    }
}
</style>
</head>

<body>

<!-- =========================
     MAIN TABS
========================= -->

<div class="app-tabs">

    <button id="youtubeTabButton"
            class="app-tab active"
            onclick="switchAppTab('youtube')">
        📺 YouTube
    </button>

    <button id="browserTabButton"
            class="app-tab"
            onclick="switchAppTab('browser')">
        🌐 Browser
    </button>

</div>


<!-- =========================================================
     YOUTUBE TAB
========================================================= -->

<div id="youtubeTab" class="app-page active">

<div class="container">

    <div class="section">

        <div class="section-title">
            📺 YouTube Player
        </div>

        <div class="row">

            <input
                id="youtubeUrl"
                type="text"
                placeholder="Paste YouTube URL..."
            >

            <button onclick="loadManualYouTube()">
                Load
            </button>

        </div>

        <div class="youtube-player-box">

            <div id="youtubePlayer"></div>

            <video
                id="localPlayer"
                controls
                playsinline>
            </video>

        </div>

        <!-- YouTube / Local Controls -->

        <div class="youtube-controls">

            <button onclick="previousVideo()">
                ⏮ Previous
            </button>

            <button onclick="seekVideo(-10)">
                ↶ -10
            </button>

            <button onclick="playVideo()">
                ▶ Play
            </button>

            <button onclick="pauseVideo()">
                ⏸ Pause
            </button>

            <button onclick="seekVideo(10)">
                +10 ↷
            </button>

            <button onclick="nextVideo()">
                Next ⏭
            </button>

            <button onclick="stopVideo()">
                ⏹ Stop
            </button>

        </div>

        <div class="volume-row">

            🔊

            <input
                id="volumeSlider"
                type="range"
                min="0"
                max="100"
                value="100"
                oninput="changeVolume(this.value)"
            >

        </div>

    </div>


    <!-- =========================
         GOOGLE SHEET
    ========================= -->

    <div class="section">

        <div class="section-title">
            📋 Google Sheet Videos
        </div>

        <div class="row">

            <input
                id="sheetSearch"
                type="text"
                placeholder="Search videos..."
                oninput="searchSheetVideos()"
            >

            <button onclick="loadSheetVideos()">
                🔄 Refresh
            </button>

        </div>

        <div id="sheetStatus" class="small">
            Loading...
        </div>

        <div id="sheetList" class="video-list"></div>

    </div>


    <!-- =========================
         LOCAL MOBILE VIDEOS
    ========================= -->

    <div class="section">

        <div class="section-title">
            📱 Mobile / Offline Videos
        </div>

        <label class="file-label">
            ➕ Select Videos
            <input
                id="localFile"
                type="file"
                multiple
                accept="video/*"
                onchange="loadLocalVideos(event)"
            >
        </label>

        <div class="small" style="margin-top:8px;">
            Selected local videos can play offline while this page is available.
        </div>

        <div id="localList" class="local-list"></div>

    </div>

</div>

</div>


<!-- =========================================================
     BROWSER TAB
========================================================= -->

<div id="browserTab" class="app-page">

    <div class="browser-toolbar">

        <div class="browser-buttons">

            <button onclick="browserBack()">
                ◀
            </button>

            <button onclick="browserForward()">
                ▶
            </button>

            <button onclick="browserRefresh()">
                🔄
            </button>

            <button onclick="browserHome()">
                🏠
            </button>

            <button onclick="addBookmark()">
                ⭐
            </button>

            <button onclick="showBrowserHistory()">
                🕘
            </button>

        </div>

        <div class="address-row">

            <input
                id="browserUrl"
                type="text"
                placeholder="Search Google or enter URL..."
                onkeydown="browserEnter(event)"
            >

            <button onclick="navigateBrowser()">
                Go
            </button>

        </div>

    </div>


    <div class="browser-info">
        🌐 Mini Browser — Some websites may refuse to open inside an iframe because of their security policy.
    </div>


    <div class="browser-frame-wrap">

        <iframe
            id="browserFrame"
            src="https://www.google.com"
            allowfullscreen>
        </iframe>

    </div>


    <div class="container">

        <div class="section">

            <div class="section-title">
                ⭐ Bookmarks
            </div>

            <div id="bookmarkList"
                 class="bookmark-list">
            </div>

        </div>


        <div class="section">

            <div class="section-title">
                🕘 Browser History
            </div>

            <div id="historyList"
                 class="history-list">
            </div>

        </div>

    </div>

</div>


<!-- =========================================================
     YOUTUBE API
========================================================= -->

<script src="https://www.youtube.com/iframe_api"></script>

<script>

/* =========================================================
   MAIN APP TABS
========================================================= */

function switchAppTab(tab){

    const youtubePage =
        document.getElementById("youtubeTab");

    const browserPage =
        document.getElementById("browserTab");

    const youtubeButton =
        document.getElementById("youtubeTabButton");

    const browserButton =
        document.getElementById("browserTabButton");

    if(tab === "youtube"){

        youtubePage.classList.add("active");
        browserPage.classList.remove("active");

        youtubeButton.classList.add("active");
        browserButton.classList.remove("active");

    }else{

        browserPage.classList.add("active");
        youtubePage.classList.remove("active");

        browserButton.classList.add("active");
        youtubeButton.classList.remove("active");

    }
}


/* =========================================================
   GOOGLE SHEET
========================================================= */

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQfLCxJaz-eDFB7SGeROjZDepLOHg1ZggZhYf5kfWJc8S-l1H9frmOshuakfD7_4ocFZd2tvRvEaLN9/pub?gid=281133690&single=true&output=csv";


let sheetVideos = [];
let filteredSheetVideos = [];

let currentIndex = -1;

let player = null;

let youtubeReady = false;

let currentMode = "youtube";

let localVideos = [];
let localIndex = -1;


/* =========================================================
   YOUTUBE API READY
========================================================= */

function onYouTubeIframeAPIReady(){

    player = new YT.Player("youtubePlayer",{

        width:"100%",

        height:"100%",

        videoId:"",

        playerVars:{
            autoplay:0,
            controls:1,
            rel:0,
            modestbranding:1,
            playsinline:1
        },

        events:{
            onReady:onPlayerReady,
            onStateChange:onPlayerStateChange
        }

    });

}


/* =========================================================
   PLAYER READY
========================================================= */

function onPlayerReady(){

    youtubeReady = true;

    const volume =
        document.getElementById("volumeSlider").value;

    player.setVolume(Number(volume));

    loadSheetVideos();
}


/* =========================================================
   PLAYER STATE
========================================================= */

function onPlayerStateChange(event){

    if(event.data === YT.PlayerState.ENDED){

        if(currentMode === "youtube"){

            nextVideo();

        }

    }

}


/* =========================================================
   EXTRACT YOUTUBE ID
========================================================= */

function extractVideoID(url){

    if(!url) return null;

    url = url.trim();

    if(/^[a-zA-Z0-9_-]{11}$/.test(url)){
        return url;
    }

    try{

        const u = new URL(url);

        if(u.hostname.includes("youtu.be")){

            const id =
                u.pathname.split("/").filter(Boolean)[0];

            return /^[a-zA-Z0-9_-]{11}$/.test(id)
                ? id
                : null;
        }

        if(u.searchParams.get("v")){

            const id =
                u.searchParams.get("v");

            return /^[a-zA-Z0-9_-]{11}$/.test(id)
                ? id
                : null;
        }

        const parts =
            u.pathname.split("/").filter(Boolean);

        const index =
            parts.findIndex(x =>
                ["embed","shorts","live"].includes(x)
            );

        if(index !== -1){

            const id = parts[index + 1];

            return /^[a-zA-Z0-9_-]{11}$/.test(id)
                ? id
                : null;
        }

    }catch(e){}

    return null;
}


/* =========================================================
   MANUAL YOUTUBE
========================================================= */

function loadManualYouTube(){

    const url =
        document.getElementById("youtubeUrl").value;

    const id =
        extractVideoID(url);

    if(!id){

        alert("❌ Valid YouTube video URL not found.");

        return;
    }

    currentMode = "youtube";

    showYouTubePlayer();

    const index =
        sheetVideos.findIndex(v =>
            extractVideoID(v.url) === id
        );

    if(index !== -1){

        currentIndex = index;

    }else{

        currentIndex = -1;

    }

    if(player && youtubeReady){

        player.loadVideoById(id);

        addVideoHistory(
            sheetVideos[index]?.title || "YouTube Video",
            id
        );

    }

}


/* =========================================================
   SHOW YOUTUBE PLAYER
========================================================= */

function showYouTubePlayer(){

    currentMode = "youtube";

    document.getElementById(
        "youtubePlayer"
    ).style.display = "block";

    document.getElementById(
        "localPlayer"
    ).style.display = "none";
}


/* =========================================================
   SHOW LOCAL PLAYER
========================================================= */

function showLocalPlayer(){

    currentMode = "local";

    document.getElementById(
        "youtubePlayer"
    ).style.display = "none";

    document.getElementById(
        "localPlayer"
    ).style.display = "block";
}


/* =========================================================
   LOAD SHEET
========================================================= */

async function loadSheetVideos(){

    const status =
        document.getElementById("sheetStatus");

    status.textContent =
        "Loading Google Sheet...";

    try{

        const response =
            await fetch(
                SHEET_URL + "&t=" + Date.now()
            );

        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );
        }

        const csv =
            await response.text();

        sheetVideos =
            parseCSV(csv);

        filteredSheetVideos =
            [...sheetVideos];

        renderVideos();

        status.textContent =
            sheetVideos.length +
            " videos loaded";

    }catch(error){

        console.error(error);

        status.textContent =
            "❌ Failed to load Google Sheet";

    }

}


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(text){

    const rows = [];

    let row = [];
    let cell = "";
    let insideQuotes = false;

    for(let i=0;i<text.length;i++){

        const char = text[i];
        const next = text[i+1];

        if(char === '"' && next === '"'){

            cell += '"';
            i++;
            continue;
        }

        if(char === '"'){

            insideQuotes =
                !insideQuotes;

            continue;
        }

        if(char === "," && !insideQuotes){

            row.push(cell.trim());
            cell = "";

        }else if(
            (char === "\n" || char === "\r")
            && !insideQuotes
        ){

            if(char === "\r" && next === "\n"){
                i++;
            }

            row.push(cell.trim());

            if(row.some(x => x !== "")){
                rows.push(row);
            }

            row = [];
            cell = "";

        }else{

            cell += char;

        }

    }

    if(cell || row.length){

        row.push(cell.trim());

        if(row.some(x => x !== "")){
            rows.push(row);
        }

    }

    if(rows.length <= 1){
        return [];
    }

    return rows
        .slice(1)
        .map(row => ({
            title:row[0] || "Untitled",
            url:row[1] || ""
        }))
        .filter(v => extractVideoID(v.url));

}


/* =========================================================
   RENDER SHEET VIDEOS
========================================================= */

function renderVideos(){

    const list =
        document.getElementById("sheetList");

    list.innerHTML = "";

    filteredSheetVideos.forEach(video => {

        const id =
            extractVideoID(video.url);

        if(!id) return;

        const originalIndex =
            sheetVideos.indexOf(video);

        const card =
            document.createElement("div");

        card.className =
            "video-card";

        card.onclick = function(){

            playSheetVideo(originalIndex);

        };

        card.innerHTML = `

            <img
                src="https://img.youtube.com/vi/${id}/hqdefault.jpg"
                loading="lazy"
                alt=""
            >

            <div class="video-info">

                <div class="video-title">
                    ${escapeHTML(video.title)}
                </div>

                <div class="small">
                    ▶ YouTube
                </div>

            </div>
        `;

        list.appendChild(card);

    });

}


/* =========================================================
   SEARCH SHEET
========================================================= */

function searchSheetVideos(){

    const q =
        document.getElementById(
            "sheetSearch"
        ).value
        .toLowerCase()
        .trim();

    filteredSheetVideos =
        sheetVideos.filter(video =>
            video.title
                .toLowerCase()
                .includes(q)
        );

    renderVideos();

}


/* =========================================================
   PLAY SHEET VIDEO
========================================================= */

function playSheetVideo(index){

    if(index < 0 ||
       index >= sheetVideos.length){
        return;
    }

    const video =
        sheetVideos[index];

    const id =
        extractVideoID(video.url);

    if(!id) return;

    currentIndex = index;

    currentMode = "youtube";

    showYouTubePlayer();

    document.getElementById(
        "youtubeUrl"
    ).value = video.url;

    if(player && youtubeReady){

        player.loadVideoById(id);

        addVideoHistory(
            video.title,
            id
        );

    }

}


/* =========================================================
   NEXT
========================================================= */

function nextVideo(){

    /* LOCAL */

    if(currentMode === "local"){

        if(localIndex + 1 < localVideos.length){

            localIndex++;

            playLocalVideo(localIndex);

        }

        return;
    }


    /* YOUTUBE */

    if(sheetVideos.length === 0){
        return;
    }

    if(currentIndex === -1){

        currentIndex = 0;

    }else{

        currentIndex++;

    }

    if(currentIndex >= sheetVideos.length){

        currentIndex = 0;
    }

    playSheetVideo(currentIndex);

}


/* =========================================================
   PREVIOUS
========================================================= */

function previousVideo(){

    if(currentMode === "local"){

        if(localIndex > 0){

            localIndex--;

            playLocalVideo(localIndex);

        }

        return;
    }

    if(sheetVideos.length === 0){
        return;
    }

    if(currentIndex <= 0){

        currentIndex =
            sheetVideos.length - 1;

    }else{

        currentIndex--;

    }

    playSheetVideo(currentIndex);

}


/* =========================================================
   PLAY
========================================================= */

function playVideo(){

    if(currentMode === "local"){

        const video =
            document.getElementById(
                "localPlayer"
            );

        video.play().catch(()=>{});

        return;
    }

    if(player && youtubeReady){

        player.playVideo();

    }

}


/* =========================================================
   PAUSE
========================================================= */

function pauseVideo(){

    if(currentMode === "local"){

        document
            .getElementById("localPlayer")
            .pause();

        return;
    }

    if(player && youtubeReady){

        player.pauseVideo();

    }

}


/* =========================================================
   STOP
========================================================= */

function stopVideo(){

    if(currentMode === "local"){

        const video =
            document.getElementById(
                "localPlayer"
            );

        video.pause();

        video.currentTime = 0;

        return;
    }

    if(player && youtubeReady){

        player.stopVideo();

    }

}


/* =========================================================
   SEEK
========================================================= */

function seekVideo(seconds){

    if(currentMode === "local"){

        const video =
            document.getElementById(
                "localPlayer"
            );

        video.currentTime =
            Math.max(
                0,
                Math.min(
                    video.duration || Infinity,
                    video.currentTime + seconds
                )
            );

        return;
    }

    if(player && youtubeReady){

        const current =
            player.getCurrentTime();

        player.seekTo(
            Math.max(0,current + seconds),
            true
        );

    }

}


/* =========================================================
   VOLUME
========================================================= */

function changeVolume(value){

    if(currentMode === "local"){

        document
            .getElementById("localPlayer")
            .volume =
            Number(value) / 100;

        return;
    }

    if(player && youtubeReady){

        player.setVolume(
            Number(value)
        );

    }

}


/* =========================================================
   LOCAL VIDEOS
========================================================= */

function loadLocalVideos(event){

    const files =
        Array.from(event.target.files || []);

    if(files.length === 0){
        return;
    }

    localVideos =
        files.map(file => ({

            name:file.name,

            url:URL.createObjectURL(file)

        }));

    localIndex = 0;

    renderLocalList();

    playLocalVideo(0);

}


function renderLocalList(){

    const list =
        document.getElementById(
            "localList"
        );

    list.innerHTML = "";

    localVideos.forEach((video,index)=>{

        const item =
            document.createElement("div");

        item.className =
            "local-item" +
            (index === localIndex
                ? " active"
                : "");

        item.textContent =
            "▶ " + video.name;

        item.onclick = function(){

            localIndex = index;

            playLocalVideo(index);

        };

        list.appendChild(item);

    });

}


function playLocalVideo(index){

    if(index < 0 ||
       index >= localVideos.length){
        return;
    }

    localIndex = index;

    showLocalPlayer();

    const video =
        document.getElementById(
            "localPlayer"
        );

    video.src =
        localVideos[index].url;

    video.load();

    video.play().catch(()=>{});

    renderLocalList();

}


/* =========================================================
   LOCAL AUTO NEXT
========================================================= */

document
    .getElementById("localPlayer")
    .addEventListener("ended",function(){

        if(currentMode !== "local"){
            return;
        }

        if(localIndex + 1 < localVideos.length){

            localIndex++;

            playLocalVideo(localIndex);

        }

    });


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   VIDEO HISTORY
========================================================= */

function addVideoHistory(title,id){

    try{

        let history =
            JSON.parse(
                localStorage.getItem(
                    "videoHistory"
                ) || "[]"
            );

        history.unshift({

            title:title,

            id:id,

            time:Date.now()

        });

        history =
            history.slice(0,50);

        localStorage.setItem(
            "videoHistory",
            JSON.stringify(history)
        );

    }catch(e){}

}


/* =========================================================
   BROWSER
========================================================= */

const HOME_URL =
    "https://www.google.com";

let browserHistory =
    JSON.parse(
        localStorage.getItem(
            "browserHistory"
        ) || "[]"
    );

let bookmarks =
    JSON.parse(
        localStorage.getItem(
            "browserBookmarks"
        ) || "[]"
    );


/* =========================================================
   NORMALIZE URL
========================================================= */

function normalizeBrowserURL(value){

    value = value.trim();

    if(!value){
        return HOME_URL;
    }

    if(
        value.startsWith("http://") ||
        value.startsWith("https://")
    ){

        return value;

    }

    if(
        value.includes(".") &&
        !value.includes(" ")
    ){

        return "https://" + value;

    }

    return "https://www.google.com/search?q=" +
        encodeURIComponent(value);

}


/* =========================================================
   BROWSER NAVIGATE
========================================================= */

function navigateBrowser(){

    const input =
        document.getElementById(
            "browserUrl"
        );

    const url =
        normalizeBrowserURL(
            input.value
        );

    input.value = url;

    document
        .getElementById("browserFrame")
        .src = url;

    addBrowserHistory(url);

}


function browserEnter(event){

    if(event.key === "Enter"){

        navigateBrowser();

    }

}


/* =========================================================
   BACK
========================================================= */

function browserBack(){

    try{

        document
            .getElementById("browserFrame")
            .contentWindow.history.back();

    }catch(e){}

}


/* =========================================================
   FORWARD
========================================================= */

function browserForward(){

    try{

        document
            .getElementById("browserFrame")
            .contentWindow.history.forward();

    }catch(e){}

}


/* =========================================================
   REFRESH
========================================================= */

function browserRefresh(){

    const frame =
        document.getElementById(
            "browserFrame"
        );

    try{

        frame.contentWindow.location.reload();

    }catch(e){

        frame.src = frame.src;

    }

}


/* =========================================================
   HOME
========================================================= */

function browserHome(){

    const frame =
        document.getElementById(
            "browserFrame"
        );

    frame.src =
        HOME_URL;

    document
        .getElementById("browserUrl")
        .value =
        HOME_URL;

    addBrowserHistory(
        HOME_URL
    );

}


/* =========================================================
   BOOKMARK
========================================================= */

function addBookmark(){

    const url =
        document
            .getElementById("browserUrl")
            .value
            .trim();

    if(!url){
        return;
    }

    if(!bookmarks.includes(url)){

        bookmarks.unshift(url);

        bookmarks =
            bookmarks.slice(0,30);

        localStorage.setItem(
            "browserBookmarks",
            JSON.stringify(bookmarks)
        );

    }

    renderBookmarks();

}


/* =========================================================
   RENDER BOOKMARKS
========================================================= */

function renderBookmarks(){

    const list =
        document.getElementById(
            "bookmarkList"
        );

    list.innerHTML = "";

    bookmarks.forEach(url=>{

        const item =
            document.createElement("div");

        item.className =
            "bookmark-item";

        item.textContent =
            "⭐ " + shortURL(url);

        item.onclick = function(){

            document
                .getElementById(
                    "browserUrl"
                ).value = url;

            document
                .getElementById(
                    "browserFrame"
                ).src = url;

            addBrowserHistory(url);

        };

        list.appendChild(item);

    });

}


/* =========================================================
   HISTORY
========================================================= */

function addBrowserHistory(url){

    browserHistory =
        browserHistory.filter(
            item => item !== url
        );

    browserHistory.unshift(url);

    browserHistory =
        browserHistory.slice(0,50);

    localStorage.setItem(
        "browserHistory",
        JSON.stringify(browserHistory)
    );

    renderHistory();

}


function renderHistory(){

    const list =
        document.getElementById(
            "historyList"
        );

    list.innerHTML = "";

    browserHistory
        .slice(0,20)
        .forEach(url=>{

            const item =
                document.createElement("div");

            item.className =
                "history-item";

            item.textContent =
                "🕘 " + shortURL(url);

            item.onclick = function(){

                document
                    .getElementById(
                        "browserUrl"
                    ).value = url;

                document
                    .getElementById(
                        "browserFrame"
                    ).src = url;

            };

            list.appendChild(item);

        });

}


function showBrowserHistory(){

    const section =
        document.getElementById(
            "historyList"
        );

    section.scrollIntoView({
        behavior:"smooth"
    });

}


function shortURL(url){

    try{

        const u =
            new URL(url);

        return u.hostname +
            u.pathname.substring(0,25);

    }catch(e){

        return url.substring(0,40);

    }

}


/* =========================================================
   BROWSER INITIALIZE
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        document
            .getElementById(
                "browserUrl"
            ).value =
            HOME_URL;

        renderBookmarks();

        renderHistory();

    }
);

</script>

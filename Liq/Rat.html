<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mini Browser + YouTube Player</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:#0b0b0b;
    color:white;
}

.app{
    max-width:1100px;
    margin:auto;
    padding:12px;
}

/* =========================
   BROWSER
========================= */

.browser-section{
    background:#151515;
    border-radius:12px;
    padding:10px;
    margin-bottom:18px;
}

.tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    margin-bottom:8px;
}

.tab{
    min-width:120px;
    max-width:180px;
    padding:9px 12px;
    background:#252525;
    border-radius:8px;
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.tab.active{
    background:#444;
}

.new-tab{
    min-width:45px;
    text-align:center;
    font-size:18px;
}

.toolbar{
    display:flex;
    gap:6px;
    align-items:center;
    margin-bottom:8px;
}

.toolbar button{
    background:#292929;
    color:white;
    border:none;
    border-radius:8px;
    padding:10px;
    cursor:pointer;
}

.toolbar input{
    flex:1;
    min-width:80px;
    padding:11px;
    background:#1b1b1b;
    color:white;
    border:1px solid #444;
    border-radius:8px;
}

.go-btn{
    background:#e50914 !important;
}

.browser-box{
    width:100%;
    height:55vh;
    background:white;
    border-radius:10px;
    overflow:hidden;
}

#browserFrame{
    width:100%;
    height:100%;
    border:0;
}

/* =========================
   PLAYER
========================= */

.section{
    background:#151515;
    padding:12px;
    border-radius:12px;
    margin-top:15px;
}

.section h2{
    margin-top:0;
}

.search-box{
    display:flex;
    gap:8px;
    margin-bottom:12px;
}

.search-box input{
    flex:1;
    padding:13px;
    background:#1b1b1b;
    color:white;
    border:1px solid #444;
    border-radius:8px;
}

.search-box button{
    padding:12px 18px;
    background:#e50914;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.player-box{
    width:100%;
    aspect-ratio:16/9;
    background:black;
    border-radius:10px;
    overflow:hidden;
}

#youtubePlayer,
#localPlayer{
    width:100%;
    height:100%;
}

#localPlayer{
    display:none;
    object-fit:contain;
    background:black;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin-top:12px;
}

.controls button{
    padding:11px 14px;
    border:none;
    border-radius:8px;
    background:#292929;
    color:white;
    cursor:pointer;
}

.controls button:hover{
    background:#e50914;
}

.volume-box{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:12px;
}

.volume-box input{
    flex:1;
}

.local-upload{
    display:inline-block;
    margin-top:12px;
    background:#075e54;
    padding:11px 15px;
    border-radius:8px;
    cursor:pointer;
}

.local-upload input{
    display:none;
}

/* =========================
   VIDEO LIST
========================= */

.video-search{
    width:100%;
    padding:12px;
    background:#1b1b1b;
    border:1px solid #444;
    border-radius:8px;
    color:white;
    margin-bottom:10px;
}

.status{
    color:#aaa;
    font-size:13px;
    margin-bottom:10px;
}

.video-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.video-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px;
    background:#202020;
    border-radius:8px;
    cursor:pointer;
}

.video-item:hover{
    background:#303030;
}

.video-item.active{
    border:2px solid #e50914;
}

.video-thumb{
    width:120px;
    aspect-ratio:16/9;
    object-fit:cover;
    border-radius:6px;
    background:black;
}

.video-info{
    flex:1;
    min-width:0;
}

.video-title{
    font-size:15px;
    font-weight:bold;
}

.video-type{
    color:#999;
    font-size:12px;
    margin-top:5px;
}

.list{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.list-item{
    display:flex;
    gap:8px;
    align-items:center;
    background:#202020;
    padding:9px;
    border-radius:8px;
}

.list-item span{
    flex:1;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    cursor:pointer;
}

.list-item button{
    background:#e50914;
    border:none;
    color:white;
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
}

@media(max-width:600px){

    .toolbar{
        flex-wrap:wrap;
    }

    .toolbar input{
        order:10;
        flex-basis:100%;
    }

    .browser-box{
        height:50vh;
    }

    .search-box{
        flex-direction:column;
    }

    .search-box button{
        width:100%;
    }

    .controls button{
        flex:1 1 30%;
    }

    .video-thumb{
        width:95px;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- =========================================
     MINI BROWSER
========================================= -->

<div class="browser-section">

    <div class="tabs" id="tabs"></div>

    <div class="toolbar">

        <button onclick="browserBack()">⬅</button>

        <button onclick="browserForward()">➡</button>

        <button onclick="browserRefresh()">🔄</button>

        <button onclick="browserHome()">🏠</button>

        <input
            id="browserAddress"
            type="text"
            placeholder="Search or enter website..."
            onkeydown="browserEnter(event)"
        >

        <button
            class="go-btn"
            onclick="browserGo()"
        >
            Go
        </button>

        <button onclick="addBookmark()">⭐</button>

    </div>

    <div class="browser-box">

        <iframe
            id="browserFrame"
            src="about:blank"
        ></iframe>

    </div>

</div>


<!-- =========================================
     BOOKMARKS
========================================= -->

<div class="section">

    <h2>⭐ Bookmarks</h2>

    <div
        id="bookmarkList"
        class="list"
    >
    </div>

</div>


<!-- =========================================
     YOUTUBE PLAYER
========================================= -->

<div class="section">

    <h2>▶ YouTube Pro Player</h2>

    <div class="search-box">

        <input
            type="text"
            id="youtubeUrl"
            placeholder="Paste YouTube Video URL or Video ID"
        >

        <button onclick="loadManualYouTube()">
            Load Video
        </button>

    </div>


    <div class="player-box">

        <div id="youtubePlayer"></div>

        <video
            id="localPlayer"
            playsinline
            preload="metadata"
        ></video>

    </div>


    <div class="controls">

        <button onclick="previousVideo()">
            ⏮ Previous
        </button>

        <button onclick="seekVideo(-10)">
            ⏪ -10 sec
        </button>

        <button onclick="playVideo()">
            ▶ Play
        </button>

        <button onclick="pauseVideo()">
            ⏸ Pause
        </button>

        <button onclick="seekVideo(10)">
            ⏩ +10 sec
        </button>

        <button onclick="nextVideo()">
            ⏭ Next
        </button>

        <button onclick="stopVideo()">
            ⏹ Stop
        </button>

    </div>


    <div class="volume-box">

        🔊

        <input
            id="volume"
            type="range"
            min="0"
            max="100"
            value="100"
            oninput="changeVolume(this.value)"
        >

        <span id="volumeText">
            100%
        </span>

    </div>


    <label class="local-upload">

        📱 Select Mobile Videos

        <input
            type="file"
            id="localFiles"
            accept="video/*"
            multiple
        >

    </label>

</div>


<!-- =========================================
     GOOGLE SHEET VIDEO LIST
========================================= -->

<div class="section">

    <h2>🎬 Google Sheet YouTube Videos</h2>

    <input
        type="text"
        id="videoSearch"
        class="video-search"
        placeholder="🔎 Search videos..."
        oninput="searchVideos()"
    >

    <div
        id="status"
        class="status"
    >
        Loading videos...
    </div>

    <div
        id="sheetList"
        class="video-list"
    >
    </div>

</div>


<!-- =========================================
     MOBILE VIDEO LIST
========================================= -->

<div class="section">

    <h2>📱 Mobile Videos</h2>

    <div
        id="localVideoList"
        class="video-list"
    >
        <p style="color:#888">
            No mobile videos selected.
        </p>
    </div>

</div>


<!-- =========================================
     HISTORY
========================================= -->

<div class="section">

    <h2>📜 Video History</h2>

    <div
        id="historyList"
        class="video-list"
    >
        <p style="color:#888">
            No videos played yet.
        </p>
    </div>

</div>

</div>


<!-- =========================================
     YOUTUBE API
========================================= -->

<script src="https://www.youtube.com/iframe_api"></script>


<script>

/* =====================================================
   GOOGLE SHEET CSV
===================================================== */

const CSV_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQfLCxJaz-eDFB7SGeROjZDepLOHg1ZggZhYf5kfWJc8S-l1H9frmOshuakfD7_4ocFZd2tvRvEaLN9/pub?gid=281133690&single=true&output=csv";


/* =====================================================
   BROWSER SYSTEM
===================================================== */

let browserTabs = [];

let activeBrowserTab = 0;


/* Create first tab */

browserTabs.push({

    title:"Home",

    url:"about:blank",

    history:["about:blank"],

    historyIndex:0

});


function renderTabs(){

    const box =
        document.getElementById("tabs");

    box.innerHTML = "";


    browserTabs.forEach(function(tab,index){

        const item =
            document.createElement("div");

        item.className =
            "tab";

        if(index === activeBrowserTab){

            item.classList.add("active");

        }


        item.textContent =
            tab.title;


        item.onclick =
            function(){

                activeBrowserTab = index;

                renderTabs();

                loadBrowserTab();

            };


        box.appendChild(item);

    });


    const plus =
        document.createElement("div");

    plus.className =
        "tab new-tab";

    plus.textContent =
        "+";

    plus.onclick =
        function(){

            browserTabs.push({

                title:"New Tab",

                url:"about:blank",

                history:["about:blank"],

                historyIndex:0

            });


            activeBrowserTab =
                browserTabs.length - 1;


            renderTabs();

            loadBrowserTab();

        };


    box.appendChild(plus);

}


function loadBrowserTab(){

    const tab =
        browserTabs[
            activeBrowserTab
        ];


    document
        .getElementById("browserAddress")
        .value =
        tab.url;


    document
        .getElementById("browserFrame")
        .src =
        tab.url;

}


function browserGo(){

    let value =
        document
        .getElementById("browserAddress")
        .value
        .trim();


    if(!value){

        return;

    }


    let url;


    if(
        value.startsWith("http://") ||
        value.startsWith("https://")
    ){

        url = value;

    }

    else if(
        value.includes(".") &&
        !value.includes(" ")
    ){

        url =
            "https://" +
            value;

    }

    else{

        url =
            "https://www.google.com/search?q=" +
            encodeURIComponent(value);

    }


    const tab =
        browserTabs[
            activeBrowserTab
        ];


    tab.history =
        tab.history.slice(
            0,
            tab.historyIndex + 1
        );


    tab.history.push(url);


    tab.historyIndex =
        tab.history.length - 1;


    tab.url = url;

    tab.title =
        value;


    renderTabs();

    loadBrowserTab();

}


function browserEnter(event){

    if(event.key === "Enter"){

        browserGo();

    }

}


function browserBack(){

    const tab =
        browserTabs[
            activeBrowserTab
        ];


    if(tab.historyIndex <= 0){

        return;

    }


    tab.historyIndex--;


    tab.url =
        tab.history[
            tab.historyIndex
        ];


    loadBrowserTab();

}


function browserForward(){

    const tab =
        browserTabs[
            activeBrowserTab
        ];


    if(
        tab.historyIndex >=
        tab.history.length - 1
    ){

        return;

    }


    tab.historyIndex++;


    tab.url =
        tab.history[
            tab.historyIndex
        ];


    loadBrowserTab();

}


function browserRefresh(){

    const frame =
        document.getElementById(
            "browserFrame"
        );


    frame.src =
        frame.src;

}


function browserHome(){

    const tab =
        browserTabs[
            activeBrowserTab
        ];


    tab.url =
        "about:blank";


    tab.title =
        "Home";


    loadBrowserTab();

}


/* =====================================================
   BOOKMARK
===================================================== */

function addBookmark(){

    const tab =
        browserTabs[
            activeBrowserTab
        ];


    if(
        tab.url ===
        "about:blank"
    ){

        return;

    }


    let bookmarks =
        JSON.parse(
            localStorage.getItem(
                "browserBookmarks"
            ) ||
            "[]"
        );


    if(
        !bookmarks.some(
            item =>
            item.url === tab.url
        )
    ){

        bookmarks.push({

            title:
                tab.title,

            url:
                tab.url

        });


        localStorage.setItem(

            "browserBookmarks",

            JSON.stringify(
                bookmarks
            )

        );

    }


    renderBookmarks();

}


function renderBookmarks(){

    const box =
        document.getElementById(
            "bookmarkList"
        );


    const bookmarks =
        JSON.parse(

            localStorage.getItem(
                "browserBookmarks"
            )

            ||

            "[]"

        );


    box.innerHTML = "";


    if(!bookmarks.length){

        box.innerHTML =
            "<p style='color:#888'>No bookmarks yet.</p>";

        return;

    }


    bookmarks.forEach(
        function(bookmark,index){

            const item =
                document.createElement("div");

            item.className =
                "list-item";


            const text =
                document.createElement("span");

            text.textContent =
                bookmark.title;


            text.onclick =
                function(){

                    document
                    .getElementById(
                        "browserAddress"
                    )
                    .value =
                    bookmark.url;


                    browserGo();

                };


            const remove =
                document.createElement("button");

            remove.textContent =
                "✕";


            remove.onclick =
                function(){

                    bookmarks.splice(
                        index,
                        1
                    );


                    localStorage.setItem(

                        "browserBookmarks",

                        JSON.stringify(
                            bookmarks
                        )

                    );


                    renderBookmarks();

                };


            item.appendChild(text);

            item.appendChild(remove);

            box.appendChild(item);

        }
    );

}


/* =====================================================
   VIDEO VARIABLES
===================================================== */

let player;

let playerReady = false;

let sheetVideos = [];

let currentIndex = -1;

let localVideos = [];

let localIndex = -1;

let videoMode = "youtube";

let videoHistory = [];


/* =====================================================
   YOUTUBE API READY
===================================================== */

function onYouTubeIframeAPIReady(){

    player =
        new YT.Player(

            "youtubePlayer",

            {

                height:"100%",

                width:"100%",

                videoId:"",

                playerVars:{

                    autoplay:0,

                    controls:1,

                    rel:0,

                    playsinline:1

                },

                events:{

                    onReady:function(){

                        playerReady = true;

                    },

                    onStateChange:
                        onPlayerStateChange

                }

            }

        );

}


function onPlayerStateChange(event){

    if(
        event.data ===
        YT.PlayerState.ENDED
    ){

        if(
            videoMode ===
            "youtube"
        ){

            setTimeout(
                nextVideo,
                500
            );

        }

    }

}


/* =====================================================
   EXTRACT YOUTUBE ID
===================================================== */

function extractVideoID(input){

    if(!input){

        return null;

    }


    input =
        input.trim();


    if(
        /^[a-zA-Z0-9_-]{11}$/
        .test(input)
    ){

        return input;

    }


    try{

        const url =
            new URL(input);


        if(
            url.hostname.includes(
                "youtu.be"
            )
        ){

            return url.pathname
                .split("/")
                .filter(Boolean)[0];

        }


        if(
            url.hostname.includes(
                "youtube.com"
            )
        ){

            let id =
                url.searchParams
                .get("v");


            if(id){

                return id;

            }


            const parts =
                url.pathname
                .split("/");


            const embedIndex =
                parts.indexOf("embed");


            if(
                embedIndex !== -1 &&
                parts[embedIndex + 1]
            ){

                return parts[
                    embedIndex + 1
                ];

            }


            const shortsIndex =
                parts.indexOf("shorts");


            if(
                shortsIndex !== -1 &&
                parts[shortsIndex + 1]
            ){

                return parts[
                    shortsIndex + 1
                ];

            }

        }

    }

    catch(error){

        return null;

    }


    return null;

}


/* =====================================================
   MANUAL YOUTUBE
===================================================== */

function loadManualYouTube(){

    const input =
        document.getElementById(
            "youtubeUrl"
        );


    const id =
        extractVideoID(
            input.value
        );


    if(!id){

        alert(
            "Valid YouTube URL राख्नुहोस्"
        );

        return;

    }


    const index =
        sheetVideos.findIndex(
            video =>
            video.id === id
        );


    if(index !== -1){

        loadYouTubeVideo(index);

        return;

    }


    videoMode =
        "youtube";


    showYouTube();


    currentIndex =
        -1;


    if(
        playerReady
    ){

        player.loadVideoById(id);

        addVideoHistory({

            id:id,

            title:"Manual YouTube Video",

            type:"YouTube"

        });

    }


    input.value = "";

}


/* =====================================================
   LOAD YOUTUBE VIDEO
===================================================== */

function loadYouTubeVideo(index){

    if(
        !sheetVideos.length
    ){

        return;

    }


    if(index < 0){

        index =
            sheetVideos.length - 1;

    }


    if(
        index >=
        sheetVideos.length
    ){

        index = 0;

    }


    currentIndex =
        index;


    const video =
        sheetVideos[index];


    videoMode =
        "youtube";


    showYouTube();


    if(!playerReady){

        setStatus(
            "YouTube player loading..."
        );

        return;

    }


    player.loadVideoById(
        video.id
    );


    setStatus(
        "Playing: " +
        video.title
    );


    addVideoHistory({

        id:video.id,

        title:video.title,

        type:"Google Sheet"

    });


    renderSheetVideos();

}


/* =====================================================
   SHOW YOUTUBE
===================================================== */

function showYouTube(){

    document
        .getElementById(
            "youtubePlayer"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "localPlayer"
        )
        .style.display =
        "none";

}


/* =====================================================
   SHOW LOCAL
===================================================== */

function showLocal(){

    document
        .getElementById(
            "youtubePlayer"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "localPlayer"
        )
        .style.display =
        "block";

}


/* =====================================================
   NEXT VIDEO
===================================================== */

function nextVideo(){

    if(
        videoMode ===
        "local"
    ){

        if(
            !localVideos.length
        ){

            return;

        }


        playLocalVideo(
            localIndex + 1
        );

        return;

    }


    /*
       YouTube Sheet Auto Next
    */

    if(
        !sheetVideos.length
    ){

        return;

    }


    /*
       If manual video,
       start Sheet from first
    */

    if(
        currentIndex === -1
    ){

        currentIndex = 0;

    }

    else{

        currentIndex++;

    }


    if(
        currentIndex >=
        sheetVideos.length
    ){

        currentIndex = 0;

    }


    loadYouTubeVideo(
        currentIndex
    );

}


/* =====================================================
   PREVIOUS VIDEO
===================================================== */

function previousVideo(){

    if(
        videoMode ===
        "local"
    ){

        if(
            !localVideos.length
        ){

            return;

        }


        playLocalVideo(
            localIndex - 1
        );

        return;

    }


    if(
        !sheetVideos.length
    ){

        return;

    }


    if(
        currentIndex <= 0
    ){

        currentIndex =
            sheetVideos.length - 1;

    }

    else{

        currentIndex--;

    }


    loadYouTubeVideo(
        currentIndex
    );

}


/* =====================================================
   PLAY
===================================================== */

function playVideo(){

    if(
        videoMode ===
        "local"
    ){

        document
        .getElementById(
            "localPlayer"
        )
        .play()
        .catch(function(){});

        return;

    }


    if(playerReady){

        player.playVideo();

    }

}


/* =====================================================
   PAUSE
===================================================== */

function pauseVideo(){

    if(
        videoMode ===
        "local"
    ){

        document
        .getElementById(
            "localPlayer"
        )
        .pause();

        return;

    }


    if(playerReady){

        player.pauseVideo();

    }

}


/* =====================================================
   STOP
===================================================== */

function stopVideo(){

    if(
        videoMode ===
        "local"
    ){

        const video =
            document.getElementById(
                "localPlayer"
            );


        video.pause();

        video.currentTime = 0;

        return;

    }


    if(playerReady){

        player.stopVideo();

    }

}


/* =====================================================
   SEEK
===================================================== */

function seekVideo(seconds){

    if(
        videoMode ===
        "local"
    ){

        const video =
            document.getElementById(
                "localPlayer"
            );


        video.currentTime =
            Math.max(

                0,

                video.currentTime +
                seconds

            );

        return;

    }


    if(playerReady){

        const time =
            player.getCurrentTime();


        player.seekTo(

            Math.max(
                0,
                time + seconds
            ),

            true

        );

    }

}


/* =====================================================
   VOLUME
===================================================== */

function changeVolume(value){

    document
        .getElementById(
            "volumeText"
        )
        .textContent =
        value + "%";


    if(
        videoMode ===
        "local"
    ){

        document
        .getElementById(
            "localPlayer"
        )
        .volume =
        value / 100;

        return;

    }


    if(playerReady){

        player.setVolume(
            Number(value)
        );

    }

}


/* =====================================================
   LOCAL VIDEOS
===================================================== */

document
.getElementById(
    "localFiles"
)
.addEventListener(

    "change",

    function(event){

        const files =
            Array.from(
                event.target.files ||
                []
            );


        /*
           Release old URLs
        */

        localVideos.forEach(
            video =>

            URL.revokeObjectURL(
                video.url
            )

        );


        localVideos =
            files.map(
                file => ({

                    title:file.name,

                    url:
                    URL.createObjectURL(
                        file
                    )

                })
            );


        localIndex =
            -1;


        renderLocalVideos();


        if(
            localVideos.length
        ){

            playLocalVideo(0);

        }

    }

);


/* =====================================================
   PLAY LOCAL VIDEO
===================================================== */

function playLocalVideo(index){

    if(
        !localVideos.length
    ){

        return;

    }


    if(index < 0){

        index =
            localVideos.length - 1;

    }


    if(
        index >=
        localVideos.length
    ){

        index = 0;

    }


    localIndex =
        index;


    videoMode =
        "local";


    showLocal();


    const video =
        document.getElementById(
            "localPlayer"
        );


    const item =
        localVideos[index];


    video.src =
        item.url;


    video.volume =
        document
        .getElementById(
            "volume"
        )
        .value / 100;


    video.play()
        .catch(function(){});


    addVideoHistory({

        id:"local-" + index,

        title:item.title,

        type:"Mobile"

    });


    renderLocalVideos();

}

/* =====================================================

===================================================== */

async function loadSheetVideos(){

    setStatus(
        "Loading Google Sheet..."
    );


    try{

        const response =
            await fetch(
                CSV_URL
            );


        if(
            !response.ok
        ){

            throw new Error(
                "Unable to load CSV"
            );

        }


        const csv =
            await response.text();


        sheetVideos =
            parseCSV(csv);


        setStatus(

            sheetVideos.length +

            " videos loaded"

        );


        renderSheetVideos();

    }

    catch(error){

        console.error(error);


        setStatus(
            "❌ Unable to load Google Sheet videos"
        );

    }

}


/* =====================================================
   CSV PARSER
===================================================== */

function parseCSV(csv){

    const lines =
        csv
        .replace(
            /\r/g,
            ""
        )
        .split("\n");


    const videos =
        [];


    /*
       Skip Header
    */

    for(

        let i = 1;

        i < lines.length;

        i++

    ){

        const line =
            lines[i]
            .trim();


        if(!line){

            continue;

        }


        const columns =
            splitCSV(
                line
            );


        if(
            columns.length < 2
        ){

            continue;

        }


        const title =
            columns[0]
            .trim();


        const url =
            columns[1]
            .trim();


        const id =
            extractVideoID(
                url
            );


        if(!id){

            continue;

        }


        videos.push({

            title:

                title ||

                "YouTube Video",

            url:url,

            id:id

        });

    }


    return videos;

}


/* =====================================================
   SPLIT CSV
===================================================== */

function splitCSV(line){

    const result =
        [];

    let current =
        "";

    let insideQuotes =
        false;


    for(

        let i = 0;

        i < line.length;

        i++

    ){

        const char =
            line[i];


        if(
            char === '"'
        ){

            insideQuotes =
                !insideQuotes;

        }


        else if(

            char === "," &&

            !insideQuotes

        ){

            result.push(
                current
            );


            current =
                "";

        }


        else{

            current +=
                char;

        }

    }


    result.push(
        current
    );


    return result.map(

        value =>

        value.replace(
            /^"|"$/g,
            ""
        )

    );

}

/* =====================================================
   VIDEO HISTORY
===================================================== */

function addVideoHistory(video){

    videoHistory =
        videoHistory.filter(

            item =>

            !(

                item.id ===
                video.id

                &&

                item.type ===
                video.type

            )

        );


    videoHistory.unshift(
        video
    );


    if(
        videoHistory.length > 20
    ){

        videoHistory =
            videoHistory.slice(
                0,
                20
            );

    }


    renderVideoHistory();

}


function renderVideoHistory(){

    const box =
        document.getElementById(
            "historyList"
        );


    box.innerHTML =
        "";


    if(
        !videoHistory.length
    ){

        box.innerHTML =
            "<p style='color:#888'>" +
            "No videos played yet." +
            "</p>";

        return;

    }


    videoHistory.forEach(

        function(video){

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "video-item";


            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "video-info";


            const title =
                document.createElement(
                    "div"
                );


            title.className =
                "video-title";


            title.textContent =
                video.title;


            const type =
                document.createElement(

                );


            type.className =
                "video-type";


            type.textContent =

            info.appendChild(
                title
            );


            info.appendChild(
                type
            );


            item.appendChild(
                info
            );


            item.onclick =
                function(){

                    if(

                        "Mobile"
                    ){

                        return;

                    }


                    const index =
                        sheetVideos.findIndex(

                            item =>

                            item.id ===
                            video.id

                        );


                    if(

                    ){

                        loadYouTubeVideo(
                            index
                        );

                    }

                    else{

                        videoMode =
                            "youtube";


                        showYouTube();


                        if(
                            playerReady
                        ){

                            player.loadVideoById(
                                video.id
                            );

                        }

                    }

                };


            box.appendChild(
                item
            );

        }

    );

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(text){

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>YouTube + Browser</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#101010;
    color:#fff;
    font-family:Arial,sans-serif;
}

button,input{
    font:inherit;
}

button{
    border:0;
    border-radius:8px;
    padding:10px 13px;
    background:#292929;
    color:#fff;
    cursor:pointer;
}

button:hover{
    background:#3b3b3b;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #444;
    border-radius:8px;
    background:#1d1d1d;
    color:#fff;
    outline:none;
}

/* =========================
   MAIN TABS
========================= */

.main-tabs{
    display:flex;
    position:sticky;
    top:0;
    z-index:9999;
    background:#181818;
    border-bottom:1px solid #333;
}

.main-tab{
    flex:1;
    padding:15px 10px;
    border-radius:0;
    background:#181818;
    color:#999;
    font-weight:bold;
}

.main-tab.active{
    color:#fff;
    background:#252525;
    border-bottom:3px solid #ff0000;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.container{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:10px;
}

.section{
    background:#181818;
    border-radius:10px;
    padding:12px;
    margin-bottom:12px;
}

.title{
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}

.row{
    display:flex;
    gap:7px;
    margin-bottom:9px;
}

.row input{
    flex:1;
}

/* =========================
   VIDEO PLAYER
========================= */

.player-box{
    width:100%;
    background:#000;
    border-radius:10px;
    overflow:hidden;
}

#youtubePlayer{
    width:100%;
    aspect-ratio:16/9;
}

#localPlayer{
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    display:none;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:10px;
}

.controls button{
    flex:1;
    min-width:80px;
}

.volume{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
}

.volume input{
    width:160px;
    padding:0;
}

/* =========================
   SHEET VIDEO LIST
========================= */

.status{
    color:#aaa;
    font-size:13px;
    margin-bottom:10px;
}

.video-list{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:10px;
}

.video-card{
    background:#242424;
    border-radius:9px;
    overflow:hidden;
    cursor:pointer;
    border:1px solid transparent;
}

.video-card:hover{
    border-color:#666;
}

.video-card img{
    width:100%;
    aspect-ratio:16/9;
    object-fit:cover;
    display:block;
    background:#000;
}

.video-info{
    padding:8px;
}

.video-title{
    font-size:14px;
    line-height:1.35;
}

/* =========================
   LOCAL VIDEOS
========================= */

.file-button{
    display:inline-block;
    background:#292929;
    padding:11px 14px;
    border-radius:8px;
    cursor:pointer;
}

#localFile{
    display:none;
}

.local-list{
    margin-top:10px;
}

.local-item{
    background:#242424;
    padding:10px;
    margin-bottom:6px;
    border-radius:7px;
    cursor:pointer;
}

.local-item.active{
    border-left:3px solid red;
    background:#333;
}

/* =========================
   BROWSER
========================= */

.browser-toolbar{
    background:#181818;
    padding:10px;
    position:sticky;
    top:52px;
    z-index:100;
}

.browser-buttons{
    display:flex;
    gap:6px;
    margin-bottom:8px;
}

.browser-buttons button{
    min-width:42px;
}

.address{
    display:flex;
    gap:7px;
}

.address input{
    flex:1;
}

.browser-info{
    padding:8px;
    background:#222;
    color:#aaa;
    font-size:12px;
}

.browser-frame{
    width:100%;
    height:calc(100vh - 150px);
    min-height:500px;
    background:#fff;
}

#browserFrame{
    width:100%;
    height:100%;
    border:0;
}

.bookmarks,
.history{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.bookmark,
.history-item{
    background:#292929;
    padding:8px 10px;
    border-radius:7px;
    font-size:13px;
    cursor:pointer;
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .video-list{
        grid-template-columns:repeat(2,1fr);
        gap:7px;
    }

    .video-title{
        font-size:12px;
    }

    .controls button{
        min-width:70px;
    }

    .browser-frame{
        height:calc(100vh - 170px);
        min-height:450px;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     MAIN TABS
===================================================== -->

<div class="main-tabs">

    <button
        id="youtubeTabBtn"
        class="main-tab active"
        onclick="switchTab('youtube')">
        📺 YouTube
    </button>

    <button
        id="browserTabBtn"
        class="main-tab"
        onclick="switchTab('browser')">
        🌐 Browser
    </button>

</div>


<!-- =====================================================
     YOUTUBE PAGE
===================================================== -->

<div id="youtubePage" class="page active">

<div class="container">

    <!-- PLAYER -->

    <div class="section">

        <div class="title">
            📺 YouTube Player
        </div>

        <div class="row">

            <input
                id="youtubeUrl"
                placeholder="Paste YouTube URL or Video ID"
                autocomplete="off"
            >

            <button onclick="loadManualURL()">
                ▶ Load
            </button>

        </div>

        <div
            id="manualStatus"
            class="status">
            Ready
        </div>

        <div class="player-box">

            <div id="youtubePlayer"></div>

            <video
                id="localPlayer"
                playsinline
                controls>
            </video>

        </div>


        <!-- CONTROLS -->

        <div class="controls">

            <button onclick="previousVideo()">
                ⏮ Previous
            </button>

            <button onclick="seek(-10)">
                ↶ -10
            </button>

            <button onclick="playCurrent()">
                ▶ Play
            </button>

            <button onclick="pauseCurrent()">
                ⏸ Pause
            </button>

            <button onclick="seek(10)">
                +10 ↷
            </button>

            <button onclick="nextVideo()">
                Next ⏭
            </button>

            <button onclick="stopCurrent()">
                ⏹ Stop
            </button>

        </div>

        <div class="volume">

            🔊

            <input
                id="volume"
                type="range"
                min="0"
                max="100"
                value="100"
                oninput="setVolume(this.value)"
            >

        </div>

    </div>


    <!-- GOOGLE SHEET -->

    <div class="section">

        <div class="title">
            📋 Google Sheet Videos
        </div>

        <div class="row">

            <input
                id="sheetSearch"
                placeholder="Search Sheet videos..."
                oninput="filterSheet()"
            >

            <button onclick="loadSheet()">
                🔄 Refresh
            </button>

        </div>

        <div
            id="sheetStatus"
            class="status">
            Loading...
        </div>

        <div
            id="sheetList"
            class="video-list">
        </div>

    </div>


    <!-- LOCAL OFFLINE -->

    <div class="section">

        <div class="title">
            📱 Offline / Mobile Videos
        </div>

        <label class="file-button">

            ➕ Select Videos

            <input
                id="localFile"
                type="file"
                accept="video/*"
                multiple
            >

        </label>

        <div class="status" style="margin-top:8px">
            Select videos from your phone. They can play locally without
            downloading them to the website.
        </div>

        <div
            id="localList"
            class="local-list">
        </div>

    </div>

</div>
</div>


<!-- =====================================================
     BROWSER PAGE
===================================================== -->

<div id="browserPage" class="page">

    <div class="browser-toolbar">

        <div class="browser-buttons">

            <button onclick="browserBack()">◀</button>

            <button onclick="browserForward()">▶</button>

            <button onclick="browserRefresh()">🔄</button>

            <button onclick="browserHome()">🏠</button>

            <button onclick="bookmarkCurrent()">⭐</button>

            <button onclick="scrollHistory()">🕘</button>

        </div>

        <div class="address">

            <input
                id="browserUrl"
                placeholder="Search or enter website..."
                onkeydown="browserEnter(event)"
            >

            <button onclick="navigateBrowser()">
                Go
            </button>

        </div>

    </div>

    <div class="browser-info">
        🌐 Some websites may block iframe loading because of their security settings.
    </div>

    <div class="browser-frame">

        <iframe
            id="browserFrame"
            src="https://www.google.com"
            allowfullscreen>
        </iframe>

    </div>


    <div class="container">

        <div class="section">

            <div class="title">
                ⭐ Bookmarks
            </div>

            <div
                id="bookmarkList"
                class="bookmarks">
            </div>

        </div>

        <div class="section">

            <div class="title">
                🕘 History
            </div>

            <div
                id="historyList"
                class="history">
            </div>

        </div>

    </div>

</div>


<!-- =====================================================
     YOUTUBE API
===================================================== -->

<script src="https://www.youtube.com/iframe_api"></script>

<script>

/* =====================================================
   CONFIG
===================================================== */

const SHEET_URL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQfLCxJaz-eDFB7SGeROjZDepLOHg1ZggZhYf5kfWJc8S-l1H9frmOshuakfD7_4ocFZd2tvRvEaLN9/pub?gid=281133690&single=true&output=csv";


const HOME_URL =
"https://www.google.com";


/* =====================================================
   GLOBAL STATE
===================================================== */

let ytPlayer = null;

let ytReady = false;

let sheetVideos = [];

let visibleVideos = [];

let currentSheetIndex = -1;

let currentMode = "youtube";

let manualVideoId = null;

let localVideos = [];

let localIndex = -1;


/* =====================================================
   MAIN TAB
===================================================== */

function switchTab(tab){

    const youtube =
        document.getElementById("youtubePage");

    const browser =
        document.getElementById("browserPage");

    const youtubeBtn =
        document.getElementById("youtubeTabBtn");

    const browserBtn =
        document.getElementById("browserTabBtn");


    if(tab === "youtube"){

        youtube.classList.add("active");
        browser.classList.remove("active");

        youtubeBtn.classList.add("active");
        browserBtn.classList.remove("active");

    }else{

        browser.classList.add("active");
        youtube.classList.remove("active");

        browserBtn.classList.add("active");
        youtubeBtn.classList.remove("active");

    }

}


/* =====================================================
   YOUTUBE API READY
===================================================== */

function onYouTubeIframeAPIReady(){

    ytPlayer = new YT.Player(
        "youtubePlayer",
        {
            width:"100%",
            height:"100%",

            playerVars:{
                autoplay:0,
                controls:1,
                rel:0,
                playsinline:1,
                modestbranding:1
            },

            events:{
                onReady:youtubeReadyFunction,
                onStateChange:youtubeStateChange,
                onError:youtubeError
            }
        }
    );

}


/* =====================================================
   YOUTUBE READY
===================================================== */

function youtubeReadyFunction(){

    ytReady = true;

    ytPlayer.setVolume(
        Number(
            document.getElementById("volume").value
        )
    );

    setStatus("YouTube player ready.");

    loadSheet();

}


/* =====================================================
   YOUTUBE STATE
===================================================== */

function youtubeStateChange(event){

    if(
        event.data === YT.PlayerState.ENDED
    ){

        if(currentMode === "youtube"){

            nextVideo();

        }

    }

}


/* =====================================================
   YOUTUBE ERROR
===================================================== */

function youtubeError(event){

    let message =
        "YouTube playback error.";

    if(event.data === 2){
        message =
            "❌ Invalid YouTube Video ID.";
    }

    if(event.data === 5){
        message =
            "❌ HTML5 player error.";
    }

    if(event.data === 100){
        message =
            "❌ Video not found or removed.";
    }

    if(event.data === 101 ||
       event.data === 150){

        message =
            "❌ This video does not allow embedding.";
    }

    setStatus(message);

}


/* =====================================================
   SHOW YOUTUBE
===================================================== */

function showYouTube(){

    currentMode = "youtube";

    document
        .getElementById("youtubePlayer")
        .style.display = "block";

    document
        .getElementById("localPlayer")
        .style.display = "none";

}


/* =====================================================
   SHOW LOCAL
===================================================== */

function showLocal(){

    currentMode = "local";

    document
        .getElementById("youtubePlayer")
        .style.display = "none";

    document
        .getElementById("localPlayer")
        .style.display = "block";

}


/* =====================================================
   SET STATUS
===================================================== */

function setStatus(text){

    document
        .getElementById("manualStatus")
        .textContent = text;

}


/* =====================================================
   EXTRACT VIDEO ID
===================================================== */

function getYouTubeID(value){

    if(!value){
        return null;
    }

    let text =
        String(value).trim();


    /*
       CASE 1
       Direct 11 character ID
    */

    if(
        /^[A-Za-z0-9_-]{11}$/.test(text)
    ){

        return text;

    }


    /*
       CASE 2
       URL
    */

    try{

        /*
           Add https if missing
        */

        let urlText = text;

        if(
            !/^https?:\/\//i.test(urlText)
        ){

            urlText =
                "https://" + urlText;

        }

        const url =
            new URL(urlText);


        /*
           youtube.com/watch?v=
        */

        const v =
            url.searchParams.get("v");

        if(
            v &&
            /^[A-Za-z0-9_-]{11}$/.test(v)
        ){

            return v;

        }


        /*
           youtu.be/VIDEOID
        */

        if(
            url.hostname === "youtu.be" ||
            url.hostname.endsWith(".youtu.be")
        ){

            const id =
                url.pathname
                    .split("/")
                    .filter(Boolean)[0];

            if(
                id &&
                /^[A-Za-z0-9_-]{11}$/.test(id)
            ){

                return id;

            }

        }


        /*
           youtube.com/embed/VIDEOID
           youtube.com/shorts/VIDEOID
           youtube.com/live/VIDEOID
        */

        const parts =
            url.pathname
                .split("/")
                .filter(Boolean);


        const types = [
            "embed",
            "shorts",
            "live"
        ];


        for(
            let i=0;
            i<parts.length;
            i++
        ){

            if(
                types.includes(
                    parts[i].toLowerCase()
                )
            ){

                const id =
                    parts[i+1];

                if(
                    id &&
                    /^[A-Za-z0-9_-]{11}$/.test(id)
                ){

                    return id;

                }

            }

        }

    }catch(error){

        console.log(
            "YouTube URL parse:",
            error
        );

    }


    return null;

}


/* =====================================================
   MANUAL URL LOAD
===================================================== */

function loadManualURL(){

    const input =
        document.getElementById(
            "youtubeUrl"
        );

    const value =
        input.value.trim();


    if(!value){

        setStatus(
            "❌ Paste a YouTube URL first."
        );

        return;

    }


    const videoId =
        getYouTubeID(value);


    if(!videoId){

        setStatus(
            "❌ YouTube video ID could not be found."
        );

        return;

    }


    /*
       IMPORTANT:
       Search the Google Sheet for the same ID.
    */

    const index =
        sheetVideos.findIndex(
            video =>
                getYouTubeID(video.url) === videoId
        );


    if(index !== -1){

        /*
           It is a Sheet video.
        */

        currentSheetIndex = index;

    }else{

        /*
           Standalone manual video.
        */

        currentSheetIndex = -1;

    }


    manualVideoId = videoId;

    showYouTube();


    /*
       Wait until API is ready.
    */

    if(!ytReady || !ytPlayer){

        setStatus(
            "⏳ YouTube player is still loading..."
        );

        /*
           Try again after API loads.
        */

        setTimeout(
            () => loadManualURL(),
            1000
        );

        return;

    }


    try{

        ytPlayer.loadVideoById({
            videoId:videoId,
            startSeconds:0
        });


        ytPlayer.playVideo();


        setStatus(
            "▶ Playing YouTube video"
        );


        /*
           Add to history.
        */

        addVideoHistory(
            index !== -1
                ? sheetVideos[index].title
                : "YouTube Video",
            videoId
        );


    }catch(error){

        console.error(error);

        setStatus(
            "❌ Could not load YouTube video."
        );

    }

}


/* =====================================================
   SHEET LOAD
===================================================== */

async function loadSheet(){

    const status =
        document.getElementById(
            "sheetStatus"
        );

    status.textContent =
        "⏳ Loading Google Sheet...";


    try{

        const response =
            await fetch(
                SHEET_URL +
                "&cache=" +
                Date.now()
            );


        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }


        const csv =
            await response.text();


        sheetVideos =
            parseCSV(csv);


        visibleVideos =
            [...sheetVideos];


        renderSheet();


        status.textContent =
            "✅ " +
            sheetVideos.length +
            " videos loaded.";


    }catch(error){

        console.error(error);

        status.textContent =
            "❌ Google Sheet load failed.";

    }

}


/* =====================================================
   CSV PARSER
===================================================== */

function parseCSV(text){

    const rows = [];

    let row = [];

    let cell = "";

    let quote = false;


    for(
        let i=0;
        i<text.length;
        i++
    ){

        const c = text[i];

        const next = text[i+1];


        if(c === '"' && next === '"'){

            cell += '"';

            i++;

            continue;

        }


        if(c === '"'){

            quote = !quote;

            continue;

        }


        if(
            c === "," &&
            !quote
        ){

            row.push(cell.trim());

            cell = "";

            continue;

        }


        if(
            (c === "\n" || c === "\r") &&
            !quote
        ){

            if(
                c === "\r" &&
                next === "\n"
            ){

                i++;

            }


            row.push(cell.trim());


            if(
                row.some(
                    x => x !== ""
                )
            ){

                rows.push(row);

            }


            row = [];

            cell = "";

            continue;

        }


        cell += c;

    }


    if(
        cell !== "" ||
        row.length
    ){

        row.push(cell.trim());

        if(
            row.some(
                x => x !== ""
            )
        ){

            rows.push(row);

        }

    }


    /*
       First row = header
       Expected:
       Title,URL
    */

    if(rows.length <= 1){

        return [];

    }


    return rows
        .slice(1)
        .map(row => ({

            title:
                row[0] ||
                "Untitled",

            url:
                row[1] ||
                ""

        }))
        .filter(
            video =>
                getYouTubeID(video.url)
        );

}


/* =====================================================
   RENDER SHEET
===================================================== */

function renderSheet(){

    const list =
        document.getElementById(
            "sheetList"
        );

    list.innerHTML = "";


    visibleVideos.forEach(
        video => {

            const id =
                getYouTubeID(
                    video.url
                );


            if(!id){
                return;
            }


            const index =
                sheetVideos.indexOf(video);


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "video-card";


            card.onclick = () =>
                playSheet(index);


            card.innerHTML = `

                <img
                    src="https://img.youtube.com/vi/${id}/hqdefault.jpg"
                    loading="lazy"
                    alt=""
                >

                <div class="video-info">

                    <div class="video-title">
                        ${escapeHTML(video.title)}
                    </div>

                    <div class="status">
                        ▶ YouTube
                    </div>

                </div>
            `;


            list.appendChild(card);

        }
    );

}


/* =====================================================
   SHEET SEARCH
===================================================== */

function filterSheet(){

    const q =
        document
            .getElementById(
                "sheetSearch"
            )
            .value
            .toLowerCase()
            .trim();


    visibleVideos =
        sheetVideos.filter(
            video =>
                video.title
                    .toLowerCase()
                    .includes(q)
        );


    renderSheet();

}


/* =====================================================
   PLAY SHEET VIDEO
===================================================== */

function playSheet(index){

    if(
        index < 0 ||
        index >= sheetVideos.length
    ){

        return;

    }


    const video =
        sheetVideos[index];


    const id =
        getYouTubeID(
            video.url
        );


    if(!id){

        return;

    }


    currentSheetIndex =
        index;


    manualVideoId =
        null;


    showYouTube();


    document
        .getElementById(
            "youtubeUrl"
        )
        .value =
        video.url;


    if(!ytReady){

        setStatus(
            "⏳ YouTube player loading..."
        );

        return;

    }


    ytPlayer.loadVideoById(id);

    ytPlayer.playVideo();


    setStatus(
        "▶ " + video.title
    );


    addVideoHistory(
        video.title,
        id
    );

}


/* =====================================================
   NEXT
===================================================== */

function nextVideo(){

    /*
       LOCAL
    */

    if(
        currentMode === "local"
    ){

        if(
            localIndex + 1 <
            localVideos.length
        ){

            localIndex++;

            playLocal(
                localIndex
            );

        }

        return;

    }


    /*
       YOUTUBE
    */

    if(
        sheetVideos.length === 0
    ){

        return;

    }


    /*
       If manual video was playing
       and not part of Sheet:
       start first Sheet video.
    */

    if(
        currentSheetIndex === -1
    ){

        currentSheetIndex = 0;

    }else{

        currentSheetIndex++;

    }


    if(
        currentSheetIndex >=
        sheetVideos.length
    ){

        currentSheetIndex = 0;

    }


    playSheet(
        currentSheetIndex
    );

}


/* =====================================================
   PREVIOUS
===================================================== */

function previousVideo(){

    if(
        currentMode === "local"
    ){

        if(
            localIndex > 0
        ){

            localIndex--;

            playLocal(
                localIndex
            );

        }

        return;

    }


    if(
        sheetVideos.length === 0
    ){

        return;

    }


    if(
        currentSheetIndex === -1
    ){

        currentSheetIndex =
            sheetVideos.length - 1;

    }else{

        currentSheetIndex--;

        if(
            currentSheetIndex < 0
        ){

            currentSheetIndex =
                sheetVideos.length - 1;

        }

    }


    playSheet(
        currentSheetIndex
    );

}


/* =====================================================
   PLAY
===================================================== */

function playCurrent(){

    if(
        currentMode === "local"
    ){

        const video =
            document.getElementById(
                "localPlayer"
            );

        video.play().catch(
            ()=>{}
        );

        return;

    }


    if(
        ytReady &&
        ytPlayer
    ){

        ytPlayer.playVideo();

    }

}


/* =====================================================
   PAUSE
===================================================== */

function pauseCurrent(){

    if(
        currentMode === "local"
    ){

        document
            .getElementById(
                "localPlayer"
            )
            .pause();

        return;

    }


    if(
        ytReady &&
        ytPlayer
    ){

        ytPlayer.pauseVideo();

    }

}


/* =====================================================
   STOP
===================================================== */

function stopCurrent(){

    if(
        currentMode === "local"
    ){

        const video =
            document.getElementById(
                "localPlayer"
            );

        video.pause();

        video.currentTime = 0;

        return;

    }


    if(
        ytReady &&
        ytPlayer
    ){

        ytPlayer.stopVideo();

    }

}


/* =====================================================
   SEEK
===================================================== */

function seek(seconds){

    if(
        currentMode === "local"
    ){

        const video =
            document.getElementById(
                "localPlayer"
            );


        video.currentTime =
            Math.max(
                0,
                Math.min(
                    video.duration || Infinity,
                    video.currentTime + seconds
                )
            );

        return;

    }


    if(
        ytReady &&
        ytPlayer
    ){

        const now =
            ytPlayer.getCurrentTime();


        ytPlayer.seekTo(
            Math.max(
                0,
                now + seconds
            ),
            true
        );

    }

}


/* =====================================================
   VOLUME
===================================================== */

function setVolume(value){

    const volume =
        Number(value);


    if(
        currentMode === "local"
    ){

        document
            .getElementById(
                "localPlayer"
            )
            .volume =
            volume / 100;

        return;

    }


    if(
        ytReady &&
        ytPlayer
    ){

        ytPlayer.setVolume(
            volume
        );

    }

}


/* =====================================================
   LOCAL FILES
===================================================== */

document
    .getElementById(
        "localFile"
    )
    .addEventListener(
        "change",
        function(event){

            const files =
                Array.from(
                    event.target.files || []
                );


            if(
                files.length === 0
            ){

                return;

            }


            /*
               Release old URLs.
            */

            localVideos.forEach(
                video => {

                    try{
                        URL.revokeObjectURL(
                            video.url
                        );
                    }catch(e){}

                }
            );


            localVideos =
                files.map(
                    file => ({

                        name:file.name,

                        url:
                            URL.createObjectURL(
                                file
                            )

                    })
                );


            localIndex = 0;


            renderLocal();


            playLocal(0);

        }
    );


/* =====================================================
   LOCAL LIST
===================================================== */

function renderLocal(){

    const list =
        document.getElementById(
            "localList"
        );


    list.innerHTML = "";


    localVideos.forEach(
        (video,index) => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "local-item" +
                (
                    index === localIndex
                    ? " active"
                    : ""
                );


            item.textContent =
                "▶ " + video.name;


            item.onclick = () =>
                playLocal(index);


            list.appendChild(item);

        }
    );

}


/* =====================================================
   PLAY LOCAL
===================================================== */

function playLocal(index){

    if(
        index < 0 ||
        index >= localVideos.length
    ){

        return;

    }


    localIndex = index;

    showLocal();


    const video =
        document.getElementById(
            "localPlayer"
        );


    video.src =
        localVideos[index].url;


    video.load();


    video.play().catch(
        error => {
            console.log(
                "Local autoplay:",
                error
            );
        }
    );


    renderLocal();


    setStatus(
        "📱 " +
        localVideos[index].name
    );

}


/* =====================================================
   LOCAL AUTO NEXT
===================================================== */

document
    .getElementById(
        "localPlayer"
    )
    .addEventListener(
        "ended",
        function(){

            if(
                currentMode !== "local"
            ){

                return;

            }


            if(
                localIndex + 1 <
                localVideos.length
            ){

                localIndex++;

                playLocal(
                    localIndex
                );

            }

        }
    );


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   VIDEO HISTORY
===================================================== */

function addVideoHistory(
    title,
    id
){

    try{

        let history =
            JSON.parse(
                localStorage.getItem(
                    "videoHistory"
                ) || "[]"
            );


        history.unshift({

            title:title,

            id:id,

            time:Date.now()

        });


        history =
            history.slice(
                0,
                50
            );


        localStorage.setItem(
            "videoHistory",
            JSON.stringify(history)
        );

    }catch(e){}

}


/* =====================================================
   BROWSER
===================================================== */

let browserHistory =
    JSON.parse(
        localStorage.getItem(
            "browserHistory"
        ) || "[]"
    );


let bookmarks =
    JSON.parse(
        localStorage.getItem(
            "browserBookmarks"
        ) || "[]"
    );


/* =====================================================
   NORMALIZE URL
===================================================== */

function normalizeURL(value){

    value =
        value.trim();


    if(!value){

        return HOME_URL;

    }


    if(
        /^https?:\/\//i.test(value)
    ){

        return value;

    }


    if(
        value.includes(".") &&
        !value.includes(" ")
    ){

        return "https://" + value;

    }


    return (
        "https://www.google.com/search?q=" +
        encodeURIComponent(value)
    );

}


/* =====================================================
   NAVIGATE
===================================================== */

function navigateBrowser(){

    const input =
        document.getElementById(
            "browserUrl"
        );


    const url =
        normalizeURL(
            input.value
        );


    input.value = url;


    document
        .getElementById(
            "browserFrame"
        )
        .src = url;


    addBrowserHistory(url);

}


function browserEnter(event){

    if(
        event.key === "Enter"
    ){

        navigateBrowser();

    }

}


/* =====================================================
   BACK
===================================================== */

function browserBack(){

    try{

        document
            .getElementById(
                "browserFrame"
            )
            .contentWindow
            .history
            .back();

    }catch(e){}

}


/* =====================================================
   FORWARD
===================================================== */

function browserForward(){

    try{

        document
            .getElementById(
                "browserFrame"
            )
            .contentWindow
            .history
            .forward();

    }catch(e){}

}


/* =====================================================
   REFRESH
===================================================== */

function browserRefresh(){

    const frame =
        document.getElementById(
            "browserFrame"
        );


    try{

        frame.contentWindow.location.reload();

    }catch(e){

        frame.src =
            frame.src;

    }

}


/* =====================================================
   HOME
===================================================== */

function browserHome(){

    const frame =
        document.getElementById(
            "browserFrame"
        );


    frame.src =
        HOME_URL;


    document
        .getElementById(
            "browserUrl"
        )
        .value =
        HOME_URL;


    addBrowserHistory(
        HOME_URL
    );

}


/* =====================================================
   BOOKMARK
===================================================== */

function bookmarkCurrent(){

    const url =
        document
            .getElementById(
                "browserUrl"
            )
            .value
            .trim();


    if(!url){

        return;

    }


    if(
        !bookmarks.includes(url)
    ){

        bookmarks.unshift(url);

        bookmarks =
            bookmarks.slice(
                0,
                30
            );


        localStorage.setItem(
            "browserBookmarks",
            JSON.stringify(bookmarks)
        );

    }


    renderBookmarks();

}


/* =====================================================
   RENDER BOOKMARKS
===================================================== */

function renderBookmarks(){

    const list =
        document.getElementById(
            "bookmarkList"
        );


    list.innerHTML = "";


    bookmarks.forEach(
        url => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "bookmark";


            item.textContent =
                "⭐ " + shortURL(url);


            item.onclick = function(){

                document
                    .getElementById(
                        "browserUrl"
                    )
                    .value = url;


                document
                    .getElementById(
                        "browserFrame"
                    )
                    .src = url;


                addBrowserHistory(url);

            };


            list.appendChild(item);

        }
    );

}


/* =====================================================
   HISTORY
===================================================== */

function addBrowserHistory(url){

    browserHistory =
        browserHistory.filter(
            x => x !== url
        );


    browserHistory.unshift(url);


    browserHistory =
        browserHistory.slice(
            0,
            50
        );


    localStorage.setItem(
        "browserHistory",
        JSON.stringify(browserHistory)
    );


    renderHistory();

}


function renderHistory(){

    const list =
        document.getElementById(
            "historyList"
        );


    list.innerHTML = "";


    browserHistory
        .slice(0,20)
        .forEach(
            url => {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "history-item";


                item.textContent =
                    "🕘 " +
                    shortURL(url);


                item.onclick = function(){

                    document
                        .getElementById(
                            "browserUrl"
                        )
                        .value = url;


                    document
                        .getElementById(
                            "browserFrame"
                        )
                        .src = url;

                };


                list.appendChild(item);

            }
        );

}


function scrollHistory(){

    document
        .getElementById(
            "historyList"
        )
        .scrollIntoView({
            behavior:"smooth"
        });

}


/* =====================================================
   SHORT URL
===================================================== */

function shortURL(url){

    try{

        const u =
            new URL(url);

        return (
            u.hostname +
            u.pathname.substring(
                0,
                25
            )
        );

    }catch(e){

        return url.substring(
            0,
            40
        );

    }

}


/* =====================================================
   BROWSER INITIALIZE
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        document
            .getElementById(
                "browserUrl"
            )
            .value =
            HOME_URL;


        renderBookmarks();

        renderHistory();

    }
);

</script>

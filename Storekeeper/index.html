<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Entry</title>
<style>
body{font-family:Arial;background:#f4f4f4;margin:20px}
.container{max-width:900px;margin:auto;background:#fff;padding:20px;border-radius:8px;box-shadow:0 0 10px #ccc}
input{width:100%;padding:10px;margin:8px 0;box-sizing:border-box}
button{padding:10px 16px;margin:5px;border:none;border-radius:4px;cursor:pointer}
.add{background:#28a745;color:#fff}.export{background:#007bff;color:#fff}.delete{background:#dc3545;color:#fff}
table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
th{background:#007bff;color:#fff}
</style>
</head>
<body>
<div class="container">
<h2>Member Entry</h2>
<input id="eid" placeholder="Emirates ID">
<input id="name" placeholder="Name">
<input id="company" placeholder="Company">
<input id="search" placeholder="Search..." onkeyup="showMembers()">
<button class="add" onclick="addMember()">Add Member</button>
<button class="export" onclick="exportCSV()">Export CSV</button>
<table>
<thead><tr><th>SN</th><th>Emirates ID</th><th>Name</th><th>Company</th><th>Action</th></tr></thead>
<tbody id="memberTable"></tbody>
</table>
</div>
<hr>

<div class="container">
<h2>Store Item Entry (Stock Master)</h2>

<input id="itemName" placeholder="Item Name">
<input id="itemQty" type="number" placeholder="Quantity">
<input id="itemPrice" type="number" placeholder="Unit Price">

<input id="itemSearch" placeholder="Search Item..." onkeyup="showItems()">

<button class="add" onclick="addItem()">Add Item</button>
<button class="export" onclick="exportItemsCSV()">Export CSV</button>

<table>
<thead>
<tr>
<th>SN</th>
<th>Item Name</th>
<th>Qty</th>
<th>Price</th>
<th>Total</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="itemTable"></tbody>

</table>
</div>
<hr>

<div class="container">

<h2>Member Item Issue / Return System</h2>

<input id="issueID" placeholder="Member Emirates ID">

<input id="issueItem" placeholder="Item Name">

<input id="issueQty" type="number" placeholder="Issue Quantity">


<button class="add" onclick="issueItem()">
Issue Item
</button>


<br><br>

<input id="returnID" placeholder="Member Emirates ID">

<input id="returnItem" placeholder="Return Item Name">

<input id="returnQty" type="number" placeholder="Return Quantity">


<button class="export" onclick="returnItem()">
Return Item
</button>


<h3>Member Item History</h3>

<input id="historySearch" 
placeholder="Search Member ID..." 
onkeyup="showHistory()">



<table>

<thead>

<tr>
<th>SN</th>
<th>Member ID</th>
<th>Item</th>
<th>Qty</th>
<th>Date</th>
<th>Status</th>
</tr>

</thead>


<tbody id="historyTable"></tbody>

</table>


<h3>Member Status</h3>

<table>

<thead>
<tr>
<th>Member ID</th>
<th>Status</th>
</tr>
</thead>

<tbody id="statusTable"></tbody>

</table>


</div>


<script>


let transactions =
JSON.parse(localStorage.getItem("transactions")||"[]");



function saveTransactions(){

localStorage.setItem(
"transactions",
JSON.stringify(transactions)
);

}




// ISSUE ITEM

function issueItem(){

let id=issueID.value.trim();
let item=issueItem.value.trim();
let qty=parseInt(issueQty.value);


if(!id || !item || !qty){

alert("Fill all details");
return;

}


// Check stock

let stock=items.find(
x=>x.name==item
);


if(!stock || stock.qty<qty){

alert("Stock not available");
return;

}


// reduce stock

stock.qty-=qty;



transactions.push({

id:id,
item:item,
qty:qty,
type:"ISSUE",
date:new Date().toLocaleString()

});


saveItems();
saveTransactions();

showItems();
showHistory();
showStatus();


alert("Item Issued");


}



// RETURN ITEM

function returnItem(){

let id=returnID.value.trim();
let item=returnItem.value.trim();
let qty=parseInt(returnQty.value);


if(!id||!item||!qty){

alert("Fill all details");
return;

}


// add stock back

let stock=items.find(
x=>x.name==item
);


if(stock){

stock.qty+=qty;

}



transactions.push({

id:id,
item:item,
qty:qty,
type:"RETURN",
date:new Date().toLocaleString()

});


saveItems();
saveTransactions();


showItems();
showHistory();
showStatus();


alert("Item Returned");

}





// HISTORY

function showHistory(){


let key=
historySearch.value.toLowerCase();


historyTable.innerHTML="";


transactions
.filter(x=>
x.id.toLowerCase()
.includes(key)
)
.forEach((x,i)=>{


historyTable.innerHTML+=`

<tr>

<td>${i+1}</td>

<td>${x.id}</td>

<td>${x.item}</td>

<td>${x.qty}</td>

<td>${x.date}</td>

<td>${x.type}</td>

</tr>

`;

});


}




// STATUS CHECK

function showStatus(){


statusTable.innerHTML="";


members.forEach(m=>{


let pending=0;


transactions
.filter(t=>t.id==m.eid)
.forEach(t=>{


if(t.type=="ISSUE")
pending+=t.qty;


if(t.type=="RETURN")
pending-=t.qty;


});



let status=
pending>0?
"BLOCKED - Item Not Returned":
"CLEAR";



statusTable.innerHTML+=`

<tr>

<td>${m.eid}</td>

<td>${status}</td>

</tr>

`;

});


}


showHistory();
showStatus();



<script>

let items=JSON.parse(localStorage.getItem("items")||"[]");


function saveItems(){
localStorage.setItem("items",JSON.stringify(items));
}


function addItem(){

let name=itemName.value.trim();
let qty=parseInt(itemQty.value);
let price=parseFloat(itemPrice.value);


if(!name || !qty || !price){
alert("Fill all item details");
return;
}


items.push({
name:name,
qty:qty,
price:price,
status:"Available"
});


saveItems();
showItems();


itemName.value="";
itemQty.value="";
itemPrice.value="";

}



function deleteItem(index){

items.splice(index,1);
saveItems();
showItems();

}



function showItems(){

let key=itemSearch.value.toLowerCase();

itemTable.innerHTML="";


items.filter(x=>
x.name.toLowerCase().includes(key)
)
.forEach((x,i)=>{


itemTable.innerHTML+=`

<tr>

<td>${i+1}</td>

<td>${x.name}</td>

<td>${x.qty}</td>

<td>${x.price}</td>

<td>${x.qty*x.price}</td>

<td>${x.status}</td>


<td>
<button class="delete" onclick="deleteItem(${i})">
Delete
</button>
</td>

</tr>

`;

});


}



function exportItemsCSV(){

let csv="SN,Item Name,Qty,Price,Total,Status\n";


items.forEach((x,i)=>{

csv+=`${i+1},"${x.name}",${x.qty},${x.price},${x.qty*x.price},"${x.status}"\n`;

});


let blob=new Blob([csv],{type:"text/csv"});

let a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download="Store_Items.csv";

a.click();

}


showItems();


let members=JSON.parse(localStorage.getItem("members")||"[]");
function save(){localStorage.setItem("members",JSON.stringify(members));}
function addMember(){
const eid=eidEl.value.trim(),name=nameEl.value.trim(),company=companyEl.value.trim();
if(!eid||!name||!company){alert("Fill all fields");return;}
if(members.some(x=>x.eid===eid)){alert("Duplicate Emirates ID");return;}
members.push({eid,name,company});save();showMembers();
eidEl.value="";nameEl.value="";companyEl.value="";
}
function deleteMember(id){members=members.filter(x=>x.eid!==id);save();showMembers();}
function showMembers(){
const k=search.value.toLowerCase();
memberTable.innerHTML="";
members.filter(x=>x.eid.toLowerCase().includes(k)||x.name.toLowerCase().includes(k)||x.company.toLowerCase().includes(k))
.forEach((m,i)=>{
memberTable.innerHTML+=`<tr><td>${i+1}</td><td>${m.eid}</td><td>${m.name}</td><td>${m.company}</td><td><button class="delete" onclick="deleteMember('${m.eid}')">Delete</button></td></tr>`;
});
}
function exportCSV(){
let csv="SN,Emirates ID,Name,Company\n";
members.forEach((m,i)=>csv+=`${i+1},"${m.eid}","${m.name}","${m.company}"\n`);
const blob=new Blob([csv],{type:"text/csv"});
const a=document.createElement("a");
a.href=URL.createObjectURL(blob);a.download="Members.csv";a.click();
}
const eidEl=document.getElementById("eid");
const nameEl=document.getElementById("name");
const companyEl=document.getElementById("company");
showMembers();
</script>
</body></html>
